<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29卒インターン面接準備｜10問回答メモ・練習チェック｜就活コンパス</title><meta name="description" content="29卒向けインターン面接の想定質問10問。回答メモと準備状況を整理しTXT保存できる無料ワーク。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-internship-interview-prep.html"><style>:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#182a40;font-family:system-ui,-apple-system,sans-serif;line-height:1.65}main{max-width:820px;margin:auto;padding:24px 16px 70px}header,section{background:white;border:1px solid #dce4ed;border-radius:16px;padding:22px;margin:14px 0}h1{font-size:clamp(1.45rem,4vw,2rem);line-height:1.35}a{color:#165a9f}label{display:block;font-weight:650;margin:12px 0 6px}textarea,input,select{font:inherit;width:100%;border:1px solid #9daebd;border-radius:8px;padding:10px;background:white}textarea{min-height:160px;resize:vertical}button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:11px 14px;background:#174d83;color:white;margin:5px 5px 5px 0}button.secondary{background:#e7eef6;color:#18334c}button:focus-visible,a:focus-visible{outline:3px solid #f5a623;outline-offset:2px}.muted{color:#52657b;font-size:.92rem}.bar{height:12px;border-radius:20px;background:#e0e9f1;overflow:hidden}.bar>div{height:100%;width:0;background:#23775c;transition:width .15s}.pill{font-weight:700}@media(max-width:420px){header,section{padding:16px}button{width:100%;margin:5px 0}}</style></head><body><main><header><p><a href="./index.html">就活コンパス トップ</a> / 29卒</p><h1>インターン面接準備 10問ワーク</h1><p>質問ごとに具体例と回答を整理。準備済みを記録して、面接前にまとめて見直せます。</p><p class="muted">想定質問であり、企業の実際の選考内容や合否を予測するものではありません。</p></header><section><h2>準備の進捗</h2><p class="pill" id="progress">0 / 10問 準備済み</p><div class="bar" aria-hidden="true"><div id="bar"></div></div><label for="question">練習する質問</label><select id="question"><option value="0">1. なぜこの業界に興味を持ったか</option><option value="1">2. なぜ当社のインターンに参加したいか</option><option value="2">3. 学生時代に力を入れたこと</option><option value="3">4. 困難に直面したときの行動</option><option value="4">5. チームで意見が分かれた経験</option><option value="5">6. 自分の強みとその根拠</option><option value="6">7. 自分の弱みと改善行動</option><option value="7">8. インターンで学びたいこと</option><option value="8">9. 最近気になった業界ニュース</option><option value="9">10. 社員に聞きたい質問</option></select><label for="example">経験・事実（状況／行動／結果）</label><textarea id="example" placeholder="例：取り組みの背景、役割、行動、数字や結果"></textarea><label for="answer">面接で伝える回答メモ</label><textarea id="answer" placeholder="結論→理由→具体例→学び、の順に整理"></textarea><label><input type="checkbox" id="done" style="width:auto"> この質問の回答を準備済みにする</label><p class="muted" id="counter">回答メモ 0文字</p><button id="prev" class="secondary">前の質問</button><button id="next">次の質問</button></section><section><h2>メモの持ち出し</h2><button id="download">全10問をTXT保存</button><button id="copy" class="secondary">全10問をコピー</button><button id="clear" class="secondary">全入力を削除</button><p id="status" role="status" aria-live="polite"></p><p class="muted">入力はこのページ内でのみ保持し、自動保存・外部送信はしません。ページを閉じる前にTXT保存してください。個人情報を含む場合は保存先と共有に注意してください。</p></section></main><script>'use strict';const questions=["なぜこの業界に興味を持ったか", "なぜ当社のインターンに参加したいか", "学生時代に力を入れたこと", "困難に直面したときの行動", "チームで意見が分かれた経験", "自分の強みとその根拠", "自分の弱みと改善行動", "インターンで学びたいこと", "最近気になった業界ニュース", "社員に聞きたい質問"];const state=questions.map(()=>({example:'',answer:'',done:false}));const $=id=>document.getElementById(id);let current=0;function save(){const x=state[current];x.example=$('example').value;x.answer=$('answer').value;x.done=$('done').checked;update()}function update(){const n=state.filter(x=>x.done).length;$('progress').textContent=`${n} / 10問 準備済み`;$('bar').style.width=(n*10)+'%';$('counter').textContent=`回答メモ ${$('answer').value.length}文字`}function show(i){current=(i+questions.length)%questions.length;$('question').value=String(current);const x=state[current];$('example').value=x.example;$('answer').value=x.answer;$('done').checked=x.done;update()}function report(){return '29卒 インターン面接準備 10問ワーク\n\n'+questions.map((q,i)=>`${i+1}. ${q}\n準備済み: ${state[i].done?'はい':'いいえ'}\n経験・事実: ${state[i].example}\n回答メモ: ${state[i].answer}`).join('\n\n')}$('question').addEventListener('change',e=>show(Number(e.target.value)));['example','answer'].forEach(id=>$(id).addEventListener('input',save));$('done').addEventListener('change',save);$('prev').onclick=()=>show(current-1);$('next').onclick=()=>show(current+1);$('download').onclick=()=>{const blob=new Blob([report()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='29sotsu-internship-interview-prep.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='TXT保存を開始しました。'};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(report());$('status').textContent='コピーしました。'}catch(e){$('status').textContent='コピーできませんでした。TXT保存をご利用ください。'}};$('clear').onclick=()=>{if(!confirm('全10問の入力とチェックを削除しますか？'))return;state.forEach(x=>{x.example='';x.answer='';x.done=false});show(0);$('status').textContent='全入力を削除しました。'};show(0);</script></body></html>

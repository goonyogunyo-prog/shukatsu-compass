<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29卒インターン応募管理表｜締切・選考状況を整理｜就活コンパス</title><meta name="description" content="29卒向けインターン応募管理ツール。企業名・応募締切・選考段階・次の行動を端末内で管理。CSV書き出しに対応。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-internship-application-tracker.html"><style>:root{font-family:system-ui,sans-serif;color:#18283e;background:#f5f7fc}body{margin:0}main{max-width:850px;margin:auto;padding:22px}h1{font-size:1.7rem}section{background:white;border-radius:14px;padding:18px;margin:15px 0;box-shadow:0 2px 12px #17243a12}label{display:block;margin:12px 0;font-weight:600}input,select,textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #aeb9cb;border-radius:8px;font:inherit}button{padding:11px 16px;background:#164d91;color:white;border:0;border-radius:9px;cursor:pointer;margin:5px 5px 5px 0}button.secondary{background:#526174}button.danger{background:#a62936}.entry{border-top:1px solid #ddd;padding:12px 0;overflow-wrap:anywhere}.muted{color:#536275;font-size:.92rem}.pill{display:inline-block;padding:4px 9px;background:#e7eef9;border-radius:20px}a{color:#164d91}*:focus-visible{outline:3px solid #f6a700;outline-offset:2px}@media(max-width:480px){main{padding:12px}h1{font-size:1.35rem}}</style></head><body><main><p><a href="./">就活コンパス TOP</a> / 29卒インターン応募管理</p><h1>29卒 インターン応募管理表</h1><p>企業ごとの締切・選考段階・次の行動をまとめよう。入力情報はこの端末のブラウザにのみ保存され、サーバーには送信されません。共有端末での利用には注意してください。</p><section><h2>応募先を登録</h2><form id="form"><label>企業名<input id="company" required maxlength="100" placeholder="例：株式会社〇〇"></label><label>応募締切<input id="deadline" type="date"></label><label>選考状況<select id="status"><option>検討中</option><option>ES準備中</option><option>応募済み</option><option>Webテスト</option><option>面接</option><option>参加決定</option><option>不参加・不合格</option></select></label><label>次の行動<textarea id="next" rows="2" maxlength="500" placeholder="例：企業研究を進める"></textarea></label><button type="submit">登録する</button></form><p id="message" role="status" aria-live="polite"></p></section><section><h2>登録一覧 <span id="count" class="pill">0件</span></h2><label>表示対象<select id="filter"><option value="all">すべて</option><option value="active">進行中のみ</option><option value="done">参加決定・不参加・不合格</option></select></label><div id="items"></div><button id="csv" type="button">CSVを書き出す</button><button id="clear" type="button" class="danger">全件削除</button></section><p class="muted">締切は企業の公式募集要項で必ず再確認してください。CSVには応募先情報が含まれます。</p></main><script>(function(){'use strict';const key='sc_29_intern_tracker_v1', $=id=>document.getElementById(id);let data=[];try{const v=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(v))data=v.filter(x=>x&&typeof x.company==='string').slice(0,300)}catch(e){}const done=x=>['参加決定','不参加・不合格'].includes(x.status);function save(){try{localStorage.setItem(key,JSON.stringify(data));$('message').textContent='この端末に保存しました'}catch(e){$('message').textContent='保存できませんでした。CSVで控えを保存してください'}}function render(){const filter=$('filter').value;$('count').textContent=data.length+'件';$('items').replaceChildren();const shown=data.map((x,i)=>({...x,i})).filter(x=>filter==='all'||(filter==='done'?done(x):!done(x))).sort((a,b)=>(a.deadline||'9999').localeCompare(b.deadline||'9999'));if(!shown.length){$('items').textContent='該当する登録はありません';return}shown.forEach(x=>{const d=document.createElement('div');d.className='entry';const h=document.createElement('strong');h.textContent=x.company;d.append(h);const p=document.createElement('p');p.textContent='締切：'+(x.deadline||'未設定')+' ／ 状況：'+x.status;d.append(p);const q=document.createElement('p');q.textContent='次の行動：'+(x.next||'未設定');d.append(q);const b=document.createElement('button');b.type='button';b.className='secondary';b.textContent='削除';b.addEventListener('click',()=>{if(confirm(x.company+'を削除しますか？')){data.splice(x.i,1);save();render()}});d.append(b);$('items').append(d)})} $('form').addEventListener('submit',e=>{e.preventDefault();if(data.length>=300){$('message').textContent='登録上限300件です';return}data.push({company:$('company').value.trim(),deadline:$('deadline').value,status:$('status').value,next:$('next').value.trim()});save();$('form').reset();render()});$('filter').addEventListener('change',render);$('clear').addEventListener('click',()=>{if(confirm('すべての登録を削除しますか？元に戻せません。')){data=[];save();render()}});$('csv').addEventListener('click',()=>{const esc=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const rows=[['企業名','締切','選考状況','次の行動'],...data.map(x=>[x.company,x.deadline,x.status,x.next])];const csv='\ufeff'+rows.map(r=>r.map(esc).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='29sotsu-internship-tracker.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});render()})();</script></body></html>

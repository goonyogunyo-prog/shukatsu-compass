<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>28卒 内定承諾・保留・辞退の返信メール作成｜就活コンパス</title><meta name="description" content="28卒向け。内定承諾・回答期限の相談・内定辞退の返信文を無料作成。送信前チェック付き。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-naitei-shodaku-henji-mail.html"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#17243a;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:22px 16px 65px}a{color:#1756a9}header{margin-bottom:25px}.panel{background:white;border:1px solid #dce4ef;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 3px 14px #1328470a}h1{font-size:clamp(1.45rem,4vw,2rem);line-height:1.4}h2{font-size:1.12rem}label{display:block;font-weight:650;margin:15px 0 6px}input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid #a9b8cb;border-radius:9px;background:white;color:#17243a}textarea{min-height:250px;line-height:1.65}button{border:0;border-radius:9px;padding:12px 16px;background:#1659ad;color:white;font:inherit;font-weight:700;cursor:pointer;margin:8px 8px 0 0}button.secondary{background:#e5ecf7;color:#163c75}.muted{color:#52647b;font-size:.9rem;line-height:1.7}.checks label{font-weight:400;display:flex;align-items:flex-start;gap:10px}.checks input{width:auto;margin-top:5px}#status{min-height:1.5em;color:#145b40}@media(max-width:420px){.panel{padding:16px}button{width:100%;margin-right:0}}</style></head><body><main><header><a href="./index.html">← 就活コンパス トップ</a><h1>28卒｜内定への返信メール作成</h1><p class="muted">承諾・回答期限の相談・辞退の3種類。文面は下書きなので、送信前に事実と期限を確認してください。</p></header><section class="panel"><h2>1. 必要事項を入力</h2><label for="type">返信の種類</label><select id="type"><option value="accept">内定承諾</option><option value="hold">回答期限の相談</option><option value="decline">内定辞退</option></select><label for="company">企業名</label><input id="company" placeholder="例：株式会社〇〇"><label for="person">担当者名（不明なら採用ご担当者様）</label><input id="person" placeholder="例：人事部 田中様"><label for="name">自分の氏名</label><input id="name" placeholder="例：山田 太郎"><label for="deadline">希望回答期限（期限相談のみ）</label><input id="deadline" type="date"><button id="make">文面を作成</button></section><section class="panel"><h2>2. 件名と本文を確認・編集</h2><label for="subject">件名</label><input id="subject"><label for="body">本文</label><textarea id="body"></textarea><button id="copy">件名・本文をコピー</button><button class="secondary" id="download">TXT保存</button><button class="secondary" id="clear">入力を消去</button><p id="status" role="status" aria-live="polite"></p></section><section class="panel checks"><h2>3. 送信前チェック</h2><label><input type="checkbox">企業名・担当者名・氏名に誤りがない</label><label><input type="checkbox">内定通知に記載された返信期限を確認した</label><label><input type="checkbox">辞退・承諾の意思は確定している</label><label><input type="checkbox">保留相談の場合は希望期限と理由を適切に伝えた</label><label><input type="checkbox">送信先メールアドレスと添付の要否を確認した</label><p class="muted">このページは入力内容をサーバーに送信せず、自動保存もしません。承諾後の辞退など個別の事情は大学のキャリアセンター等にも相談してください。</p></section></main><script>const $=id=>document.getElementById(id);function make(){const c=$('company').value.trim()||'株式会社〇〇',p=$('person').value.trim()||'採用ご担当者様',n=$('name').value.trim()||'氏名',t=$('type').value,d=$('deadline').value;let s='',m='';if(t==='accept'){s='内定承諾のご連絡';m='このたびは内定のご連絡をいただき、誠にありがとうございます。\n謹んで内定をお受けいたします。\n入社に向けて必要な手続きがございましたら、ご教示いただけますと幸いです。'}else if(t==='hold'){s='内定回答期限についてのご相談';m='このたびは内定のご連絡をいただき、誠にありがとうございます。\n大変恐縮ですが、今後の進路について慎重に検討したく、内定への回答期限をご相談できますでしょうか。'+(d?'\n可能であれば'+d.replace(/-/g,'/')+'までお時間をいただけますと幸いです。':'\n可能な回答期限についてご相談させていただけますと幸いです。')+'\nご迷惑をおかけし申し訳ございません。'}else{s='内定辞退のご連絡';m='このたびは内定のご連絡をいただき、誠にありがとうございました。\n慎重に検討した結果、誠に勝手ながら今回の内定を辞退させていただきたく、ご連絡いたしました。\n選考に際して貴重なお時間をいただいたにもかかわらず、このようなご連絡となり申し訳ございません。'}$('subject').value=s+'（'+n+'）';$('body').value=c+'\n'+p+'\n\nお世話になっております。'+n+'です。\n\n'+m+'\n\n何卒よろしくお願い申し上げます。\n\n'+n;$('status').textContent='文面を生成しました。内容を確認してから送信してください。'}function output(){return '件名：'+$('subject').value+'\n\n'+$('body').value}function save(){const blob=new Blob([output()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='naitei-henji-mail.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='TXTを保存しました。'}$('make').addEventListener('click',make);$('download').addEventListener('click',save);$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(output());$('status').textContent='コピーしました。'}catch(e){$('status').textContent='コピーできませんでした。本文を選択してコピーしてください。'}});$('clear').addEventListener('click',()=>{for(const id of ['company','person','name','deadline','subject','body'])$(id).value='';document.querySelectorAll('input[type=checkbox]').forEach(x=>x.checked=false);$('status').textContent='入力を消去しました。'});make();</script></body></html>

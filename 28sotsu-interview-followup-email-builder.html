<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28卒 面接後のお礼メール作成ツール｜就活コンパス</title><meta name="description" content="28卒向け。面接後のお礼メールを企業名・面接日・印象に残った話から作成。文章を編集・コピーできる無料ツール。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-interview-followup-email-builder.html"><style>:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#1a2940;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}header,main,footer{max-width:850px;margin:auto;padding:22px}h1{font-size:clamp(1.45rem,4vw,2rem)}a{color:#1956a3}main{background:white;border:1px solid #dfe5ee;border-radius:16px;margin-top:12px;margin-bottom:25px}label{display:block;font-weight:700;margin:14px 0 6px}input,textarea,select{width:100%;font:inherit;border:1px solid #9cacc2;border-radius:9px;padding:12px}textarea{min-height:100px;resize:vertical}#result{min-height:320px}button{font:inherit;border:0;border-radius:9px;background:#205bb4;color:white;padding:12px 18px;cursor:pointer;margin:12px 10px 4px 0}button.secondary{background:#47566c}.note{background:#f0f5ff;padding:13px;border-radius:10px;line-height:1.7}small{color:#53627b}nav{display:flex;gap:16px;flex-wrap:wrap}#status{min-height:1.5em}</style></head><body><header><nav><a href="index.html">ホーム</a><a href="28sotsu-guide-directory.html">28卒ガイド</a><a href="shukatsu-new-tools-directory.html">追加ツール一覧</a></nav><h1>28卒 面接後のお礼メール作成ツール</h1><p>面接で印象に残った内容を盛り込み、短く丁寧なお礼メールを下書きできます。</p></header><main><p class="note">お礼メールは必須ではありません。企業から送付不要の指示がある場合は従ってください。選考結果を左右するものと考えず、送る場合は誤字・宛先・送信時刻を確認しましょう。</p><label for="company">企業名</label><input id="company" maxlength="100" placeholder="例：株式会社〇〇"><label for="recipient">宛名（任意）</label><input id="recipient" maxlength="100" placeholder="例：人事部 採用ご担当者様"><label for="date">面接日</label><input id="date" type="date"><label for="topic">印象に残ったお話（任意）</label><textarea id="topic" maxlength="500" placeholder="例：若手社員が顧客の課題に直接向き合う姿勢"></textarea><label for="sender">署名（大学・氏名）</label><textarea id="sender" maxlength="250" placeholder="例：〇〇大学 〇〇学部　山田太郎"></textarea><button id="generate">下書きを作成</button><label for="subject">件名</label><input id="subject" value="本日の面接のお礼"><label for="result">本文（自由に編集できます）</label><textarea id="result" aria-label="メール本文"></textarea><button id="copy">件名・本文をコピー</button><button class="secondary" id="clear">入力を消去</button><p id="status" role="status" aria-live="polite"></p><p><small>入力した情報はこのページからサーバーへ送信せず、ブラウザにも自動保存しません。メールの送信機能はありません。</small></p></main><footer><a href="shukatsu-new-tools-directory.html">ほかの就活ツールを見る</a></footer><script>(function(){const ids=['company','recipient','date','topic','sender','subject','result'];const el=id=>document.getElementById(id);const clean=s=>s.trim().replace(/[\r\n]+/g,' ');el('generate').addEventListener('click',()=>{const company=clean(el('company').value)||'株式会社〇〇';const recipient=clean(el('recipient').value)||'採用ご担当者様';const date=el('date').value;const topic=el('topic').value.trim();const sender=el('sender').value.trim()||'（大学名・氏名）';el('subject').value=(date?date.replaceAll('-','/')+' ':'')+'面接のお礼（'+sender.split('\n')[0].slice(0,35)+'）';el('result').value=company+'\n'+recipient+'\n\nお世話になっております。'+sender.split('\n').join('、')+'です。\n\n本日はお忙しい中、面接のお時間をいただき、誠にありがとうございました。\n'+(topic?'特に「'+topic+'」というお話が印象に残り、貴社への理解が一層深まりました。\n':'')+'\n本日のお礼をお伝えしたく、ご連絡いたしました。\n引き続き、どうぞよろしくお願いいたします。\n\n'+sender;el('status').textContent='下書きを作成しました。内容を確認・編集してください。'});el('copy').addEventListener('click',async()=>{const value='件名：'+el('subject').value+'\n\n'+el('result').value;if(!el('result').value.trim()){el('status').textContent='先に下書きを作成してください。';return}try{await navigator.clipboard.writeText(value);el('status').textContent='コピーしました。'}catch(e){el('result').focus();el('result').select();el('status').textContent='自動コピーできませんでした。本文を選択したので手動でコピーしてください。'}});el('clear').addEventListener('click',()=>{if(!confirm('入力した内容をすべて消去しますか？'))return;ids.forEach(id=>el(id).value='');el('status').textContent='入力を消去しました。'});})();</script></body></html>

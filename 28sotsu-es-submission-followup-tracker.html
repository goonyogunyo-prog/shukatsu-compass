<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28卒 ES提出後の確認・次の行動チェック｜就活コンパス</title><meta name="description" content="28卒向け。ES提出後の受付確認、Webテスト、次の選考準備を整理。ブラウザ内保存とTXT出力に対応。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-es-submission-followup-tracker.html"><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f4f7fc;color:#172640;line-height:1.65;margin:0}header,main,footer{max-width:780px;margin:auto;padding:20px}h1{font-size:clamp(1.5rem,4vw,2rem)}section{background:#fff;padding:18px;border:1px solid #dbe3ee;border-radius:14px;margin:18px 0}label{display:block;font-weight:600;margin:12px 0 5px}input[type=text],input[type=date],textarea{width:100%;box-sizing:border-box;font:inherit;padding:10px;border:1px solid #9cacc2;border-radius:8px}textarea{min-height:90px}ul{padding-left:22px}li{margin:10px 0}button{font:inherit;padding:10px 15px;margin:6px 8px 6px 0;border:0;border-radius:8px;background:#1659a3;color:white;cursor:pointer}button.secondary{background:#48566b}a{color:#1659a3}#status{font-weight:700}small{color:#465773}</style></head><body><header><nav><a href="index.html">ホーム</a> ／ <a href="28sotsu-guide-directory.html">28卒一覧</a> ／ <a href="shukatsu-new-tools-directory.html">ツール検索</a></nav><h1>28卒 ES提出後の確認・次の行動チェック</h1><p>提出後に「やるべきこと」を忘れないための無料ワーク。選考案内は必ず企業の公式連絡で確認してください。</p></header><main><section><label for="company">企業名</label><input id="company" type="text" maxlength="120" placeholder="例：〇〇株式会社"><label for="submitted">提出日</label><input id="submitted" type="date"><label for="deadline">次の確認予定日</label><input id="deadline" type="date"><label for="memo">次の選考・連絡事項メモ</label><textarea id="memo" maxlength="3000" placeholder="Webテスト受検期限、面接日程、確認先など"></textarea></section><section><h2>提出後チェック（8項目）</h2><p id="status" aria-live="polite">0 / 8 完了</p><ul id="checks"></ul></section><section><h2>記録・書き出し</h2><button id="save">この端末に保存</button><button id="export">TXTを書き出す</button><button id="clear" class="secondary">保存データを削除</button><p id="message" role="status" aria-live="polite"></p><small>データはこの端末のブラウザ内だけに保存します。共用端末では保存を避けてください。外部送信は行いません。</small></section></main><footer><a href="index.html">就活コンパスに戻る</a></footer><script>const KEY='sc28_es_submission_followup_v1';const tasks=['提出完了画面または受付メールを確認','提出内容の控えを安全な場所に保存','マイページで応募状況を確認','Webテストの有無と期限を確認','適性検査・面接の準備時間を確保','迷惑メールと通知設定を確認','企業の公式連絡先を控える','次の確認予定日を設定'];const fields=['company','submitted','deadline','memo'];const checks=document.getElementById('checks');tasks.forEach((t,i)=>{const li=document.createElement('li'),label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.id='task'+i;input.addEventListener('change',update);label.append(input,document.createTextNode(' '+t));li.append(label);checks.append(li)});function data(){return {fields:Object.fromEntries(fields.map(k=>[k,document.getElementById(k).value])),done:tasks.map((_,i)=>document.getElementById('task'+i).checked)}}function update(){document.getElementById('status').textContent=data().done.filter(Boolean).length+' / '+tasks.length+' 完了'}function restore(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d)return;fields.forEach(k=>document.getElementById(k).value=typeof d.fields?.[k]==='string'?d.fields[k]:'');tasks.forEach((_,i)=>document.getElementById('task'+i).checked=d.done?.[i]===true)}catch(e){document.getElementById('message').textContent='保存データを読み込めませんでした'}update()}document.getElementById('save').onclick=()=>{try{localStorage.setItem(KEY,JSON.stringify(data()));document.getElementById('message').textContent='この端末に保存しました'}catch(e){document.getElementById('message').textContent='保存できませんでした。空き容量やブラウザ設定を確認してください'}};document.getElementById('export').onclick=()=>{const d=data(),lines=['28卒 ES提出後チェック',...fields.map(k=>k+': '+d.fields[k]),...tasks.map((t,i)=>(d.done[i]?'[済] ':'[未] ')+t)];const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='28sotsu-es-followup.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('clear').onclick=()=>{if(!confirm('保存内容と画面の入力をすべて削除しますか？'))return;try{localStorage.removeItem(KEY)}catch(e){}fields.forEach(k=>document.getElementById(k).value='');tasks.forEach((_,i)=>document.getElementById('task'+i).checked=false);update();document.getElementById('message').textContent='削除しました'};restore();</script></body></html>

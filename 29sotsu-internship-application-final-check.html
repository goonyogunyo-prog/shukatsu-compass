<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29卒 インターン応募完了チェック｜就活コンパス</title><meta name="description" content="29卒のインターン応募で、ES・適性検査・提出完了・受付メールを見落とさない無料チェックリスト。端末内保存とテキスト出力に対応。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-internship-application-final-check.html"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#18243b;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}main{max-width:780px;margin:auto;padding:24px 16px 60px}h1{font-size:clamp(1.6rem,5vw,2.3rem)}.card{background:white;padding:20px;border-radius:18px;margin:18px 0;box-shadow:0 4px 24px #1223430c}label{display:block;margin:12px 0}input[type=text],input[type=date],textarea{width:100%;padding:12px;border:1px solid #aebbd0;border-radius:8px;font:inherit}textarea{min-height:100px}button{border:0;border-radius:9px;background:#1948a4;color:white;padding:12px 16px;margin:6px 6px 6px 0;cursor:pointer;font:inherit}button.secondary{background:#51647e}.item{padding:12px 4px;border-bottom:1px solid #e4eaf3}.item label{display:flex;gap:12px;align-items:flex-start}.item input{width:20px;height:20px;flex-shrink:0}small,.muted{color:#53657d}a{color:#174ca5}progress{width:100%;height:18px}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ffad43} </style></head><body><main><p><a href="./index.html">就活コンパス</a> / <a href="./shukatsu-new-tools-directory.html">新着ツール一覧</a></p><h1>29卒 インターン応募完了チェック</h1><p>エントリーだけで安心せず、必要な手続きがすべて終わっているか確認しよう。企業・コースごとに条件は異なるため、公式マイページの案内を最優先にしてください。</p><section class="card"><label>企業・コース名<input id="company" type="text" maxlength="120" placeholder="例：企業A 冬季インターン"></label><label>公式締切日（時刻は公式案内で別途確認）<input id="deadline" type="date"></label><label>締切時刻・注意事項<textarea id="notes" placeholder="例：23:59締切／ES提出後にWebテスト受検が必要"></textarea></label></section><section class="card"><h2>応募完了までの確認</h2><p id="count" aria-live="polite"></p><progress id="progress" value="0" max="10"></progress><div id="checks"></div></section><section class="card"><button id="copy">チェック結果をコピー</button><button id="download">TXTで保存</button><button id="clear" class="secondary">このツールの入力を全削除</button><p class="muted"><small>入力内容はこのブラウザのlocalStorageに保存します。端末間で同期されず、ブラウザのデータ削除で失われます。コピー・TXT保存で控えを残してください。</small></p><p id="status" role="status"></p></section></main><script>"use strict";const KEY="sc_29_application_final_v1";const tasks=["卒年・応募資格・コースを公式募集要項で確認","応募締切の日時とタイムゾーンを確認","マイページの基本情報を入力・更新","ESや必要書類をすべて提出","適性検査・Webテストの受検要否と期限を確認","必要なWebテストを受検完了","動画・課題・アンケート等の追加提出を確認","マイページで各項目の提出済み表示を確認","受付完了メール・受付番号を確認（案内がある場合）","選考結果の通知方法・次の確認日を記録"];const $=id=>document.getElementById(id);let data={company:"",deadline:"",notes:"",done:Array(tasks.length).fill(false)};try{let x=JSON.parse(localStorage.getItem(KEY)||"null");if(x&&typeof x==="object"){data={company:String(x.company||""),deadline:String(x.deadline||""),notes:String(x.notes||""),done:tasks.map((_,i)=>x.done?.[i]===true)}}}catch(e){}function save(){try{localStorage.setItem(KEY,JSON.stringify(data));$("status").textContent="この端末に保存しました"}catch(e){$("status").textContent="保存できません。TXTで控えを残してください"}}function render(){["company","deadline","notes"].forEach(k=>$(k).value=data[k]);$("checks").replaceChildren();tasks.forEach((t,i)=>{let div=document.createElement("div");div.className="item";let lab=document.createElement("label");let input=document.createElement("input");input.type="checkbox";input.checked=data.done[i];input.addEventListener("change",()=>{data.done[i]=input.checked;save();update()});let span=document.createElement("span");span.textContent=t;lab.append(input,span);div.append(lab);$("checks").append(div)});update()}function update(){let n=data.done.filter(Boolean).length;$("count").textContent=n+" / "+tasks.length+"項目確認済み";$("progress").value=n}for(let k of ["company","deadline","notes"])$(k).addEventListener("input",e=>{data[k]=e.target.value;save()});function report(){return "29卒 インターン応募完了チェック\n企業・コース："+data.company+"\n締切日："+data.deadline+"\n注意事項："+data.notes+"\n\n"+tasks.map((t,i)=>(data.done[i]?"[済] ":"[未] ")+t).join("\n")+"\n\n※募集要項とマイページで必ず再確認"}$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(report());$("status").textContent="コピーしました"}catch(e){$("status").textContent="コピーできません。TXT保存を利用してください"}};$("download").onclick=()=>{let url=URL.createObjectURL(new Blob([report()],{type:"text/plain;charset=utf-8"}));let a=document.createElement("a");a.href=url;a.download="29sotsu-application-check.txt";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$("clear").onclick=()=>{if(!confirm("このツールの保存内容を削除しますか？"))return;data={company:"",deadline:"",notes:"",done:Array(tasks.length).fill(false)};try{localStorage.removeItem(KEY)}catch(e){}render();$("status").textContent="削除しました"};render();</script></body></html>

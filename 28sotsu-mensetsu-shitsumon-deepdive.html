<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28卒 面接深掘り質問15問チェック｜就活コンパス</title><meta name="description" content="28卒向け。ガクチカ・志望動機・自己PRの面接深掘り質問15問を練習し、回答メモと進捗をTXT保存できる無料ワーク。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-mensetsu-shitsumon-deepdive.html"><style>body{font-family:system-ui,-apple-system,sans-serif;line-height:1.7;background:#f4f7fb;color:#16243b;margin:0}header,main,footer{max-width:760px;margin:auto;padding:20px}header{background:#122a50;color:white}header a{color:#fff}h1{font-size:clamp(1.5rem,5vw,2.2rem)}section{background:white;border:1px solid #dce3ed;border-radius:14px;padding:18px;margin:14px 0}textarea{width:100%;box-sizing:border-box;min-height:85px;border:1px solid #9cabc1;border-radius:8px;padding:10px;font:inherit}button{background:#1649a3;color:white;border:0;border-radius:8px;padding:10px 15px;margin:4px;cursor:pointer}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #ffb84d}label{display:block;margin:8px 0}.muted{color:#52627a}#progress{font-weight:700}a{color:#1649a3}@media print{button{display:none}body{background:white}section{break-inside:avoid}}</style></head><body><header><a href="./index.html">← 就活コンパスに戻る</a><h1>28卒 面接深掘り質問15問チェック</h1><p>回答を声に出して、根拠・具体性・再現性を確認しよう。</p></header><main><p id="progress" aria-live="polite">完了 0 / 15問</p><div id="questions"></div><button id="save">回答メモをTXT保存</button><button id="print">印刷・PDF保存</button><button id="clear">全回答を削除</button><p class="muted">入力はこの画面だけで処理し、自動保存・外部送信しません。ページを閉じる前にTXT保存してください。保存ファイルには個人情報が含まれる場合があります。</p></main><footer>© 就活コンパス｜面接の評価や合否を予測するものではありません。</footer><script>
const groups=[['ガクチカ','なぜその課題に取り組んだのですか？','その課題をどうやって発見しましたか？','他に検討した方法はありましたか？','あなた自身の役割は何でしたか？','結果を示す具体的な数字や事実はありますか？'],['自己PR','その強みが表れた別の経験はありますか？','周囲からはどんな評価を受けましたか？','失敗したとき、何を変えましたか？','その強みを仕事でどう生かせますか？','弱みとどう向き合っていますか？'],['志望動機','なぜこの業界なのですか？','同業他社ではなく当社を選ぶ理由は何ですか？','入社後に取り組みたい仕事は何ですか？','その仕事に必要な力をどう身につけますか？','企業研究の情報はどの公式資料で確認しましたか？']];const root=document.getElementById('questions');let n=0;groups.forEach(([group,...qs])=>qs.forEach(q=>{const i=n++;const s=document.createElement('section');const h=document.createElement('h2');h.textContent=group+'｜'+(i+1)+'問目';const p=document.createElement('p');p.textContent=q;const t=document.createElement('textarea');t.id='answer'+i;t.maxLength=3000;t.setAttribute('aria-label',q+'の回答メモ');t.placeholder='事実・自分の行動・結果を具体的に記入';const l=document.createElement('label');const c=document.createElement('input');c.type='checkbox';c.id='done'+i;c.addEventListener('change',update);l.append(c,document.createTextNode(' 声に出して回答できた'));s.append(h,p,t,l);root.append(s)}));function update(){document.getElementById('progress').textContent='完了 '+document.querySelectorAll('input[type=checkbox]:checked').length+' / 15問'}document.getElementById('save').onclick=()=>{const lines=['28卒 面接深掘り質問15問','完了 '+document.querySelectorAll('input[type=checkbox]:checked').length+'/15'];let i=0;groups.forEach(([group,...qs])=>qs.forEach(q=>{lines.push('\n['+group+'] '+q,'回答: '+document.getElementById('answer'+i).value,'練習済み: '+(document.getElementById('done'+i).checked?'はい':'いいえ'));i++}));const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='28sotsu_mensetsu_deepdive.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('print').onclick=()=>window.print();document.getElementById('clear').onclick=()=>{if(!confirm('回答とチェックをすべて削除しますか？'))return;document.querySelectorAll('textarea').forEach(e=>e.value='');document.querySelectorAll('input[type=checkbox]').forEach(e=>e.checked=false);update()};
</script></body></html>

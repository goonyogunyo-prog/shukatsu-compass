<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29卒 インターン応募状況ボード｜就活コンパス</title><meta name="description" content="29卒向け。インターンの応募状況、締切、次の行動を整理する無料シート。CSV・JSON書き出しに対応。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-internship-application-status-board.html"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#16243b;background:#f5f8fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:960px;margin:auto;padding:24px 16px}header{background:#132c52;color:white;padding:16px}header a{color:white}h1{font-size:clamp(1.5rem,4vw,2.3rem)}.panel{background:white;border:1px solid #dce5f0;border-radius:16px;padding:20px;margin:16px 0}label{display:block;font-weight:650;margin:12px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #9daec4;border-radius:8px;font:inherit}textarea{min-height:76px}button{border:0;border-radius:8px;padding:11px 14px;background:#174b87;color:white;cursor:pointer;margin:5px 6px 5px 0}button.secondary{background:#e7eef8;color:#15345c}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stats{display:flex;flex-wrap:wrap;gap:12px}.stats span{background:#edf4ff;padding:12px;border-radius:8px}article{padding:14px;border:1px solid #dce5f0;border-radius:10px;margin:10px 0;overflow-wrap:anywhere}small,.muted{color:#56677f}a{color:#174b87}@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{padding:16px 12px}}</style></head><body><header><a href="index.html">就活コンパス</a> / <a href="29sotsu-start-guide-2026.html">29卒ガイド</a></header><main class="wrap"><h1>29卒 インターン応募状況ボード</h1><p>応募先・締切・選考段階・次の行動を一覧化。企業の正式案内を確認して入力してください。入力内容は自動保存・外部送信しません。</p><section class="panel"><h2>応募先を登録</h2><div class="grid"><div><label for="company">企業名</label><input id="company" maxlength="100" required></div><div><label for="deadline">締切日</label><input id="deadline" type="date"></div><div><label for="stage">状況</label><select id="stage"><option>検討中</option><option>準備中</option><option>応募済み</option><option>選考中</option><option>参加決定</option><option>終了</option></select></div><div><label for="next">次の行動</label><input id="next" maxlength="180" placeholder="例：ESを推敲"></div></div><label for="memo">メモ（任意）</label><textarea id="memo" maxlength="1000"></textarea><button id="add">登録する</button><button id="clearForm" class="secondary">入力を消す</button></section><section class="panel"><h2>応募状況</h2><div class="stats" id="stats" aria-live="polite"></div><label for="filter">状況で絞り込み</label><select id="filter"><option value="">すべて</option><option>検討中</option><option>準備中</option><option>応募済み</option><option>選考中</option><option>参加決定</option><option>終了</option></select><div id="items" aria-live="polite"></div><button id="csv">CSV保存</button><button id="json">JSONバックアップ</button><label for="import">JSONから復元（現在の一覧を置換）</label><input type="file" id="import" accept="application/json,.json"><button id="deleteAll" class="secondary">全件削除</button><p class="muted">ページを閉じると登録内容は消えます。続きから使う場合はJSONバックアップを保存してください。バックアップには企業名・メモが含まれるため共有に注意してください。</p></section><p><a href="29sotsu-tools-directory.html">29卒ツール一覧へ戻る</a></p></main><script>"use strict";(()=>{const $=id=>document.getElementById(id);let records=[];const fields=['company','deadline','stage','next','memo'];const stages=['検討中','準備中','応募済み','選考中','参加決定','終了'];function valid(x){return x&&typeof x==='object'&&typeof x.company==='string'&&x.company.trim()&&x.company.length<=100&&typeof x.deadline==='string'&&(!x.deadline||/^\d{4}-\d{2}-\d{2}$/.test(x.deadline))&&stages.includes(x.stage)&&typeof x.next==='string'&&x.next.length<=180&&typeof x.memo==='string'&&x.memo.length<=1000}function node(tag,text){const el=document.createElement(tag);el.textContent=text;return el}function render(){const filter=$('filter').value;const shown=records.filter(x=>!filter||x.stage===filter).sort((a,b)=>(a.deadline||'9999').localeCompare(b.deadline||'9999'));$('stats').replaceChildren(node('span',`全 ${records.length} 件`),node('span',`応募済・選考中 ${records.filter(x=>['応募済み','選考中'].includes(x.stage)).length} 件`),node('span',`参加決定 ${records.filter(x=>x.stage==='参加決定').length} 件`));$('items').replaceChildren();if(!shown.length)$('items').append(node('p','該当する応募先はありません。'));for(const x of shown){const a=node('article','');a.append(node('h3',x.company),node('p',`状況：${x.stage} ／ 締切：${x.deadline||'未登録'}`),node('p',`次の行動：${x.next||'未登録'}`));if(x.memo)a.append(node('p',x.memo));const b=node('button','削除');b.className='secondary';b.addEventListener('click',()=>{if(confirm(`${x.company} を削除しますか？`)){records=records.filter(y=>y.id!==x.id);render()}});a.append(b);$('items').append(a)}}$('add').onclick=()=>{const x=Object.fromEntries(fields.map(k=>[k,$(k).value]));if(!valid(x)){alert('企業名と入力内容を確認してください');return}if(records.length>=200){alert('登録上限は200件です');return}x.id=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();records.push(x);fields.forEach(k=>$(k).value='');$('stage').value='検討中';render()};$('clearForm').onclick=()=>{fields.forEach(k=>$(k).value='');$('stage').value='検討中'};$('filter').onchange=render;function save(filename,content,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('json').onclick=()=>save('29sotsu-internships.json',JSON.stringify({version:1,records},null,2),'application/json');$('csv').onclick=()=>{const quote=s=>'"'+String(s).replace(/"/g,'""')+'"';save('29sotsu-internships.csv','\uFEFF'+[fields.join(','),...records.map(x=>fields.map(k=>quote(x[k])).join(','))].join('\r\n'),'text/csv;charset=utf-8')};$('import').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>1024*1024){alert('ファイルが大きすぎます');return}try{const d=JSON.parse(await f.text());if(d.version!==1||!Array.isArray(d.records)||d.records.length>200||!d.records.every(valid))throw Error('形式が違います');if(confirm('現在の一覧を置き換えますか？')){records=d.records.map((x,i)=>({...x,id:String(i)+'-'+Date.now()}));render()}}catch(err){alert('対応するJSONファイルではありません')}finally{e.target.value=''}};$('deleteAll').onclick=()=>{if(confirm('すべての応募先を削除しますか？')){records=[];render()}};render()})();</script></body></html>

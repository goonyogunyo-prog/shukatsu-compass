<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29卒 インターン比較・選考準備シート｜就活コンパス</title><meta name="description" content="29卒向け。インターン参加企業を比較し、学び・志望度・選考準備を整理。端末内で編集しTXTとJSONで保存できます。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-internship-selection-comparison.html"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#192b45;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#163c72;color:white;padding:24px max(18px,calc((100% - 880px)/2))}main{max-width:880px;margin:auto;padding:20px 16px 70px}a{color:#2460b1}header a{color:white}.card{background:white;padding:22px;margin:18px 0;border:1px solid #dce5ef;border-radius:14px}h1{font-size:clamp(24px,5vw,34px)}h2{font-size:21px}label{display:block;font-weight:600;margin:12px 0 5px}input:not([type=checkbox]),textarea,select{width:100%;padding:11px;border:1px solid #aebed0;border-radius:8px;font:inherit}textarea{min-height:90px;resize:vertical}.check{display:flex;align-items:flex-start;gap:10px;font-weight:400;padding:7px 0}button{background:#164f96;color:white;border:0;border-radius:9px;padding:12px 16px;font:inherit;cursor:pointer;margin:5px 5px 5px 0}button.secondary{background:#53677f}.hint{color:#52647a;font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}@media(max-width:600px){.grid{grid-template-columns:1fr}.card{padding:16px}}#preview{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf4fc;padding:15px;border-radius:8px}</style></head><body><header><a href="./index.html">就活コンパス</a> / 29卒向け<h1>インターン比較・選考準備シート</h1><p>参加経験を整理して、本選考で話せる材料に変える。</p></header><main><p class="hint">入力内容はこのページから送信されません。自動保存は行わないため、必要ならTXT・JSONで保存してください。</p><section class="card"><h2>企業・参加情報</h2><div class="grid"><div><label for="company">企業名</label><input id="company" placeholder="例：〇〇株式会社"></div><div><label for="date">参加日</label><input id="date" type="date"></div><div><label for="type">参加形式</label><select id="type"><option>対面</option><option>オンライン</option><option>ハイブリッド</option></select></div><div><label for="interest">参加後の志望度</label><select id="interest"><option>未定</option><option>高い</option><option>やや高い</option><option>普通</option><option>低い</option></select></div></div></section><section class="card"><h2>経験を言語化する</h2><label for="work">取り組んだワーク・業務</label><textarea id="work"></textarea><label for="learning">学びと印象に残った社員の言葉</label><textarea id="learning"></textarea><label for="fit">自分の強みとの接点・合わないと感じた点</label><textarea id="fit"></textarea><label for="reason">志望理由に使える事実（推測と分けて記録）</label><textarea id="reason"></textarea><label for="next">次の選考に向けた行動・締切</label><textarea id="next"></textarea></section><section class="card"><h2>選考準備チェック</h2><label class="check"><input type="checkbox" data-check="0">参加目的が明確になった</label><label class="check"><input type="checkbox" data-check="1">実際の仕事内容を理解した</label><label class="check"><input type="checkbox" data-check="2">社員との交流で得た学びがある</label><label class="check"><input type="checkbox" data-check="3">自分の強みが活きる場面を見つけた</label><label class="check"><input type="checkbox" data-check="4">志望理由に使える具体例がある</label><label class="check"><input type="checkbox" data-check="5">次の選考・締切を確認した</label><p id="progress" aria-live="polite">0 / 6 項目完了</p></section><section class="card"><h2>記録の確認・書き出し</h2><button id="show">プレビュー更新</button><button id="txt">TXT保存</button><button id="json">JSON保存</button><button id="load" class="secondary">JSON復元</button><button id="clear" class="secondary">入力を消去</button><input id="file" type="file" accept="application/json,.json" hidden><pre id="preview" aria-live="polite">「プレビュー更新」で内容を表示します。</pre><p class="hint">JSON復元は、このページから保存したファイルだけに対応します。ブラウザのファイル選択画面で指定してください。</p></section><p><a href="./29sotsu-start-guide-2026.html">29卒向けガイドへ戻る</a></p></main><script>const ids=['company','date','type','interest','work','learning','fit','reason','next'];const labels=['企業名','参加日','参加形式','志望度','取り組んだワーク・業務','学び','強みとの接点','志望理由に使える事実','次の行動・締切'];const el=id=>document.getElementById(id);const checks=[...document.querySelectorAll('[data-check]')];function data(){return {version:1,fields:Object.fromEntries(ids.map(id=>[id,el(id).value])),checks:checks.map(x=>x.checked)}}function progress(){el('progress').textContent=checks.filter(x=>x.checked).length+' / '+checks.length+' 項目完了'}checks.forEach(x=>x.addEventListener('change',progress));function summary(){const d=data();return '29卒 インターン比較・選考準備シート\n'+ids.map((id,i)=>labels[i]+'：'+d.fields[id]).join('\n\n')+'\n\n選考準備：\n'+checks.map((x,i)=>(x.checked?'[済] ':'[未] ')+x.parentElement.textContent.trim()).join('\n')}function download(text,type,filename){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}el('show').onclick=()=>el('preview').textContent=summary();el('txt').onclick=()=>download(summary(),'text/plain;charset=utf-8','internship-comparison.txt');el('json').onclick=()=>download(JSON.stringify(data(),null,2),'application/json','internship-comparison.json');el('load').onclick=()=>el('file').click();el('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>100000)throw Error('ファイルが大きすぎます');const d=JSON.parse(await f.text());if(d.version!==1||!d.fields||!Array.isArray(d.checks))throw Error('形式が違います');ids.forEach(id=>{if(typeof d.fields[id]==='string')el(id).value=d.fields[id].slice(0,10000)});checks.forEach((x,i)=>x.checked=d.checks[i]===true);progress();el('preview').textContent=summary()}catch(err){alert('復元できません：'+err.message)}finally{e.target.value=''}};el('clear').onclick=()=>{if(!confirm('入力をすべて削除しますか？'))return;ids.forEach(id=>{if(el(id).tagName==='SELECT')el(id).selectedIndex=0;else el(id).value=''});checks.forEach(x=>x.checked=false);progress();el('preview').textContent='入力を削除しました。'};</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29卒｜OB・OG訪問後のお礼メール作成ツール｜就活コンパス</title><meta name="description" content="29卒向け。OB・OG訪問後のお礼メールを、学びと次の行動から作成。ブラウザ内だけで処理しコピーできます。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-internship-obog-followup-mail-builder.html"><style>body{font-family:system-ui,sans-serif;background:#f5f7fb;color:#17263b;margin:0}main{max-width:760px;margin:auto;padding:24px 16px 60px}a{color:#1756a9}.card{background:white;border:1px solid #dce4ee;border-radius:16px;padding:22px;margin-top:20px}label{display:block;font-weight:700;margin:15px 0 6px}input,textarea{width:100%;box-sizing:border-box;border:1px solid #9baabd;border-radius:8px;padding:12px;font:inherit}textarea{min-height:85px}button{background:#164c95;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer;margin:8px 8px 8px 0}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f2ac3c}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5fa;padding:16px;border-radius:8px;min-height:120px}small{color:#546477}h1{line-height:1.35}</style></head><body><main><a href="./index.html">← 就活コンパス トップ</a><p>29卒 / 無料ツール</p><h1>OB・OG訪問後のお礼メール作成</h1><p>実際に聞いた内容と自分の学びを整理し、形式的すぎないお礼文を作ります。送信は行いません。</p><section class="card"><label for="person">相手のお名前・敬称（任意）</label><input id="person" maxlength="100" placeholder="例：山田様"><label for="company">企業名（任意）</label><input id="company" maxlength="100" placeholder="例：〇〇株式会社"><label for="topic">印象に残ったお話（必須）</label><textarea id="topic" maxlength="1000" placeholder="例：顧客の課題を聞き出す際に意識していること"></textarea><label for="learning">そこから得た学び（必須）</label><textarea id="learning" maxlength="1000" placeholder="例：相手の背景まで理解する大切さ"></textarea><label for="next">今後取り組むこと（任意）</label><textarea id="next" maxlength="1000" placeholder="例：事業理解を深め、質問を整理する"></textarea><button id="generate">お礼文を作成</button><button id="copy" type="button">文章をコピー</button><button id="reset" type="button">入力を消去</button><p id="status" role="status" aria-live="polite"></p></section><section class="card"><h2>件名・本文（編集可）</h2><textarea id="output" style="min-height:340px" aria-label="お礼メール本文"></textarea><p><small>入力内容はこのページから外部送信せず、自動保存もしません。メール送信前に宛先・敬称・内容の事実関係を確認してください。</small></p></section></main><script>const $=id=>document.getElementById(id);$('generate').addEventListener('click',()=>{const topic=$('topic').value.trim(),learning=$('learning').value.trim();if(!topic||!learning){$('status').textContent='印象に残ったお話と学びを入力してください。';return}const p=$('person').value.trim()||'〇〇様',c=$('company').value.trim(),n=$('next').value.trim();$('output').value='件名：OB・OG訪問のお礼\n\n'+(c?c+'\n':'')+p+'\n\n本日はお忙しい中、貴重なお時間をいただき、誠にありがとうございました。\n\n特に「'+topic+'」についてのお話が印象に残っております。お話を伺い、'+learning+'と学びました。\n\n'+(n?'今後は'+n+'ことに取り組んでまいります。\n\n':'')+'改めまして、本日はありがとうございました。\n今後ともどうぞよろしくお願いいたします。\n\n氏名：［ご自身のお名前］';$('status').textContent='下書きを作成しました。内容を編集してから送信してください。'});$('copy').addEventListener('click',async()=>{if(!$('output').value){$('status').textContent='先に文章を作成してください。';return}try{await navigator.clipboard.writeText($('output').value);$('status').textContent='コピーしました。'}catch(e){$('output').focus();$('output').select();$('status').textContent='自動コピーできませんでした。選択された文章を手動でコピーしてください。'}});$('reset').addEventListener('click',()=>{['person','company','topic','learning','next','output'].forEach(id=>$(id).value='');$('status').textContent='入力を消去しました。'});</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29卒｜インターンES設問×経験マッチング表｜就活コンパス</title><meta name="description" content="29卒向け。インターンESの設問に対して、経験エピソードを比較し、根拠と改善点を整理できる無料ツール。データは端末内に保存。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-internship-es-episode-fit-matrix.html"><style>:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#18283b;font:16px/1.7 system-ui,-apple-system,sans-serif}main{max-width:920px;margin:auto;padding:24px 16px 70px}a{color:#1456aa}h1{line-height:1.4;font-size:clamp(1.5rem,4vw,2.2rem)}h2{font-size:1.2rem}.card{background:white;border:1px solid #dce4ed;border-radius:16px;padding:20px;margin:18px 0}label{display:block;font-weight:700;margin:12px 0 5px}input,textarea,select{width:100%;border:1px solid #a8b7c9;border-radius:8px;padding:10px;font:inherit;background:white;color:#18283b}textarea{min-height:90px;resize:vertical}button{border:0;border-radius:8px;background:#175bb4;color:white;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;margin:6px 8px 6px 0}button.secondary{background:#465b72}button.danger{background:#9b3030}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #e6a332;outline-offset:2px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.muted{color:#4b5e73}.score{font-weight:800;color:#1456aa;font-size:1.2rem}#result{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7fb;border-radius:10px;padding:14px}footer{margin-top:32px}@media(max-width:650px){.grid{grid-template-columns:1fr}.card{padding:16px}}</style></head><body><main><nav><a href="index.html">就活コンパス</a> ／ <a href="29sotsu-start-guide-2026.html">29卒ガイド</a></nav><h1>29卒｜インターンES設問×経験マッチング表</h1><p>ESの設問とエピソードの相性を、事実に基づいて比較するワーク。点数は自己整理用の目安であり、選考通過率を予測するものではありません。</p><section class="card"><h2>① 設問を入力</h2><label for="company">企業名（任意）</label><input id="company" maxlength="100" placeholder="例：○○株式会社"><label for="question">ES設問</label><textarea id="question" maxlength="600" placeholder="例：チームで成果を上げた経験を教えてください"></textarea><label for="limit">文字数上限（任意）</label><input id="limit" type="number" min="1" max="5000" placeholder="400"></section><section class="card"><h2>② 候補エピソードを比較</h2><p class="muted">各候補の4項目を1〜5点で自己評価。具体的な事実・自分の役割・成果の根拠を重視しましょう。</p><div id="episodes"></div><button id="add" type="button">候補を追加（最大5件）</button></section><section class="card"><h2>③ 比較結果と改善メモ</h2><button id="generate" type="button">比較結果を作成</button><button id="copy" class="secondary" type="button">結果をコピー</button><button id="download" class="secondary" type="button">TXT保存</button><button id="clear" class="danger" type="button">全データ削除</button><p id="status" role="status" aria-live="polite"></p><div id="result" aria-label="比較結果">入力後に「比較結果を作成」を押してください。</div></section><footer><p class="muted">入力情報はこの端末のブラウザ内だけに保存します。共有端末では削除してください。企業の評価基準や募集要項は必ず公式情報を確認してください。</p><a href="29sotsu-start-guide-2026.html">29卒ガイドに戻る</a></footer></main><script>"use strict";(()=>{const KEY="sc29_es_episode_fit_v1",$=id=>document.getElementById(id),fields=["name","facts","role","result","improve"],labels=["設問との一致","具体性","本人の役割","成果の根拠"];let state={company:"",question:"",limit:"",items:[blank(),blank()]};function blank(){return {name:"",facts:"",role:"",result:"",improve:"",scores:[3,3,3,3]}}try{const x=JSON.parse(localStorage.getItem(KEY)||"null");if(x&&Array.isArray(x.items)&&x.items.length>0&&x.items.length<=5)state=x}catch(e){}function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$("status").textContent="端末に保存しました"}catch(e){$("status").textContent="保存できませんでした。容量やブラウザ設定をご確認ください"}}function draw(){for(const id of ["company","question","limit"])$(id).value=state[id]||"";const root=$("episodes");root.replaceChildren();state.items.forEach((item,i)=>{const box=document.createElement("div");box.className="card";const h=document.createElement("h3");h.textContent="候補 "+(i+1);box.append(h);fields.forEach((field,j)=>{const label=document.createElement("label");const id="e"+i+"_"+field;label.htmlFor=id;label.textContent=["経験名","具体的に起きた事実","自分の役割・行動","成果と根拠","不足している情報・改善点"][j];const el=document.createElement(j===0?"input":"textarea");el.id=id;el.maxLength=1500;el.value=item[field]||"";el.addEventListener("input",()=>{item[field]=el.value;save()});box.append(label,el)});const grid=document.createElement("div");grid.className="grid";labels.forEach((label,j)=>{const wrap=document.createElement("div");const l=document.createElement("label");const id="s"+i+"_"+j;l.htmlFor=id;l.textContent=label+"（1〜5）";const select=document.createElement("select");select.id=id;for(let n=1;n<=5;n++){const o=document.createElement("option");o.value=n;o.textContent=n+"点";select.append(o)}select.value=Number(item.scores?.[j])||3;select.addEventListener("change",()=>{item.scores[j]=Number(select.value);save()});wrap.append(l,select);grid.append(wrap)});box.append(grid);if(state.items.length>1){const remove=document.createElement("button");remove.type="button";remove.className="danger";remove.textContent="この候補を削除";remove.addEventListener("click",()=>{state.items.splice(i,1);save();draw()});box.append(remove)}root.append(box)})}for(const id of ["company","question","limit"])$(id).addEventListener("input",()=>{state[id]=$(id).value;save()});$("add").addEventListener("click",()=>{if(state.items.length>=5){$("status").textContent="候補は最大5件です";return}state.items.push(blank());save();draw()});function report(){const items=state.items.map((x,i)=>({x,i,score:(x.scores||[]).reduce((a,b)=>a+Number(b||0),0)})).sort((a,b)=>b.score-a.score);const lines=["29卒 インターンES設問×経験マッチング表","企業："+(state.company||"未入力"),"設問："+(state.question||"未入力"),"文字数上限："+(state.limit||"未設定"),"※点数は自己評価であり、採用結果を示しません。",""];items.forEach(({x,i,score},rank)=>{lines.push((rank+1)+"位："+(x.name||"候補"+(i+1))+"（"+score+"/20点）","評価："+labels.map((v,j)=>v+" "+(x.scores?.[j]||3)+"点").join(" / "),"事実："+(x.facts||"未入力"),"役割・行動："+(x.role||"未入力"),"成果の根拠："+(x.result||"未入力"),"改善点："+(x.improve||"未入力"),"")});lines.push("次の行動：最上位の候補について、設問に直接答える結論→行動→根拠→学びの順に文章化し、公式募集要項を確認する。");return lines.join("\n")}$("generate").addEventListener("click",()=>{$("result").textContent=report();$("status").textContent="比較結果を更新しました"});$("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(report());$("status").textContent="コピーしました"}catch(e){$("status").textContent="コピーできませんでした。結果欄から選択してコピーしてください"}});$("download").addEventListener("click",()=>{const blob=new Blob([report()],{type:"text/plain;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="29sotsu-es-episode-fit.txt";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});$("clear").addEventListener("click",()=>{if(!confirm("このツールの保存データをすべて削除しますか？"))return;state={company:"",question:"",limit:"",items:[blank(),blank()]};try{localStorage.removeItem(KEY)}catch(e){}draw();$("result").textContent="入力後に比較結果を作成してください。";$("status").textContent="削除しました"});draw()})();</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28卒 ES推敲チェックシート｜就活コンパス</title><meta name="description" content="28卒向け。ESの結論・具体性・数字・企業との接点を確認し、改善メモとともに保存できる無料チェックシート。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-es-feedback-checker.html"><style>:root{color-scheme:light}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#f5f7fb;color:#17233a;margin:0;line-height:1.7}main{max-width:850px;margin:auto;padding:24px 16px 60px}a{color:#1459a8}.panel{background:white;border:1px solid #dce4f0;border-radius:14px;padding:20px;margin:16px 0}h1{font-size:clamp(1.5rem,5vw,2.1rem);line-height:1.4}label{display:block;font-weight:600;margin:12px 0 6px}textarea,input{width:100%;font:inherit;padding:11px;border:1px solid #aebdd0;border-radius:8px}textarea{min-height:110px;resize:vertical}.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #edf0f5}.check input{width:auto;margin-top:7px}button{font:inherit;background:#1358a5;color:white;border:0;border-radius:9px;padding:10px 16px;margin:6px 8px 6px 0;cursor:pointer}button.secondary{background:#465569}.small{font-size:.9rem;color:#52627a}.score{font-size:1.4rem;font-weight:700}#status{min-height:1.6em}</style></head><body><main><nav><a href="index.html">就活コンパス TOP</a> / <a href="28sotsu-guide-directory.html">28卒ガイド</a></nav><h1>28卒 ES推敲チェックシート</h1><p>提出前に「伝わる文章か」を8項目で点検。採点は自己確認用で、選考結果を予測するものではありません。</p><section class="panel"><label for="company">企業・設問</label><input id="company" placeholder="例：〇〇社／学生時代に力を入れたこと"><label for="draft">ES本文</label><textarea id="draft" placeholder="ここに文章を貼り付け"></textarea><p id="count" class="small">0文字</p><label for="limit">指定文字数（任意）</label><input id="limit" type="number" min="1" max="10000" placeholder="例：400"></section><section class="panel"><h2>提出前チェック</h2><div id="checks"></div><p class="score" id="score" aria-live="polite">0 / 8 項目</p></section><section class="panel"><label for="good">残したい強み・表現</label><textarea id="good"></textarea><label for="fix">修正すべき点・次の一手</label><textarea id="fix"></textarea><button id="copy">結果をコピー</button><button id="download">TXTで保存</button><button id="reset" class="secondary">入力を全削除</button><p id="status" role="status"></p><p class="small">入力はこのページから外部送信されません。自動保存はありません。ページを閉じる前にTXT保存してください。</p></section></main><script>(()=>{'use strict';const questions=['冒頭に結論がある','設問に直接答えている','自分が担った役割が明確','課題とその原因が具体的','自分の行動・工夫が具体的','結果に数字や客観的事実がある（なければ具体的な変化）','経験から得た学びが伝わる','誤字脱字・主語のねじれ・表現の重複を見直した'];const $=id=>document.getElementById(id);const checks=$('checks');questions.forEach((q,i)=>{const l=document.createElement('label');l.className='check';const c=document.createElement('input');c.type='checkbox';c.dataset.i=i;const span=document.createElement('span');span.textContent=q;l.append(c,span);checks.append(l)});function refresh(){const n=Array.from($('draft').value).length,limit=Number($('limit').value);$('count').textContent=n+'文字'+(limit>0?' / '+limit+'文字'+(n>limit?'（超過）':''):'');$('score').textContent=checks.querySelectorAll('input:checked').length+' / 8 項目'}document.querySelectorAll('input,textarea').forEach(el=>el.addEventListener('input',refresh));checks.addEventListener('change',refresh);function report(){const checked=[...checks.querySelectorAll('input')];return ['【28卒 ES推敲チェック】','企業・設問：'+$('company').value,'文字数：'+Array.from($('draft').value).length,'指定文字数：'+($('limit').value||'なし'),'確認：'+checked.filter(c=>c.checked).length+'/8',...questions.map((q,i)=>(checked[i].checked?'[済] ':'[未] ')+q),'','ES本文：',$('draft').value,'','残したい点：',$('good').value,'','修正点：',$('fix').value].join('\n')}function status(s){$('status').textContent=s}$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(report());status('コピーしました')}catch(e){status('コピーできませんでした。TXT保存を利用してください')}};$('download').onclick=()=>{const blob=new Blob([report()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='28sotsu-es-check.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status('TXT保存を開始しました')};$('reset').onclick=()=>{if(!confirm('入力内容をすべて削除しますか？'))return;document.querySelectorAll('textarea,input:not([type=checkbox])').forEach(x=>x.value='');checks.querySelectorAll('input').forEach(x=>x.checked=false);refresh();status('入力を削除しました')};refresh()})();</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29卒 企業研究チェックリスト｜就活コンパス</title><meta name="description" content="29卒向け企業研究の情報源・事業・働き方・選考準備を整理し、比較用メモをTXT保存できる無料チェックリスト。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-company-research-checklist.html"><style>body{font-family:system-ui,sans-serif;background:#f5f7fb;color:#172b4d;margin:0}main{max-width:780px;margin:auto;padding:24px 16px}h1{font-size:1.8rem}section{background:white;border-radius:12px;padding:18px;margin:16px 0;box-shadow:0 1px 6px #dde3ec}label{display:block;margin:12px 0}input[type=text],textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #a9b6c7;border-radius:7px;font:inherit}textarea{min-height:80px}button{padding:12px 16px;background:#164a92;color:white;border:0;border-radius:7px;cursor:pointer;margin:4px}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #e7a12b}small{color:#52657d}#progress{font-weight:bold}</style></head><body><main><p><a href="./">就活コンパス トップへ</a></p><h1>29卒 企業研究チェックリスト</h1><p>公式採用ページやIRなど、確認した情報と自分の考えを分けて整理しよう。内容はこの画面内で扱い、自動送信・自動保存はしません。</p><section><label>企業名<input id="company" type="text" maxlength="120" placeholder="企業名"></label><label>確認した公式URL<input id="source" type="text" maxlength="500" placeholder="https://..."></label><label>確認日<input id="date" type="text" maxlength="40" placeholder="2026-11-05"></label></section><section><h2>企業研究の確認項目</h2><p id="progress" aria-live="polite">0 / 8 項目</p><div id="checks"></div></section><section><h2>自分の言葉で整理</h2><label>企業の特徴・強み<textarea id="strength" maxlength="2000"></textarea></label><label>気になる点・追加で確認したいこと<textarea id="question" maxlength="2000"></textarea></label><label>自分の経験との接点<textarea id="fit" maxlength="2000"></textarea></label><label>次の行動<textarea id="next" maxlength="2000"></textarea></label><button id="save" type="button">TXTで保存</button><button id="clear" type="button">入力を削除</button><p id="status" role="status"></p></section><small>※情報は各社公式ページで最新状況を確認してください。就活コンパスの独自整理ツールです。</small></main><script>(()=>{'use strict';const topics=['事業内容と主要顧客','競合企業との違い','直近の事業戦略・IR','募集職種と仕事内容','勤務地・転勤の条件','働き方・福利厚生','求める人物像','選考フロー・締切'];const wrap=document.getElementById('checks');topics.forEach((t,i)=>{const l=document.createElement('label');const c=document.createElement('input');c.type='checkbox';c.className='check';c.id='check'+i;l.append(c,document.createTextNode(' '+t));wrap.append(l)});const checks=()=>[...document.querySelectorAll('.check')];const progress=()=>document.getElementById('progress').textContent=checks().filter(x=>x.checked).length+' / 8 項目';wrap.addEventListener('change',progress);const fields=['company','source','date','strength','question','fit','next'];document.getElementById('save').addEventListener('click',()=>{const lines=['29卒 企業研究チェックリスト',...fields.map(id=>id+': '+document.getElementById(id).value),...topics.map((t,i)=>(checks()[i].checked?'[x] ':'[ ] ')+t)];const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='29sotsu-company-research.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('status').textContent='TXTを保存しました'});document.getElementById('clear').addEventListener('click',()=>{if(!confirm('すべての入力を削除しますか？'))return;fields.forEach(id=>document.getElementById(id).value='');checks().forEach(c=>c.checked=false);progress();document.getElementById('status').textContent='入力を削除しました'});progress()})();</script></body></html>

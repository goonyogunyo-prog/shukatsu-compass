<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28卒 面接回答改善ログ｜回答を振り返り次の練習へ｜就活コンパス</title><meta name="description" content="28卒向け。面接練習の質問、回答、改善点、次回の練習を記録。評価ではなく自分の振り返り用。TXT・JSONで保存可能。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-mensetsu-answer-improvement-log.html"><style>:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#18253b;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#14233e;color:white;padding:20px max(20px,calc((100% - 880px)/2))}header a{color:#d6e8ff}main{max-width:880px;margin:auto;padding:24px 16px 60px}h1{font-size:clamp(1.6rem,4vw,2.3rem);line-height:1.35}p{line-height:1.75}.panel{background:white;border:1px solid #dfe5ed;border-radius:16px;padding:20px;margin:18px 0;box-shadow:0 5px 20px #10213a08}label{display:block;font-weight:700;margin:14px 0 6px}input,select,textarea{font:inherit;width:100%;border:1px solid #aebace;border-radius:9px;padding:12px;background:white;color:#18253b}textarea{min-height:100px;resize:vertical}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}button{border:0;border-radius:9px;padding:11px 16px;background:#2259a4;color:white;font:inherit;font-weight:700;cursor:pointer}button.secondary{background:#e7edf5;color:#183254}button.danger{background:#9e3030}.record{border-top:1px solid #e0e5ee;padding:14px 0;overflow-wrap:anywhere}.record p{white-space:pre-wrap;margin:7px 0}.muted{color:#506079;font-size:.92rem}.pill{display:inline-block;background:#e9f0fb;padding:4px 9px;border-radius:20px;font-size:.82rem}#status{min-height:24px}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #e8a628;outline-offset:2px}@media(max-width:480px){.panel{padding:15px}button{width:100%}}</style></head><body><header><a href="./index.html">← 就活コンパス</a>　/　28卒 面接対策</header><main><p class="pill">28卒 / 無料 / ブラウザ内で処理</p><h1>面接回答 改善ログ</h1><p>練習した回答を振り返り、「次回は何を変えるか」を1つ決めるワーク。合否予測・自動採点はしません。記録は自動保存されないので、必要ならJSONをダウンロードしてください。</p><section class="panel"><h2>1. 今日の練習を記録</h2><label for="q">質問</label><select id="q"><option>自己紹介</option><option>学生時代に力を入れたこと</option><option>志望動機</option><option>自己PR</option><option>強みと弱み</option><option>挫折経験</option><option>入社後にやりたいこと</option><option>逆質問</option><option>その他</option></select><label for="custom">質問の詳細（任意）</label><input id="custom" maxlength="160" placeholder="例：なぜその業界を選んだのか"><label for="answer">今回話した内容の要点</label><textarea id="answer" maxlength="3000" placeholder="結論・具体例・結果をメモ"></textarea><label for="good">伝わったと思う点</label><textarea id="good" maxlength="1500" placeholder="例：自分の役割を具体的に説明できた"></textarea><label for="improve">次回変えること（1つに絞る）</label><textarea id="improve" maxlength="1500" placeholder="例：結論を最初の15秒で言う"></textarea><label for="next">次回練習日（任意）</label><input id="next" type="date"><div class="buttons"><button id="add">記録を追加</button><button id="clear" class="secondary">入力欄をクリア</button></div><p id="status" role="status" aria-live="polite" class="muted"></p></section><section class="panel"><h2>2. 練習履歴 <span id="count">0件</span></h2><p class="muted">最大50件。新しい順に表示。削除後の復元はできません。</p><div id="records"></div><div class="buttons"><button id="txt" class="secondary">TXT保存</button><button id="json" class="secondary">JSONバックアップ</button><button id="import" class="secondary">JSONから復元</button><button id="wipe" class="danger">履歴を全削除</button></div><input id="file" type="file" accept=".json,application/json" hidden><p class="muted">JSON復元は現在の履歴を置き換えます。回答内容など個人情報を含むため、ファイルの共有に注意してください。入力は外部送信しません。</p></section><p><a href="./28sotsu-mensetsu-1min-timer.html">面接1分回答タイマーで練習する →</a></p></main><script>"use strict";(()=>{const $=id=>document.getElementById(id);let rows=[];const fields=['custom','answer','good','improve','next'];const clean=s=>String(s||'').slice(0,3000);function status(s){$('status').textContent=s}function save(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function render(){const root=$('records');root.replaceChildren();$('count').textContent=rows.length+'件';if(!rows.length){root.textContent='まだ記録はありません。';return}rows.forEach((r,i)=>{const box=document.createElement('article');box.className='record';const h=document.createElement('h3');h.textContent=(i+1)+'. '+r.q+'（'+r.created+'）';box.append(h);[['質問の詳細',r.custom],['回答の要点',r.answer],['できたこと',r.good],['次回変えること',r.improve],['次回練習日',r.next]].forEach(([k,v])=>{if(v){const p=document.createElement('p');const b=document.createElement('strong');b.textContent=k+'：';p.append(b,document.createTextNode(v));box.append(p)}});const b=document.createElement('button');b.className='secondary';b.textContent='この記録を削除';b.addEventListener('click',()=>{rows.splice(i,1);render()});box.append(b);root.append(box)})}function valid(r){return r&&typeof r==='object'&&typeof r.q==='string'&&typeof r.created==='string'&&fields.every(k=>typeof r[k]==='string')&&Object.values(r).every(v=>typeof v==='string'&&v.length<=3000)}$('add').addEventListener('click',()=>{const r={q:$('q').value,created:new Date().toLocaleDateString('ja-JP')};fields.forEach(k=>r[k]=clean($(k).value.trim()));if(!r.answer&&!r.improve){status('回答の要点か改善点を入力してください。');return}rows.unshift(r);rows=rows.slice(0,50);render();status('記録しました。ページを閉じる前に必要ならJSONを保存してください。')});$('clear').addEventListener('click',()=>{fields.forEach(k=>$(k).value='');status('入力欄をクリアしました。')});$('txt').addEventListener('click',()=>save('mensetsu-improvement.txt',rows.map(r=>[r.created,r.q,...fields.map(k=>k+': '+r[k])].join('\n')).join('\n\n---\n\n'),'text/plain;charset=utf-8'));$('json').addEventListener('click',()=>save('mensetsu-improvement.json',JSON.stringify({version:1,rows},null,2),'application/json'));$('import').addEventListener('click',()=>$('file').click());$('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>500000)throw Error('ファイルが大きすぎます');const d=JSON.parse(await f.text());if(d.version!==1||!Array.isArray(d.rows)||d.rows.length>50||!d.rows.every(valid))throw Error('形式が異なります');if(!confirm('現在の履歴を置き換えますか？'))return;rows=d.rows.map(r=>({q:clean(r.q),created:clean(r.created),...Object.fromEntries(fields.map(k=>[k,clean(r[k])]))}));render();status('復元しました。')}catch(err){status('復元できません：'+err.message)}finally{e.target.value=''}});$('wipe').addEventListener('click',()=>{if(confirm('履歴をすべて削除しますか？')){rows=[];render();status('履歴を削除しました。')}});render()})();</script></body></html>

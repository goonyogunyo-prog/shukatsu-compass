<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29卒インターンES提出前チェック｜無料15項目チェックリスト｜就活コンパス</title><meta name="description" content="29卒のインターンES提出前に確認したい15項目。設問への回答、具体性、文字数、企業研究、誤字、提出前の保存まで無料でチェック。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-internship-es-draft-checklist.html"><style>:root{font-family:system-ui,'Noto Sans JP',sans-serif;color:#18283f;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#17345c;color:white;padding:22px max(16px,calc((100% - 820px)/2))}main{max-width:820px;margin:auto;padding:22px 16px 50px}a{color:#1761a4}header a{color:white}.panel{background:white;border:1px solid #dbe2ec;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 3px 12px #1122 2}h1{font-size:clamp(1.45rem,4vw,2.2rem);line-height:1.45}h2{font-size:1.2rem}.muted{color:#546479}label.item{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid #e8edf4;line-height:1.5}input[type=checkbox]{width:21px;height:21px;flex-shrink:0;accent-color:#1469ad}input[type=text],textarea{width:100%;padding:12px;border:1px solid #aebed0;border-radius:8px;font:inherit}textarea{min-height:110px}button{border:0;border-radius:9px;background:#155c9a;color:white;padding:12px 16px;font:inherit;cursor:pointer;margin:5px 6px 5px 0}button.secondary{background:#4b5d74}.progress{height:12px;border-radius:8px;background:#e3eaf2;overflow:hidden}.progress>div{height:100%;background:#1d8d71;width:0;transition:width .2s}.small{font-size:.9rem}@media(max-width:430px){.panel{padding:16px}button{width:100%;margin:5px 0}}</style></head><body><header><a href="./">就活コンパス</a> / 29卒 インターンES<h1>インターンES 提出前チェックリスト</h1><p>15項目を確認して、提出直前の見落としを減らそう。</p></header><main><section class="panel"><label for="company">企業名（任意）</label><input id="company" type="text" maxlength="120" placeholder="例：〇〇株式会社"><p class="muted small">チェック状態とメモはこの端末に保存できます。共有端末では保存しないでください。</p><strong id="count" aria-live="polite">0 / 15 完了</strong><div class="progress" role="progressbar" aria-label="完了率" aria-valuemin="0" aria-valuemax="15" aria-valuenow="0"><div id="bar"></div></div></section><div id="sections"></div><section class="panel"><h2>最後に確認したいこと</h2><label for="memo">修正メモ・提出前の注意点</label><textarea id="memo" placeholder="例：設問2の成果の数字を再確認。提出前にPDFを保存。"></textarea><p id="status" class="muted" aria-live="polite">未保存</p><button id="save">端末に保存</button><button id="download">TXTで書き出し</button><button class="secondary" id="reset">入力を全削除</button></section><p class="small muted">本ツールはESの採点・合格判定を行いません。提出先の最新の募集要項・設問・文字数を優先してください。</p><p><a href="./29sotsu-start-guide-2026.html">29卒の就活スタートガイドへ戻る</a></p></main><script>const groups=[['設問への回答',['設問で聞かれた内容に直接答えている','結論が冒頭で明確になっている','指定文字数・入力形式を守っている']],['経験と根拠',['自分が実際に取った行動を具体的に書いた','課題・行動・結果のつながりがある','数字・役職・実績に誤りや誇張がない']],['企業・プログラム理解',['応募先の企業名・事業名が正しい','参加したい理由が具体的である','インターンで学びたいことが明確である']],['読みやすさ',['一文が長すぎず読みやすい','誤字脱字・敬語・表記揺れを確認した','他社向けの文章が残っていない']],['提出直前',['募集要項の応募資格・締切を再確認した','提出画面で改行・文字化けを確認した','提出内容の控えを保存する準備ができた']]];const root=document.getElementById('sections');let n=0;for(const [title,items] of groups){const s=document.createElement('section');s.className='panel';const h=document.createElement('h2');h.textContent=title;s.append(h);for(const t of items){const l=document.createElement('label');l.className='item';const c=document.createElement('input');c.type='checkbox';c.dataset.idx=n++;c.addEventListener('change',update);const span=document.createElement('span');span.textContent=t;l.append(c,span);s.append(l)}root.append(s)}const checks=[...document.querySelectorAll('input[type=checkbox]')],company=document.getElementById('company'),memo=document.getElementById('memo'),status=document.getElementById('status'),key='shukatsu_compass_29es_preflight_v1';function update(){const count=checks.filter(c=>c.checked).length;document.getElementById('count').textContent=count+' / 15 完了';document.getElementById('bar').style.width=(count/15*100)+'%';document.querySelector('.progress').setAttribute('aria-valuenow',count);status.textContent='未保存の変更があります'}function report(){return '29卒 インターンES提出前チェック\n企業：'+company.value+'\n完了：'+checks.filter(c=>c.checked).length+'/15\n\n'+checks.map(c=>(c.checked?'[x] ':'[ ] ')+c.nextElementSibling.textContent).join('\n')+'\n\nメモ：\n'+memo.value+'\n'}document.getElementById('save').onclick=()=>{try{localStorage.setItem(key,JSON.stringify({company:company.value,memo:memo.value,checks:checks.map(c=>c.checked)}));status.textContent='この端末に保存しました'}catch(e){status.textContent='保存できませんでした。TXT書き出しをご利用ください'}};document.getElementById('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([report()],{type:'text/plain;charset=utf-8'}));a.download='29sotsu-es-checklist.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('reset').onclick=()=>{if(!confirm('保存済みデータも含めてすべて削除しますか？'))return;checks.forEach(c=>c.checked=false);company.value='';memo.value='';try{localStorage.removeItem(key)}catch(e){}update();status.textContent='削除しました'};try{const d=JSON.parse(localStorage.getItem(key)||'null');if(d){company.value=d.company||'';memo.value=d.memo||'';checks.forEach((c,i)=>c.checked=!!d.checks?.[i]);status.textContent='端末の保存データを読み込みました'}}catch(e){status.textContent='保存データを読み込めませんでした'}update();try{if(localStorage.getItem(key))status.textContent='端末の保存データを読み込みました'}catch(e){};</script></body></html>

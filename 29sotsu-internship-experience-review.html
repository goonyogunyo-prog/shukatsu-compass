<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29卒 インターン参加後の振り返り・企業比較ワーク｜就活コンパス</title><meta name="description" content="29卒向け。インターン参加後に仕事内容・社員・社風・成長環境を5段階で整理し、志望度と次の行動を記録する無料ワーク。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-internship-experience-review.html"><style>:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17243b;font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;line-height:1.65}header{background:#143963;color:white;padding:24px max(18px,calc((100vw - 900px)/2))}header a{color:#fff}main{max-width:900px;margin:auto;padding:20px 16px 70px}.panel{background:white;border:1px solid #dce4ef;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 3px 10px #17243b09}h1{font-size:clamp(1.5rem,4vw,2.1rem);line-height:1.35}h2{font-size:1.22rem}label{display:block;font-weight:650;margin:12px 0 5px}input,select,textarea{width:100%;font:inherit;border:1px solid #9baac0;border-radius:8px;padding:10px;background:white;color:#17243b}textarea{min-height:85px;resize:vertical}.ratings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.ratings label{margin:0}.actions{display:flex;flex-wrap:wrap;gap:10px}button{font:inherit;font-weight:650;border:0;border-radius:9px;padding:11px 15px;cursor:pointer;background:#1754a1;color:white}button.secondary{background:#e4edf9;color:#16345a}button.danger{background:#a72f36}#result{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f8fc;padding:14px;border-radius:9px;min-height:70px}small,.muted{color:#52617a}a{color:#14539b}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f3aa32;outline-offset:2px}@media(max-width:560px){.ratings{grid-template-columns:1fr}.panel{padding:15px}}</style></head><body><header><a href="./index.html">就活コンパス</a> / <a href="./29sotsu-start-guide-2026.html">29卒ガイド</a><h1>インターン参加後の振り返り・企業比較ワーク</h1><p>参加した当日の気づきを、次の企業研究と応募判断につなげる。</p></header><main><section class="panel"><h2>1. 参加情報</h2><label for="company">企業名</label><input id="company" maxlength="100" placeholder="例：〇〇株式会社"><label for="program">参加プログラム</label><input id="program" maxlength="120" placeholder="例：営業職1dayワーク"><label for="day">参加日</label><input type="date" id="day"><label for="interest">参加後の志望度</label><select id="interest"><option value="未定">未定</option><option>非常に高い</option><option>高い</option><option>普通</option><option>低い</option></select></section><section class="panel"><h2>2. 体験を5段階で評価</h2><p class="muted">1＝合わない／5＝非常に合う。体験できなかった項目は「未評価」のままでOK。</p><div class="ratings" id="ratings"></div><p id="score" aria-live="polite"></p></section><section class="panel"><h2>3. 印象と根拠</h2><label for="work">仕事内容で印象に残ったこと</label><textarea id="work" maxlength="2000"></textarea><label for="people">社員との対話・社風で感じたこと</label><textarea id="people" maxlength="2000"></textarea><label for="gap">参加前後で印象が変わった点</label><textarea id="gap" maxlength="2000"></textarea><label for="questions">追加で確かめたいこと</label><textarea id="questions" maxlength="2000"></textarea><label for="next">次の行動と期限</label><textarea id="next" maxlength="2000" placeholder="例：11/15までにOB訪問を申し込む"></textarea></section><section class="panel"><h2>4. 振り返りを出力</h2><div class="actions"><button id="generate">文章を生成</button><button class="secondary" id="copy">コピー</button><button class="secondary" id="download">TXT保存</button><button class="danger" id="clear">入力を消去</button></div><p id="notice" role="status" aria-live="polite"></p><div id="result" aria-label="振り返り結果"></div><p><small>入力内容はブラウザ内で処理し、サーバーへ送信・自動保存しません。コピーや保存前に個人情報を確認してください。スコアは自己整理用であり、企業の客観的評価ではありません。</small></p></section><p><a href="./29sotsu-gyoukai-hikaku-sheet.html">29卒 業界研究比較シートへ</a></p></main><script>"use strict";const criteria=["仕事内容への関心","社員・社風との相性","成長できる環境","自分の強みを活かせる度合い","働き方の納得感"];const ratings=document.getElementById("ratings");criteria.forEach((s,i)=>{const l=document.createElement("label");l.textContent=s;const sel=document.createElement("select");sel.id="rating"+i;sel.setAttribute("aria-label",s);sel.innerHTML='<option value="">未評価</option>'+[1,2,3,4,5].map(n=>'<option value="'+n+'">'+n+' / 5</option>').join('');sel.addEventListener("change",score);l.appendChild(sel);ratings.appendChild(l)});function val(id){return document.getElementById(id).value.trim()}function score(){const n=criteria.map((_,i)=>Number(val("rating"+i))).filter(Boolean);document.getElementById("score").textContent=n.length?"評価済み "+n.length+"/5項目｜平均 "+(n.reduce((a,b)=>a+b,0)/n.length).toFixed(1)+" / 5":"評価済み 0/5項目"}function make(){const lines=["【29卒 インターン参加後振り返り】","企業："+(val("company")||"未入力"),"プログラム："+(val("program")||"未入力"),"参加日："+(val("day")||"未入力"),"参加後の志望度："+val("interest"),"",...criteria.map((s,i)=>s+"："+(val("rating"+i)||"未評価")+" / 5"),"","仕事内容："+(val("work")||"未入力"),"社員・社風："+(val("people")||"未入力"),"印象の変化："+(val("gap")||"未入力"),"追加確認事項："+(val("questions")||"未入力"),"次の行動："+(val("next")||"未入力")];return lines.join("\n")}function generate(){document.getElementById("result").textContent=make();document.getElementById("notice").textContent="振り返りを生成しました。"}document.getElementById("generate").addEventListener("click",generate);document.getElementById("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(make());document.getElementById("notice").textContent="コピーしました。"}catch(e){document.getElementById("notice").textContent="コピーできませんでした。結果を選択してコピーしてください。";generate()}});document.getElementById("download").addEventListener("click",()=>{const blob=new Blob(["\ufeff"+make()],{type:"text/plain;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="internship-review.txt";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById("notice").textContent="TXT保存を開始しました。"});document.getElementById("clear").addEventListener("click",()=>{if(!confirm("入力内容をすべて消去しますか？"))return;document.querySelectorAll("input,textarea,select").forEach(el=>{el.value=el.tagName==="SELECT"?el.options[0].value:""});document.getElementById("result").textContent="";document.getElementById("notice").textContent="消去しました。";score()});score();</script></body></html>

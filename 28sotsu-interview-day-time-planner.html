<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28卒 面接当日の逆算スケジュール｜就活コンパス</title><meta name="description" content="面接開始時刻と移動・受付・準備時間から当日の出発目安を逆算。オンライン面接にも対応した無料ツール。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-interview-day-time-planner.html"><style>body{margin:0;background:#f5f7fb;color:#18263d;font:16px/1.65 system-ui,sans-serif}main{max-width:740px;margin:auto;padding:24px}h1{font-size:clamp(1.6rem,4vw,2.3rem)}.panel{background:#fff;border:1px solid #d7e0eb;border-radius:14px;padding:20px;margin:18px 0}label{display:block;margin:12px 0;font-weight:650}input,select{display:block;width:100%;max-width:450px;box-sizing:border-box;padding:11px;border:1px solid #91a4bb;border-radius:8px;font:inherit}button{background:#174e8b;color:white;border:0;border-radius:8px;padding:12px 18px;font:inherit;cursor:pointer;margin:6px 8px 6px 0}button.secondary{background:#e8eef6;color:#183550}li{margin:8px 0}small{color:#52647b}a{color:#135b9d}#result{overflow-wrap:anywhere}@media(max-width:480px){main{padding:16px}.panel{padding:15px}}</style></head><body><main><nav><a href="index.html">ホーム</a> / <a href="28sotsu-guide-directory.html">28卒ガイド</a> / <a href="shukatsu-new-tools-directory.html">ツール一覧</a></nav><h1>28卒 面接当日の逆算スケジュール</h1><p>面接開始から逆算して、出発・到着・準備の目安を整理。予定は端末に自動保存されません。</p><div class="panel"><label>面接開始日時<input id="start" type="datetime-local"></label><label>面接形式<select id="mode"><option value="onsite">対面</option><option value="online">オンライン</option></select></label><label>移動時間（分）<input id="travel" type="number" min="0" max="600" value="45"></label><label>受付・接続の余裕（分）<input id="buffer" type="number" min="0" max="180" value="15"></label><label>出発前・接続前の準備（分）<input id="prep" type="number" min="0" max="180" value="30"></label><button id="calc">スケジュールを作成</button><button class="secondary" id="clear">入力をリセット</button></div><section class="panel" aria-live="polite"><h2>当日の目安</h2><div id="result">面接開始日時を入力してください。</div><button id="copy" class="secondary" disabled>結果をコピー</button><button id="save" class="secondary" disabled>TXT保存</button></section><p><small>交通遅延・建物の入館手続き・企業の受付指示などは反映されません。実際の案内を優先し、余裕をもって行動してください。オンラインの場合、移動時間は計算しません。</small></p></main><script>(()=>{'use strict';const $=id=>document.getElementById(id);let report='';const fmt=d=>new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);function mins(id){const n=Number($(id).value);return Number.isInteger(n)&&n>=0&&n<=600?n:null}function render(){const date=new Date($('start').value);const t=mins('travel'),b=mins('buffer'),p=mins('prep');if(!Number.isFinite(date.getTime())||[t,b,p].some(x=>x===null)){report='';$('result').textContent='日時と0以上の分数を正しく入力してください。';$('copy').disabled=$('save').disabled=true;return}const online=$('mode').value==='online',move=online?0:t,step=(m)=>fmt(new Date(date.getTime()-m*60000));report=['面接開始：'+fmt(date),'受付・接続目安：'+step(b),online?'接続準備開始：'+step(b+p):'出発目安：'+step(b+move),'準備開始：'+step(b+move+p),'形式：'+(online?'オンライン':'対面'),'※企業の正式案内・交通状況を優先'];const ul=document.createElement('ol');for(const line of report){const li=document.createElement('li');li.textContent=line;ul.append(li)}$('result').replaceChildren(ul);report=report.join('\n');$('copy').disabled=$('save').disabled=false} $('calc').addEventListener('click',render);$('mode').addEventListener('change',()=>{$('travel').disabled=$('mode').value==='online';render()});$('clear').addEventListener('click',()=>{$('start').value='';$('mode').value='onsite';$('travel').value=45;$('travel').disabled=false;$('buffer').value=15;$('prep').value=30;report='';$('result').textContent='面接開始日時を入力してください。';$('copy').disabled=$('save').disabled=true});$('copy').addEventListener('click',async()=>{if(report)try{await navigator.clipboard.writeText(report)}catch(e){alert('コピーできませんでした。TXT保存をご利用ください。')}});$('save').addEventListener('click',()=>{if(!report)return;const blob=new Blob([report],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mensetsu-day-plan.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});})();</script></body></html>

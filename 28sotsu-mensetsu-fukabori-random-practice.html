<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28卒 面接深掘り質問ランダム練習｜就活コンパス</title><meta name="description" content="28卒向け。ガクチカ・自己PR・志望動機の深掘り質問をランダム表示し、回答メモと振り返りをTXT保存できる無料面接練習ツール。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-mensetsu-fukabori-random-practice.html"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#17243b;background:#f5f8fd}*{box-sizing:border-box}body{margin:0}header{background:#163b75;color:white;padding:22px max(18px,calc((100% - 820px)/2))}main{max-width:820px;margin:auto;padding:20px 16px 60px}.card{background:white;border:1px solid #d9e3f1;border-radius:15px;padding:20px;margin:15px 0;box-shadow:0 2px 9px #102c4d0a}h1{font-size:clamp(1.4rem,4vw,2rem);margin:8px 0}h2{font-size:1.15rem}label{display:block;font-weight:650;margin:12px 0 6px}select,textarea{width:100%;padding:12px;border:1px solid #9cacc4;border-radius:9px;font:inherit}textarea{min-height:145px;resize:vertical}button{font:inherit;background:#164b9b;color:white;border:0;border-radius:9px;padding:12px 17px;margin:6px 7px 6px 0;cursor:pointer}button.secondary{background:#e7edf7;color:#1a3762}button:focus-visible,a:focus-visible{outline:3px solid #ef9f20;outline-offset:3px}.question{font-size:1.25rem;font-weight:750;line-height:1.6;min-height:80px}.muted{color:#56657b;font-size:.92rem}.row{display:flex;gap:10px;flex-wrap:wrap}a{color:#164b9b}#status{min-height:24px}@media(max-width:420px){.card{padding:15px}button{width:100%;margin:5px 0}}</style></head><body><header><a href="./index.html" style="color:white">就活コンパス</a><h1>28卒 面接深掘り質問ランダム練習</h1><p>「なぜ？」「具体的には？」への回答を練習しよう</p></header><main><div class="card"><label for="category">練習テーマ</label><select id="category"><option value="all">すべて</option><option value="gakuchika">ガクチカ</option><option value="strength">自己PR・強み</option><option value="motivation">志望動機・企業理解</option><option value="team">チーム・対人関係</option></select><button id="next">質問を出す</button><button class="secondary" id="repeat">同じ質問を表示</button><p class="muted" id="counter">未開始</p><div class="question" id="question" aria-live="polite">「質問を出す」を押して開始</div></div><div class="card"><label for="answer">回答メモ（外部送信・自動保存なし）</label><textarea id="answer" placeholder="結論→具体例→学びの順で整理してみよう"></textarea><label for="review">改善メモ</label><textarea id="review" placeholder="数字や役割を具体化する、結論を先に述べるなど"></textarea><div class="row"><button id="add">今回の練習を記録</button><button class="secondary" id="export">記録をTXT保存</button><button class="secondary" id="clear">記録を削除</button></div><p id="status" role="status"></p></div><div class="card"><h2>このページでの練習記録 <span id="count">0</span>件</h2><div id="history" class="muted">まだ記録はありません。</div><p class="muted">記録はこのページを開いている間だけ保持します。ページを閉じる前にTXT保存してください。実際の面接で質問されることを保証するものではありません。</p></div><p><a href="./28sotsu-guide-directory.html">28卒の記事一覧へ戻る</a></p></main><script>
'use strict';
const bank={gakuchika:['なぜその課題に取り組もうと思いましたか？','あなた自身の役割は何でしたか？','他の方法ではなくその施策を選んだ理由は？','成果を客観的に示す数字はありますか？','失敗したことと改善したことを教えてください。'],strength:['その強みを発揮した別の経験はありますか？','周囲からどのような評価を受けましたか？','強みが裏目に出た経験はありますか？','入社後どの業務で強みを活かせますか？'],motivation:['なぜ同業他社ではなく当社なのですか？','その事業に関心を持った原体験は何ですか？','入社後3年間で挑戦したいことは？','当社の課題をどのように捉えていますか？'],team:['意見が対立した際にどう調整しましたか？','周囲を巻き込む際に工夫したことは？','自分と考え方の異なる人にどう接しましたか？','リーダー以外の立場で貢献した経験は？']};
const $=id=>document.getElementById(id);let current='',last=-1,shown=0,records=[];
function next(){const cat=$('category').value;const pool=(cat==='all'?Object.values(bank).flat():bank[cat]);let idx=Math.floor(Math.random()*pool.length);if(pool.length>1&&idx===last)idx=(idx+1)%pool.length;last=idx;current=pool[idx];shown++;$('question').textContent=current;$('counter').textContent='表示 '+shown+'問目';$('answer').value='';$('review').value='';$('status').textContent='';}
$('next').addEventListener('click',next);$('category').addEventListener('change',()=>{last=-1});$('repeat').addEventListener('click',()=>{$('question').textContent=current||'先に質問を出してください'});
function render(){ $('count').textContent=String(records.length);const root=$('history');root.replaceChildren();if(!records.length){root.textContent='まだ記録はありません。';return}records.forEach((r,i)=>{const p=document.createElement('p');p.textContent=(i+1)+'. '+r.question+'｜'+r.answer.slice(0,65);root.append(p)});}
$('add').addEventListener('click',()=>{if(!current){$('status').textContent='先に質問を出してください。';return}records.push({question:current,answer:$('answer').value,review:$('review').value});render();$('status').textContent='記録しました（このページ内のみ）。';});
$('export').addEventListener('click',()=>{if(!records.length){$('status').textContent='保存する記録がありません。';return}const text=records.map((r,i)=>'【'+(i+1)+'】'+r.question+'\n回答：'+r.answer+'\n改善：'+r.review).join('\n\n');const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='28sotsu-mensetsu-fukabori.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='TXT保存を開始しました。';});
$('clear').addEventListener('click',()=>{if(records.length&&!confirm('このページ内の練習記録をすべて削除しますか？'))return;records=[];render();$('status').textContent='記録を削除しました。';});
</script></body></html>

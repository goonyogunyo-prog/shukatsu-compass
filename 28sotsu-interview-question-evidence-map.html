<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>28卒 面接質問×経験の根拠マップ｜就活コンパス</title><meta name="description" content="28卒向け。面接質問ごとに経験、具体的行動、成果、深掘り対策を整理する無料ワーク。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-interview-question-evidence-map.html"><style>:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#17243a;font:16px/1.7 system-ui,-apple-system,sans-serif}header{background:#122b4a;color:white;padding:20px max(18px,calc((100vw - 920px)/2))}header a{color:#d4e9ff}main{max-width:920px;margin:auto;padding:24px 16px 70px}h1{font-size:clamp(1.5rem,4vw,2.2rem);line-height:1.35}.card{background:white;border:1px solid #dce4ed;border-radius:16px;padding:22px;margin:18px 0;box-shadow:0 3px 16px #1732530a}label{display:block;font-weight:700;margin:15px 0 5px}textarea,input,select{width:100%;padding:11px;border:1px solid #8d9eb0;border-radius:8px;font:inherit;background:white;color:#17243a}textarea{min-height:100px;resize:vertical}button{border:0;border-radius:9px;padding:11px 16px;background:#174c82;color:white;font:inherit;cursor:pointer;margin:7px 7px 0 0}button.secondary{background:#e8eef5;color:#18334f}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #e1a943;outline-offset:2px}.hint{color:#4a5b6c;font-size:.92rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.output{white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f5fa;padding:15px;border-radius:10px;min-height:80px}.status{min-height:1.5em;color:#18533a}@media(max-width:600px){.grid{grid-template-columns:1fr}.card{padding:16px}}</style></head><body><header><a href="./index.html">就活コンパス トップ</a> ／ 28卒 面接対策</header><main><h1>面接質問×経験の根拠マップ</h1><p>回答を丸暗記する前に、質問ごとに「何をしたか」「なぜそうしたか」「何が変わったか」を整理。実際の経験に基づいて深掘りへの準備を進めるワークです。</p><section class="card"><label for="q">想定質問</label><select id="q"><option>学生時代に力を入れたこと</option><option>自己PR・強み</option><option>志望動機</option><option>困難を乗り越えた経験</option><option>周囲を巻き込んだ経験</option><option>失敗と改善</option><option>意見が対立したときの対応</option><option>入社後に取り組みたいこと</option></select><label for="experience">経験・場面（いつ／どこで／自分の役割）</label><textarea id="experience" placeholder="例：学園祭の企画運営で、複数の責任者と調整した"></textarea><label for="challenge">課題と判断の理由</label><textarea id="challenge" placeholder="なぜその課題を優先したのか"></textarea><label for="action">自分が取った具体的な行動</label><textarea id="action" placeholder="自分の行動と、他者の行動を分けて書く"></textarea><label for="result">結果・根拠（数字は確認できたものだけ）</label><textarea id="result" placeholder="成果／未達だった点／数値の出典"></textarea><label for="learning">学びと仕事へのつながり</label><textarea id="learning"></textarea><label for="followup">面接官からの深掘り想定と回答の材料</label><textarea id="followup" placeholder="なぜ？ 他の方法は？ 自分の貢献は？"></textarea><div class="grid"><div><label for="verified">事実確認</label><select id="verified"><option value="未確認">数字・事実を要確認</option><option value="確認済み">根拠を確認済み</option><option value="数字なし">数字を使わない</option></select></div><div><label for="next">次に修正すること</label><input id="next" placeholder="例：成果の出典を確認"></div></div><button id="make">回答メモを生成</button><button class="secondary" id="copy">コピー</button><button class="secondary" id="download">TXT保存</button><button class="secondary" id="reset">入力を消去</button><p class="status" id="status" role="status" aria-live="polite"></p></section><section class="card"><h2>整理した回答メモ</h2><div class="output" id="output">入力後に「回答メモを生成」を押してください。</div><p class="hint">自動採点・合否予測ではありません。入力内容はブラウザ内で処理し、サーバー送信や自動保存をしません。TXTには入力した個人情報が含まれるため共有時は注意してください。</p></section><p><a href="./28sotsu-guide-directory.html">28卒ガイドへ戻る</a></p></main><script>(()=>{'use strict';const ids=['experience','challenge','action','result','learning','followup','next'];const $=id=>document.getElementById(id);let text='';function build(){const fields=[['質問',$('q').value],['経験・場面',$('experience').value],['課題と判断の理由',$('challenge').value],['自分の具体的な行動',$('action').value],['結果・根拠',$('result').value],['学びと仕事へのつながり',$('learning').value],['深掘り対策',$('followup').value],['事実確認',$('verified').value],['次の修正',$('next').value]];text='28卒 面接質問×経験の根拠マップ\n\n'+fields.map(([a,b])=>a+'\n'+(b.trim()||'（未入力）')).join('\n\n');$('output').textContent=text;$('status').textContent='メモを生成しました';return text} $('make').addEventListener('click',build);$('copy').addEventListener('click',async()=>{const t=build();try{await navigator.clipboard.writeText(t);$('status').textContent='コピーしました'}catch(e){$('status').textContent='コピーできませんでした。メモを選択してコピーしてください'}});$('download').addEventListener('click',()=>{const t=build(),blob=new Blob([t],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='28sotsu-interview-evidence-map.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='TXTを保存しました'});$('reset').addEventListener('click',()=>{if(!confirm('入力内容をすべて消去しますか？'))return;ids.forEach(id=>$(id).value='');$('q').selectedIndex=0;$('verified').selectedIndex=0;text='';$('output').textContent='入力後に「回答メモを生成」を押してください。';$('status').textContent='入力を消去しました'});})();</script></body></html>

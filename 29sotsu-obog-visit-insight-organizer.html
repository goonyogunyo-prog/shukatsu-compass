<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29卒 OB・OG訪問 振り返り・企業研究メモ｜就活コンパス</title><meta name="description" content="29卒向け。OB・OG訪問で聞いた仕事内容・働き方・企業の魅力と不安を整理し、次の質問と志望理由の材料をまとめる無料ワーク。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-obog-visit-insight-organizer.html"><style>body{font-family:system-ui,-apple-system,sans-serif;line-height:1.7;background:#f5f7fb;color:#17243b;margin:0}main{max-width:780px;margin:auto;padding:20px}header{background:#14365c;color:white;padding:22px}header a{color:#fff}h1{font-size:clamp(1.5rem,4vw,2.1rem)}section{background:white;border:1px solid #dce4ef;border-radius:14px;padding:18px;margin:18px 0}label{display:block;font-weight:700;margin:12px 0 4px}input,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #a9b7ca;border-radius:8px;font:inherit}textarea{min-height:90px;resize:vertical}button{padding:12px 18px;border:0;border-radius:8px;background:#1455a2;color:#fff;font-weight:700;cursor:pointer;margin:5px 6px 5px 0}button.secondary{background:#53657c}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #e6a800}#output{white-space:pre-wrap;background:#eef4fb;padding:16px;border-radius:8px;overflow-wrap:anywhere}.hint{color:#53657c;font-size:.92rem}</style></head><body><header><a href="./">就活コンパス</a> / <a href="29sotsu-start-guide-2026.html">29卒スタートガイド</a><h1>OB・OG訪問 振り返り・企業研究メモ</h1><p>訪問後の気づきを「事実・感想・次の行動」に分けて整理。</p></header><main><section><p class="hint">入力はこのページ内だけで処理します。自動保存・外部送信はありません。ページを閉じる前にTXTを保存してください。</p><label for="company">企業名</label><input id="company" maxlength="100" placeholder="例：〇〇株式会社"><label for="date">訪問日</label><input id="date" type="date"><label for="role">訪問相手の職種・部署（個人名は不要）</label><input id="role" maxlength="120" placeholder="例：法人営業・入社5年目"><label for="work">聞いた仕事内容・具体例（事実）</label><textarea id="work"></textarea><label for="culture">働き方・社風について聞いたこと（事実）</label><textarea id="culture"></textarea><label for="attract">自分が魅力に感じた点（感想）</label><textarea id="attract"></textarea><label for="concern">気になった点・確認が必要なこと</label><textarea id="concern"></textarea><label for="fit">自分の経験・価値観との接点</label><textarea id="fit"></textarea><label for="next">次に調べること・追加で聞く質問</label><textarea id="next"></textarea><button id="make" type="button">振り返りを生成</button><button id="copy" type="button" class="secondary">コピー</button><button id="save" type="button" class="secondary">TXT保存</button><button id="clear" type="button" class="secondary">入力を消去</button><p id="status" role="status" aria-live="polite"></p></section><section><h2>まとめ</h2><div id="output">項目を入力して「振り返りを生成」を押してください。</div></section><section><h2>次に活かす3つの視点</h2><ol><li>社員個人の経験と会社全体の制度・傾向を区別する</li><li>魅力だけでなく不安や未確認事項も残す</li><li>志望動機には聞いた事実と自分の価値観の接点を使う</li></ol><p><a href="29sotsu-bizreach-campus-obog.html">29卒 OB・OG訪問の始め方</a></p></section></main><script>"use strict";const ids=["company","date","role","work","culture","attract","concern","fit","next"];const labels=["企業名","訪問日","職種・部署","仕事内容（聞いた事実）","働き方・社風（聞いた事実）","魅力に感じた点（自分の感想）","不安・未確認事項","経験・価値観との接点","次に調べること・質問"];const el=id=>document.getElementById(id);let report="";function make(){report="【29卒 OB・OG訪問 振り返り】\n\n"+ids.map((id,i)=>labels[i]+"：\n"+(el(id).value.trim()||"（未記入）")).join("\n\n");el("output").textContent=report;el("status").textContent="振り返りを生成しました"}el("make").addEventListener("click",make);el("copy").addEventListener("click",async()=>{if(!report)make();try{await navigator.clipboard.writeText(report);el("status").textContent="コピーしました"}catch(e){el("status").textContent="コピーできませんでした。表示された内容を選択してコピーしてください"}});el("save").addEventListener("click",()=>{if(!report)make();const blob=new Blob([report],{type:"text/plain;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="29sotsu-obog-furikaeri.txt";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);el("status").textContent="TXTファイルを生成しました"});el("clear").addEventListener("click",()=>{if(!confirm("入力内容をすべて消去しますか？"))return;ids.forEach(id=>el(id).value="");report="";el("output").textContent="項目を入力して「振り返りを生成」を押してください。";el("status").textContent="入力を消去しました"});</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28卒 面接深掘り質問・回答整理ワーク｜就活コンパス</title><meta name="description" content="28卒向け。ガクチカ・志望動機・自己PRの深掘り質問に回答し、根拠と改善点を整理できる無料ワークシート。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-mensetsu-fukabori-answer-worksheet.html"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#17253a;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:800px;margin:auto;padding:24px 16px 80px}h1{font-size:clamp(1.5rem,4vw,2.1rem)}.panel{background:white;padding:20px;border-radius:16px;margin:18px 0;box-shadow:0 3px 16px #17253a0d}label{display:block;font-weight:700;margin:14px 0 6px}select,textarea,input{width:100%;padding:12px;border:1px solid #aebcd0;border-radius:8px;font:inherit}textarea{min-height:100px;resize:vertical}button{border:0;border-radius:8px;padding:11px 15px;background:#165fc2;color:white;font-weight:700;cursor:pointer;margin:5px 5px 5px 0}button.secondary{background:#40536d}small{color:#53647a}.question{font-weight:700;background:#eaf2ff;padding:12px;border-radius:8px}a{color:#155db8}#result{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5fb;padding:14px;border-radius:8px}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #e39b27;outline-offset:2px}</style></head><body><main><p><a href="./index.html">← 就活コンパス</a></p><h1>28卒 面接深掘り質問・回答整理ワーク</h1><p>面接で聞かれやすい「なぜ？」「具体的には？」を、事実と学びに分けて準備する。入力内容は送信せず、このページ内だけで扱います。</p><section class="panel"><label for="topic">練習テーマ</label><select id="topic"><option value="g">ガクチカ</option><option value="p">自己PR</option><option value="m">志望動機</option></select><label for="question">深掘り質問</label><select id="question"></select><p class="question" id="prompt" aria-live="polite"></p><label for="fact">事実・具体的な行動（数字や状況も）</label><textarea id="fact" placeholder="何を、どのように行ったか"></textarea><label for="reason">理由・判断の根拠</label><textarea id="reason" placeholder="なぜその選択をしたか"></textarea><label for="lesson">結果・学び・仕事へのつながり</label><textarea id="lesson" placeholder="結果と再現できる強み"></textarea><label for="improve">次回改善したい点</label><textarea id="improve" placeholder="曖昧な点や不足する根拠"></textarea><div><button id="build">回答メモを作成</button><button id="copy" class="secondary">コピー</button><button id="download" class="secondary">TXT保存</button><button id="clear" class="secondary">全入力削除</button></div><p id="status" role="status"></p><div id="result" aria-live="polite">ここに回答メモが表示されます。</div></section><small>保存機能はありません。ページを閉じる前に必要なメモをTXT保存してください。質問例は一般的な練習用であり、実際の選考内容を保証するものではありません。</small></main><script>const qs={g:['なぜその活動に取り組んだのですか？','最も難しかった場面は何ですか？','あなた自身の貢献は何ですか？','別の方法を選ばなかった理由は？','その経験を仕事でどう生かしますか？'],p:['その強みが発揮された具体例は？','周囲からどのように評価されましたか？','失敗したときはどうしましたか？','その強みの弱点は何ですか？','入社後どんな場面で生かせますか？'],m:['なぜこの業界を選んだのですか？','なぜ同業他社ではなく当社ですか？','関心を持った事業のどこに魅力を感じますか？','入社後に挑戦したいことは？','志望理由と自身の経験はどうつながりますか？']};const $=id=>document.getElementById(id);function refresh(){const arr=qs[$('topic').value];$('question').replaceChildren(...arr.map((q,i)=>{const o=document.createElement('option');o.value=i;o.textContent=q;return o}));prompt()}function prompt(){$('prompt').textContent=qs[$('topic').value][Number($('question').value)]}function compose(){return ['【質問】'+$('prompt').textContent,'【事実・行動】'+$('fact').value,'【理由・根拠】'+$('reason').value,'【結果・学び】'+$('lesson').value,'【改善点】'+$('improve').value].join('\n\n')}$('topic').addEventListener('change',refresh);$('question').addEventListener('change',prompt);$('build').onclick=()=>{$('result').textContent=compose();$('status').textContent='回答メモを更新しました'};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(compose());$('status').textContent='コピーしました'}catch(e){$('status').textContent='コピーできませんでした。TXT保存をご利用ください'}};$('download').onclick=()=>{const u=URL.createObjectURL(new Blob([compose()],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='mensetsu-fukabori-memo.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);$('status').textContent='TXT保存を開始しました'};$('clear').onclick=()=>{if(!confirm('入力内容をすべて削除しますか？'))return;['fact','reason','lesson','improve'].forEach(id=>$(id).value='');$('result').textContent='ここに回答メモが表示されます。';$('status').textContent='入力を削除しました'};refresh();</script></body></html>

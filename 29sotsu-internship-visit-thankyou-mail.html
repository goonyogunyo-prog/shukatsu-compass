<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29卒 インターン参加後のお礼メール作成｜就活コンパス</title><meta name="description" content="29卒向け。インターン参加後のお礼メールを事実に基づいて作成。学んだこと、印象に残ったこと、今後の行動を整理し、コピー・TXT保存できます。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-internship-visit-thankyou-mail.html"><style>:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#192c45;background:#f5f8fc}*{box-sizing:border-box}body{margin:0}header{background:#122c4b;color:white;padding:20px max(18px,calc((100vw - 850px)/2))}header a{color:white}main{max-width:850px;margin:auto;padding:22px 16px 60px}h1{font-size:clamp(1.5rem,4vw,2.2rem);line-height:1.35}.panel{background:white;border:1px solid #d9e3ee;border-radius:16px;padding:22px;margin:18px 0}label{display:block;font-weight:650;margin:16px 0 6px}input,textarea,select{width:100%;font:inherit;border:1px solid #9fb1c6;border-radius:9px;padding:11px;background:white;color:#192c45}textarea{min-height:94px;resize:vertical}#result{min-height:360px;line-height:1.7}button{font:inherit;background:#155a96;color:white;border:0;border-radius:9px;padding:12px 18px;margin:6px 8px 6px 0;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f1ae36;outline-offset:2px}.secondary{background:#445b72}.note{font-size:.9rem;color:#506174;line-height:1.65}.check label{font-weight:400;display:flex;gap:10px;align-items:flex-start}.check input{width:auto;margin-top:5px}#status{min-height:1.5em;color:#164f72}@media(max-width:480px){.panel{padding:16px}button{width:100%;margin:6px 0}}</style></head><body><header><a href="index.html">就活コンパス</a> / 29卒</header><main><h1>インターン参加後のお礼メール作成</h1><p>参加後の感謝を、実際に学んだ内容とともに簡潔に伝えるための無料ワーク。メール送信は行いません。</p><section class="panel"><h2>1. 事実を入力する</h2><label for="company">企業名</label><input id="company" placeholder="例：株式会社〇〇"><label for="person">担当者名（不明なら採用ご担当者様）</label><input id="person" placeholder="例：人事部 田中様"><label for="date">参加日（任意）</label><input id="date" type="date"><label for="program">参加したプログラム</label><input id="program" placeholder="例：営業職1day仕事体験"><label for="learn">実際に学んだこと・印象に残った場面</label><textarea id="learn" placeholder="例：顧客の課題を整理するワークで、社員の方から〇〇という視点を学んだ"></textarea><label for="next">今後取り組みたいこと（任意）</label><textarea id="next" placeholder="例：業界研究を深め、今回学んだ視点を企業比較に活かす"></textarea><label for="sender">自分の氏名</label><input id="sender" placeholder="例：山田 太郎"><button id="generate" type="button">件名・本文を作成</button><button class="secondary" id="clear" type="button">入力を消去</button></section><section class="panel"><h2>2. 下書きを編集する</h2><label for="subject">件名</label><input id="subject"><label for="result">メール本文（自由に修正可能）</label><textarea id="result"></textarea><p class="note">内容は入力した事実だけから作成します。実際に参加していない内容や、感じていない感想は書かないでください。</p><button id="copy" type="button">件名と本文をコピー</button><button id="save" type="button">TXT保存</button><p id="status" role="status" aria-live="polite"></p></section><section class="panel check"><h2>3. 送信前の確認</h2><label><input type="checkbox">宛先・企業名・担当者名が正しい</label><label><input type="checkbox">参加日とプログラム名が正しい</label><label><input type="checkbox">学んだ内容が事実に基づいている</label><label><input type="checkbox">誤字脱字・敬語・署名を確認した</label><label><input type="checkbox">送信時期と企業からの案内を確認した</label></section><p class="note">入力情報はこのページ内で処理し、自動保存・外部送信しません。TXTには個人情報が含まれるため保存先・共有先に注意してください。お礼メールの送信は必須ではなく、企業から連絡方法の指定がある場合はそちらを優先してください。</p><p><a href="29sotsu-start-guide-2026.html">29卒スタートガイドへ戻る</a></p></main><script>(function(){'use strict';const $=id=>document.getElementById(id);const val=id=>$(id).value.trim();const status=s=>$('status').textContent=s;$('generate').addEventListener('click',()=>{const c=val('company'),p=val('person'),prog=val('program'),learn=val('learn'),sender=val('sender');if(!c||!prog||!learn||!sender){status('企業名・プログラム・学んだこと・氏名を入力してください。');return;}const d=val('date');$('subject').value='【御礼】'+prog+'参加のお礼（'+sender+'）';$('result').value=c+'\n'+(p||'採用ご担当者様')+'\n\nお世話になっております。'+sender+'と申します。\n\n'+(d?d+'に':'このたび')+'参加いたしました「'+prog+'」について、貴重な機会をいただき、誠にありがとうございました。\n\n特に、'+learn+'\n\n'+(val('next')?'今回の経験を踏まえ、'+val('next')+'\n\n':'')+'今後ともどうぞよろしくお願いいたします。\n\n'+sender;status('下書きを作成しました。事実・敬語・送信先を確認してください。');});function output(){return '件名：'+val('subject')+'\n\n'+val('result');}$('copy').addEventListener('click',async()=>{if(!val('result')){status('本文を作成してください。');return;}try{await navigator.clipboard.writeText(output());status('コピーしました。');}catch(e){status('コピーできませんでした。本文を選択して手動でコピーしてください。');}});$('save').addEventListener('click',()=>{if(!val('result')){status('本文を作成してください。');return;}const blob=new Blob(['\ufeff'+output()],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='internship-thankyou-mail.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);status('TXTファイルを保存しました。');});$('clear').addEventListener('click',()=>{for(const el of document.querySelectorAll('input:not([type=checkbox]),textarea'))el.value='';for(const el of document.querySelectorAll('input[type=checkbox]'))el.checked=false;status('入力を消去しました。');});})();</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28卒 面接の逆質問15選・質問選択ワーク｜就活コンパス</title><meta name="description" content="28卒向け面接の逆質問15例。仕事内容・社風・成長環境・事業・働き方から質問を選び、企業研究メモと合わせて自分だけの質問リストを作成。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-interview-reverse-question-selector.html"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#192b43;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#102b50;color:white;padding:20px max(16px,calc((100vw - 850px)/2))}header a{color:#d5e7ff}main{max-width:850px;margin:24px auto;padding:0 16px 50px}h1{font-size:clamp(1.5rem,4vw,2.2rem)}section{background:white;border:1px solid #dbe3ed;border-radius:14px;padding:20px;margin:16px 0}label{display:block;font-weight:650;margin:12px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #a7b7cb;border-radius:8px;font:inherit}textarea{min-height:100px}button{border:0;background:#145caa;color:white;padding:11px 14px;border-radius:8px;font:inherit;cursor:pointer;margin:5px 5px 5px 0}button.secondary{background:#e9f0f8;color:#163b67}.q{border-top:1px solid #dbe3ed;padding:12px 0}.q label{display:flex;gap:10px;align-items:flex-start;line-height:1.5}.q input{width:auto;margin-top:5px}.hint{color:#52657c;font-size:.9rem}#result{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7fc;padding:14px;border-radius:8px;min-height:90px}footer{text-align:center;color:#52657c;padding:20px}@media(max-width:480px){section{padding:15px}button{width:100%;margin:5px 0}}</style></head><body><header><a href="./index.html">就活コンパス</a> / <a href="./28sotsu-guide-directory.html">28卒ガイド</a></header><main><h1>28卒｜面接の逆質問15選・質問選択ワーク</h1><p>企業について調べた事実と、自分が確かめたいことを分けて整理。質問例はそのまま使わず、応募先に合わせて調整しましょう。</p><section><label for="company">企業名（任意）</label><input id="company" maxlength="100" placeholder="例：株式会社〇〇"><label for="research">公式サイト・説明会などで確認した事実</label><textarea id="research" placeholder="情報の出典・確認日もメモ"></textarea><label for="purpose">面接で特に確かめたいこと</label><textarea id="purpose" placeholder="例：若手の裁量と育成の進め方"></textarea></section><section><label for="filter">質問のカテゴリ</label><select id="filter"><option value="すべて">すべて</option><option>仕事内容</option><option>成長環境</option><option>社風</option><option>事業・顧客</option><option>働き方</option></select><p id="count" class="hint" aria-live="polite"></p><div id="questions"></div></section><section><label for="custom">自分で考えた追加質問（任意）</label><textarea id="custom" placeholder="1行に1問"></textarea><button id="build">選択した質問をまとめる</button><button class="secondary" id="copy">結果をコピー</button><button class="secondary" id="download">TXT保存</button><button class="secondary" id="clear">入力を消去</button><p class="hint">個人情報を含む内容は共有前に確認してください。入力は自動保存・外部送信されません。</p><h2>質問リスト</h2><div id="result" role="status" aria-live="polite">質問を選択して「まとめる」を押してください。</div></section><section><h2>面接前の確認</h2><p>公開情報で答えが分かる質問になっていないか、相手の立場で答えられる内容か、回答を受けて深掘りできるかを確認しましょう。待遇や制度は企業公式情報も照合してください。</p></section></main><footer>就活コンパス｜28卒向け無料ワーク</footer><script>const DATA=[{"category": "仕事内容", "question": "入社後、若手社員が最初に任される業務と、その後の担当範囲の広がりを教えてください。"}, {"category": "仕事内容", "question": "成果を出している社員の方に共通する行動や工夫はありますか。"}, {"category": "仕事内容", "question": "部署間で協働する場面では、どのような調整が必要になりますか。"}, {"category": "成長環境", "question": "新入社員が仕事を覚える際、どのようなフィードバックを受けられますか。"}, {"category": "成長環境", "question": "若手が自ら提案したことが実際の業務に反映された例はありますか。"}, {"category": "成長環境", "question": "配属後の学習や専門性の習得を支える仕組みを教えてください。"}, {"category": "社風", "question": "意見が分かれたとき、チームではどのように意思決定していますか。"}, {"category": "社風", "question": "社員の方が仕事で大切にしている価値観を具体例とともに伺えますか。"}, {"category": "社風", "question": "他部署との交流や情報共有はどのように行われていますか。"}, {"category": "事業・顧客", "question": "現在の事業で顧客から特に期待されている役割は何でしょうか。"}, {"category": "事業・顧客", "question": "顧客の課題を発見するために、現場で工夫されていることはありますか。"}, {"category": "事業・顧客", "question": "今後注力する領域について、現場ではどんな変化を感じていますか。"}, {"category": "働き方", "question": "繁忙期と通常期では、チームの仕事の進め方にどのような違いがありますか。"}, {"category": "働き方", "question": "仕事の優先順位を決める際に、どのような基準を用いていますか。"}, {"category": "働き方", "question": "部署ごとの働き方の違いを理解するために確認すべき点はありますか。"}];const selected=new Set();const list=document.getElementById('questions');const result=document.getElementById('result');function render(){const f=document.getElementById('filter').value;list.replaceChildren();DATA.forEach((x,i)=>{if(f!=='すべて'&&x.category!==f)return;const div=document.createElement('div');div.className='q';const lab=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.checked=selected.has(i);cb.addEventListener('change',()=>{cb.checked?selected.add(i):selected.delete(i);updateCount()});const span=document.createElement('span');span.textContent='【'+x.category+'】'+x.question;lab.append(cb,span);div.append(lab);list.append(div)});updateCount()}function updateCount(){document.getElementById('count').textContent=selected.size+' / 15問を選択中'}function build(){const company=document.getElementById('company').value.trim();const research=document.getElementById('research').value.trim();const purpose=document.getElementById('purpose').value.trim();const custom=document.getElementById('custom').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);const qs=[...selected].sort((a,b)=>a-b).map(i=>DATA[i].question).concat(custom);result.textContent=['面接の逆質問メモ',company?'企業名：'+company:'','確認した事実：'+(research||'未入力'),'確かめたいこと：'+(purpose||'未入力'),'','質問：',...(qs.length?qs.map((q,i)=>(i+1)+'. '+q):['未選択'])].filter((x,i)=>x!==''||i===4).join('\n')}document.getElementById('filter').addEventListener('change',render);document.getElementById('build').addEventListener('click',build);document.getElementById('copy').addEventListener('click',async()=>{build();try{await navigator.clipboard.writeText(result.textContent);alert('コピーしました')}catch(e){alert('コピーできませんでした。結果を選択してコピーしてください。')}});document.getElementById('download').addEventListener('click',()=>{build();const url=URL.createObjectURL(new Blob([result.textContent],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='28sotsu-gyakushitsumon.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});document.getElementById('clear').addEventListener('click',()=>{if(!confirm('入力と選択を消去しますか？'))return;['company','research','purpose','custom'].forEach(id=>document.getElementById(id).value='');selected.clear();result.textContent='質問を選択して「まとめる」を押してください。';render()});render();</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28卒 内定条件比較・承諾前チェックシート｜就活コンパス</title><meta name="description" content="28卒向け。内定先の給与・勤務地・配属・働き方・回答期限を公式書面と照合し、承諾前に未確認事項を整理できる無料チェックシート。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-naitei-offer-comparison-checklist.html"><style>:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#152638;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:24px 16px 64px}header{background:#102e47;color:white;padding:16px}header a{color:white}h1{font-size:clamp(1.5rem,4vw,2.3rem)}.card{background:white;border:1px solid #dbe4ec;border-radius:14px;padding:18px;margin:16px 0}label{display:block;font-weight:650;margin:12px 0 5px}input,textarea,select{width:100%;font:inherit;padding:10px;border:1px solid #9caebd;border-radius:8px}textarea{min-height:76px;resize:vertical}button{background:#115b86;color:white;border:0;border-radius:8px;padding:12px 16px;margin:5px 6px 5px 0;font:inherit;cursor:pointer}button.secondary{background:#475569}.muted{color:#536579;font-size:.92rem}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.check{display:flex;align-items:flex-start;gap:10px;padding:9px 0}.check input{width:auto;margin-top:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef4f8;padding:14px;border-radius:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}main{padding:15px 12px 50px}}</style></head><body><header><a href="./index.html">← 就活コンパス</a>　<a href="./28sotsu-guide-directory.html">28卒ガイド</a></header><main><p class="muted">28卒 / 内定後の意思決定</p><h1>内定条件比較・承諾前チェックシート</h1><p>複数社の条件を並べ、確認済みの事実と自分の希望を分けて整理します。内定承諾や辞退を自動で判断するものではありません。</p><div class="card"><h2>企業A・企業Bの条件を整理</h2><div class="grid"><div><label for="a">企業A</label><input id="a" placeholder="企業名（任意）"></div><div><label for="b">企業B</label><input id="b" placeholder="企業名（任意）"></div></div><div id="fields"></div></div><div class="card"><h2>承諾前に確認すること</h2><p class="muted">確認できたものだけチェック。企業からの正式な労働条件通知書・募集要項などを優先してください。</p><div id="checks"></div><label for="questions">企業へ確認したい質問・情報源</label><textarea id="questions" placeholder="例：配属の決定時期はいつか／採用担当からの回答日と出典"></textarea><label for="priority">自分が最も重視する条件</label><textarea id="priority" placeholder="例：勤務地の確実性、業務内容、転勤頻度など"></textarea></div><div class="card"><h2>比較メモ</h2><button id="make">比較メモを作成</button><button id="copy" class="secondary">コピー</button><button id="save" class="secondary">TXT保存</button><button id="clear" class="secondary">入力をすべて消去</button><p id="status" aria-live="polite" class="muted"></p><pre id="result">「比較メモを作成」を押すと結果が表示されます。</pre></div><p class="muted">入力内容は自動保存・外部送信しません。共有端末での利用やファイルの共有にはご注意ください。回答期限や契約条件は必ず企業の正式な案内で確認してください。</p></main><script>const categories=['基本給・諸手当（額面と内訳）','賞与・評価制度','勤務地・転勤の可能性','職種・配属の決まり方','勤務時間・休日・残業','福利厚生・研修','入社日・承諾回答期限'];const checks=['労働条件通知書等の正式資料を確認した','基本給と固定残業代の内訳を確認した','勤務地と転勤条件を確認した','配属・職種の確約範囲を確認した','休日・勤務時間・試用期間を確認した','回答期限と承諾手続きを確認した','未確認事項を担当者へ質問した','自分の希望条件と照らして検討した'];const fields=document.getElementById('fields');categories.forEach((x,i)=>{const d=document.createElement('div');d.className='grid';d.innerHTML='<div><label for="a'+i+'">'+x+'：企業A</label><textarea id="a'+i+'" placeholder="確認した事実・出典"></textarea></div><div><label for="b'+i+'">'+x+'：企業B</label><textarea id="b'+i+'" placeholder="確認した事実・出典"></textarea></div>';fields.append(d)});const c=document.getElementById('checks');checks.forEach((x,i)=>{const l=document.createElement('label');l.className='check';const input=document.createElement('input');input.type='checkbox';input.id='c'+i;const span=document.createElement('span');span.textContent=x;l.append(input,span);c.append(l)});const v=id=>document.getElementById(id).value.trim();function build(){const lines=['28卒 内定条件比較・承諾前チェック','企業A：'+(v('a')||'未入力'),'企業B：'+(v('b')||'未入力'),''];categories.forEach((x,i)=>lines.push('■ '+x,'A：'+(v('a'+i)||'未確認'),'B：'+(v('b'+i)||'未確認'),''));lines.push('■ 承諾前チェック');checks.forEach((x,i)=>lines.push((document.getElementById('c'+i).checked?'[確認済] ':'[未確認] ')+x));lines.push('','■ 質問・情報源',v('questions')||'未入力','■ 重視する条件',v('priority')||'未入力','※正式条件・回答期限は企業の書面等で再確認してください。');return lines.join('\n')}document.getElementById('make').onclick=()=>{document.getElementById('result').textContent=build();document.getElementById('status').textContent='比較メモを更新しました。'};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(build());document.getElementById('status').textContent='コピーしました。'}catch(e){document.getElementById('status').textContent='コピーできませんでした。メモを選択してコピーしてください。';document.getElementById('result').textContent=build()}};document.getElementById('save').onclick=()=>{const blob=new Blob([build()],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='28sotsu-offer-comparison.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('status').textContent='TXTを作成しました。'};document.getElementById('clear').onclick=()=>{if(!confirm('入力内容をすべて消去しますか？'))return;document.querySelectorAll('input[type=text],textarea').forEach(e=>e.value='');document.querySelectorAll('input[type=checkbox]').forEach(e=>e.checked=false);document.getElementById('a').value='';document.getElementById('b').value='';document.getElementById('result').textContent='入力を消去しました。';document.getElementById('status').textContent='消去しました。'};</script></body></html>

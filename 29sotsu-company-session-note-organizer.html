<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29卒｜企業説明会メモ整理・比較シート（無料）｜就活コンパス</title><meta name="description" content="29卒向け企業説明会メモ整理ツール。仕事内容・社風・確認した事実・疑問・次の行動を会社別に記録し、比較してCSV・TXT保存。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-company-session-note-organizer.html"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#172b44;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header,main,footer{max-width:900px;margin:auto;padding:20px}header{background:#102e52;color:white;max-width:none}header>div{max-width:860px;margin:auto}a{color:inherit}main{padding-top:30px}h1{font-size:clamp(1.55rem,5vw,2.3rem)}.card{background:white;border:1px solid #dce4ed;border-radius:14px;padding:18px;margin:16px 0;box-shadow:0 2px 8px #102e5209}label{display:block;font-weight:650;margin:14px 0 6px}input,textarea,select{width:100%;font:inherit;padding:11px;border:1px solid #a8b7c8;border-radius:8px;background:white}textarea{min-height:85px;resize:vertical}button{background:#164c87;color:white;border:0;border-radius:8px;padding:11px 14px;font:inherit;cursor:pointer;margin:5px 5px 5px 0}button.secondary{background:#e8eff7;color:#123d70}button.danger{background:#9a3030}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f5b83d;outline-offset:2px}.muted{color:#536479;font-size:.92rem}.item{border-top:1px solid #dae3ed;padding:12px 0;overflow-wrap:anywhere}.flex{display:flex;gap:12px;flex-wrap:wrap}.flex>*{flex:1 1 180px}#notice{min-height:1.5em;font-weight:600}@media print{button,form,.noprint{display:none!important}.card{box-shadow:none}body{background:white}} </style></head><body><header><div><a href="./index.html">就活コンパス トップへ</a>　/　<a href="./29sotsu-start-guide-2026.html">29卒ガイド</a></div></header><main><p class="muted">29卒 / 登録不要・無料</p><h1>企業説明会メモ整理・比較シート</h1><p>説明会で聞いた「事実」と自分の「印象」を分けて記録。複数社を比較し、次に確認することを明確にできます。</p><section class="card"><h2>1社分のメモを追加</h2><form id="form"><div class="flex"><div><label for="company">企業名（必須）</label><input id="company" maxlength="100" required placeholder="例：〇〇株式会社"></div><div><label for="date">参加日</label><input id="date" type="date"></div></div><label for="business">仕事内容・事業（説明会で確認した事実）</label><textarea id="business" maxlength="2000"></textarea><label for="culture">働き方・社風（説明会で確認した事実）</label><textarea id="culture" maxlength="2000"></textarea><label for="source">情報源・確認先</label><input id="source" maxlength="300" placeholder="例：説明会の社員発言／公式採用ページ"></input><label for="impression">自分の印象・興味（主観）</label><textarea id="impression" maxlength="2000"></textarea><label for="question">まだ確認できていない疑問</label><textarea id="question" maxlength="2000"></textarea><label for="action">次にやること</label><textarea id="action" maxlength="2000"></textarea><label for="interest">現時点の関心度（自分の目安）</label><select id="interest"><option value="未設定">未設定</option><option value="高い">高い</option><option value="普通">普通</option><option value="低い">低い</option></select><button type="submit">この企業を追加</button><button type="reset" class="secondary">入力欄をクリア</button></form><p id="notice" role="status" aria-live="polite"></p></section><section class="card"><h2>登録した企業 <span id="count">0</span>社</h2><div class="flex"><div><label for="filter">企業名で検索</label><input id="filter" placeholder="絞り込み"></div><div><label for="sort">並び順</label><select id="sort"><option value="new">追加した順</option><option value="name">企業名順</option><option value="date">参加日順</option></select></div></div><div class="noprint"><button id="txt" type="button">TXT保存</button><button id="csv" type="button" class="secondary">CSV保存</button><button id="json" type="button" class="secondary">再開用JSON保存</button><label for="restore">保存したJSONを読み込む</label><input type="file" id="restore" accept="application/json,.json"><button id="print" type="button" class="secondary">印刷・PDF保存</button><button id="clear" type="button" class="danger">全件削除</button></div><div id="results" aria-live="polite"><p>企業を登録するとここに表示されます。</p></div></section><p class="muted">入力データは自動保存・外部送信されません。画面を閉じる前にJSONを保存してください。CSV・TXT・JSONには企業名とメモが含まれるため共有時は注意してください。募集情報・待遇・選考条件は必ず企業の公式案内で再確認してください。比較結果は採用評価や内定可能性を示しません。</p></main><footer><a href="./index.html">トップへ戻る</a></footer><script>"use strict";(()=>{const $=id=>document.getElementById(id);let records=[];const fields=['company','date','business','culture','source','impression','question','action','interest'];const labels=['企業名','参加日','仕事内容・事業（事実）','働き方・社風（事実）','情報源','印象（主観）','疑問','次の行動','関心度'];const escapeCsv=s=>'"'+String(s??'').replace(/"/g,'""')+'"';function download(filename,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}function render(){const q=$('filter').value.trim().toLocaleLowerCase();let arr=records.filter(x=>x.company.toLocaleLowerCase().includes(q));if($('sort').value==='name')arr.sort((a,b)=>a.company.localeCompare(b.company,'ja'));if($('sort').value==='date')arr.sort((a,b)=>a.date.localeCompare(b.date));$('count').textContent=records.length;const root=$('results');root.replaceChildren();if(!arr.length){const p=document.createElement('p');p.textContent='該当する企業がありません。';root.append(p);return}arr.forEach(r=>{const div=document.createElement('article');div.className='item';const h=document.createElement('h3');h.textContent=r.company+'（'+(r.date||'日付未設定')+'）';div.append(h);fields.slice(2).forEach((f,i)=>{if(!r[f])return;const p=document.createElement('p');const b=document.createElement('strong');b.textContent=labels[i+2]+'：';p.append(b,document.createTextNode(r[f]));div.append(p)});const b=document.createElement('button');b.type='button';b.className='danger';b.textContent='この企業を削除';b.addEventListener('click',()=>{if(confirm(r.company+' のメモを削除しますか？')){records=records.filter(x=>x.id!==r.id);render()}});div.append(b);root.append(div)})}function get(){return records.map(r=>fields.map(k=>r[k]??''))}function safe(x){return x&&typeof x==='object'&&fields.every(k=>typeof x[k]==='string'&&x[k].length<=2500)&&x.company.trim().length>0&&x.company.length<=100}function note(t){$('notice').textContent=t}$('form').addEventListener('submit',e=>{e.preventDefault();if(records.length>=100){note('最大100社です。先に不要な企業を削除してください。');return}const r={id:String(Date.now())+'-'+Math.random().toString(36).slice(2)};fields.forEach(k=>r[k]=$(k).value.trim());records.push(r);$('form').reset();note('追加しました。画面を閉じる前にJSON保存してください。');render()});$('filter').addEventListener('input',render);$('sort').addEventListener('change',render);$('txt').addEventListener('click',()=>download('29sotsu-session-notes.txt',records.map(r=>fields.map((k,i)=>labels[i]+'：'+r[k]).join('\n')).join('\n\n---\n\n'),'text/plain;charset=utf-8'));$('csv').addEventListener('click',()=>download('29sotsu-session-notes.csv','\uFEFF'+[labels,...get()].map(row=>row.map(escapeCsv).join(',')).join('\r\n'),'text/csv;charset=utf-8'));$('json').addEventListener('click',()=>download('29sotsu-session-notes.json',JSON.stringify({version:1,records},null,2),'application/json'));$('restore').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>1200000)throw Error('ファイルが大きすぎます');const obj=JSON.parse(await file.text());if(obj.version!==1||!Array.isArray(obj.records)||obj.records.length>100||!obj.records.every(safe))throw Error('対応していないデータ形式です');if(!confirm('現在の一覧を保存ファイルの内容で置き換えますか？'))return;records=obj.records.map((r,i)=>({...Object.fromEntries(fields.map(k=>[k,r[k]])),id:String(i)+'-'+Date.now()}));render();note('復元しました。')}catch(err){note('復元できません：'+err.message)}finally{e.target.value=''}});$('clear').addEventListener('click',()=>{if(confirm('登録した全企業を削除しますか？')){records=[];render();note('全件削除しました。')}});$('print').addEventListener('click',()=>window.print());render()})();</script></body></html>

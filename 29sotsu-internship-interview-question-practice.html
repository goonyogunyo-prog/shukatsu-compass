<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>29卒 インターン面接 質問練習シート｜就活コンパス</title><meta name="description" content="29卒向けインターン面接の頻出質問を整理。回答の骨子、深掘り質問、改善点を記録してテキスト保存できる無料ツール。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-internship-interview-question-practice.html"><style>body{font-family:system-ui,sans-serif;background:#f5f7fb;color:#1d2939;margin:0;line-height:1.7}header{background:#123b66;color:white;padding:22px max(18px,calc((100% - 900px)/2))}main{max-width:900px;margin:auto;padding:20px}section{background:white;border:1px solid #d8e0eb;border-radius:12px;padding:18px;margin:16px 0}h1{font-size:1.6rem;line-height:1.4}h2{font-size:1.15rem}label{display:block;font-weight:650;margin:12px 0 5px}select,textarea,input{box-sizing:border-box;width:100%;font:inherit;padding:10px;border:1px solid #8d9aab;border-radius:8px}textarea{min-height:100px}button{font:inherit;padding:10px 15px;margin:6px 6px 6px 0;border:0;border-radius:8px;background:#155e9d;color:white;cursor:pointer}button.secondary{background:#526173}button:focus-visible,a:focus-visible{outline:3px solid #e59d19;outline-offset:3px}.hint{color:#526173;font-size:.92rem}.count{font-variant-numeric:tabular-nums}a{color:#155e9d}header a{color:white}ul{padding-left:24px}#status{min-height:1.5em} @media(max-width:480px){main{padding:12px}section{padding:14px}h1{font-size:1.35rem}}</style></head><body><header><a href="index.html">就活コンパス</a> / <a href="29sotsu-start-guide-2026.html">29卒スタートガイド</a><h1>29卒 インターン面接 質問練習シート</h1><p>答えを暗記するより、伝えたい根拠を整理しよう。</p></header><main><section><h2>質問を選ぶ</h2><label for="question">練習する質問</label><select id="question"></select><p id="point" class="hint"></p><label for="company">応募企業・プログラム名（任意）</label><input id="company" maxlength="100" placeholder="例：〇〇株式会社 夏季インターン"><label for="answer">回答の骨子（結論・根拠・具体例）</label><textarea id="answer" maxlength="4000" placeholder="結論→理由→自分の経験→参加後に学びたいこと"></textarea><p class="hint count" id="count">0文字</p><label for="follow">想定される深掘り質問と回答</label><textarea id="follow" maxlength="4000"></textarea><label for="improve">次回改善すること</label><textarea id="improve" maxlength="2000"></textarea><button id="save">この回答を記録</button><button id="export" class="secondary">全記録をTXT保存</button><button id="clear" class="secondary">入力を消去</button><p id="status" role="status" aria-live="polite"></p></section><section><h2>練習履歴（この画面を開いている間のみ）</h2><p class="hint">個人情報保護のため自動保存や外部送信はしません。ページを閉じる前にTXT保存してください。最大30件。</p><ul id="history"></ul><button id="clearHistory" class="secondary">履歴をすべて削除</button></section><section><h2>面接練習のコツ</h2><p>企業の最新情報や募集要項は必ず公式情報で確認してください。質問は一般的な練習例であり、実際の選考で出題されることを保証しません。</p><p><a href="29sotsu-start-guide-2026.html">29卒の就活準備へ戻る</a></p></section></main><script>"use strict";const qs=[['自己紹介を1分でお願いします','所属・取り組み・強みを簡潔に'],['インターンを志望する理由は？','企業固有の関心と学びたいことを分ける'],['なぜこの業界に興味を持ちましたか？','きっかけと調べた事実をつなぐ'],['学生時代に力を入れたことは？','課題・自分の行動・結果を具体的に'],['チームで意見が割れた経験は？','対立の整理と合意形成の工夫'],['失敗から何を学びましたか？','改善行動まで伝える'],['あなたの強みは何ですか？','根拠となる行動を添える'],['弱みをどう改善していますか？','改善策と現在の取り組み'],['インターンで挑戦したいことは？','実現可能な学習目標にする'],['当社について知っていることは？','公式情報と自分の解釈を区別'],['困難な課題を解決した経験は？','問題の原因と打ち手を整理'],['最後に質問はありますか？','公開情報だけでは分からない点を質問']];const $=id=>document.getElementById(id);const history=[];qs.forEach(([q],i)=>{const o=document.createElement('option');o.value=i;o.textContent=q;$('question').append(o)});function update(){ $('point').textContent=qs[Number($('question').value)][1];$('count').textContent=Array.from($('answer').value).length+'文字'}$('question').addEventListener('change',update);$('answer').addEventListener('input',update);function values(){return {question:qs[Number($('question').value)][0],company:$('company').value.trim(),answer:$('answer').value.trim(),follow:$('follow').value.trim(),improve:$('improve').value.trim()}}function render(){const ul=$('history');ul.replaceChildren();history.forEach((v,i)=>{const li=document.createElement('li');const title=document.createElement('strong');title.textContent=(i+1)+'. '+v.question+(v.company?'｜'+v.company:'');li.append(title);const b=document.createElement('button');b.className='secondary';b.textContent='削除';b.addEventListener('click',()=>{history.splice(i,1);render()});li.append(b);ul.append(li)})}$('save').addEventListener('click',()=>{const v=values();if(!v.answer){$('status').textContent='回答の骨子を入力してください';return}history.unshift(v);if(history.length>30)history.pop();render();$('status').textContent='記録しました。ページを閉じる前にTXT保存してください'});$('export').addEventListener('click',()=>{const all=history.length?history:[values()];if(!all.some(x=>x.answer||x.follow||x.improve)){$('status').textContent='保存する内容がありません';return}const content=all.map((v,i)=>['# '+(i+1)+' '+v.question,'企業：'+v.company,'回答：'+v.answer,'深掘り：'+v.follow,'改善：'+v.improve].join('\n')).join('\n\n');const blob=new Blob([content],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='29sotsu-interview-practice.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='TXT保存を開始しました'});$('clear').addEventListener('click',()=>{['company','answer','follow','improve'].forEach(id=>$(id).value='');update();$('status').textContent='入力欄を消去しました'});$('clearHistory').addEventListener('click',()=>{if(confirm('練習履歴をすべて削除しますか？')){history.length=0;render();$('status').textContent='履歴を削除しました'}});update();</script></body></html>

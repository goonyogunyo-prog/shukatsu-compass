<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28卒 面接当日チェックリスト｜持ち物・アクセス・直前確認｜就活コンパス</title><meta name="description" content="28卒向け面接当日の10項目チェックリスト。会場・アクセス・持ち物・オンライン環境を整理し、TXT保存。入力はブラウザ内で処理します。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-mensetsu-toujitsu-checklist.html"><style>body{margin:0;background:#f4f7fb;color:#182b46;font:16px/1.65 system-ui,sans-serif}main{max-width:780px;margin:auto;padding:24px 16px 80px}a{color:#145bb3}h1{font-size:clamp(1.6rem,5vw,2.5rem);line-height:1.3}.panel{background:white;border:1px solid #dce5ef;border-radius:16px;padding:20px;margin:18px 0}.check{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #e5ebf2}input[type=checkbox]{width:22px;height:22px;flex-shrink:0}input[type=text],input[type=date],textarea{width:100%;box-sizing:border-box;border:1px solid #aebfd1;border-radius:8px;padding:11px;font:inherit}textarea{min-height:110px}button{border:0;border-radius:9px;padding:12px 16px;background:#185eb1;color:white;font:inherit;cursor:pointer;margin:4px}button.secondary{background:#52677f}.muted{color:#53667d}.progress{height:12px;background:#e2e9f2;border-radius:20px;overflow:hidden}#bar{height:100%;width:0;background:#1a7b63}@media(max-width:420px){.panel{padding:14px}button{width:100%;margin:5px 0}}</style></head><body><main><nav><a href="index.html">就活コンパス</a> / <a href="28sotsu-guide-directory.html">28卒ガイド</a></nav><p class="muted">28卒｜面接準備</p><h1>面接当日チェックリスト</h1><p>面接直前の確認漏れを減らすための10項目。実際の案内・企業指定を必ず優先してください。</p><section class="panel"><label>企業名（任意）<input id="company" type="text" maxlength="100" placeholder="例：応募先企業"></label><label>面接日（任意）<input id="day" type="date"></label><p id="count" aria-live="polite">0 / 10 項目確認済み</p><div class="progress"><div id="bar"></div></div><label class="check"><input type="checkbox" data-i="0"><span>面接日時・集合時刻・所要時間を公式案内で再確認</span></label><label class="check"><input type="checkbox" data-i="1"><span>会場住所・建物名・受付方法・オンラインURLを確認</span></label><label class="check"><input type="checkbox" data-i="2"><span>交通経路と遅延時の代替経路を確認</span></label><label class="check"><input type="checkbox" data-i="3"><span>緊急連絡先・担当者名を控える</span></label><label class="check"><input type="checkbox" data-i="4"><span>履歴書・提出済みES・募集要項を読み返す</span></label><label class="check"><input type="checkbox" data-i="5"><span>自己紹介・志望理由・ガクチカの要点を整理</span></label><label class="check"><input type="checkbox" data-i="6"><span>逆質問を2〜3個準備</span></label><label class="check"><input type="checkbox" data-i="7"><span>身だしなみ・服装指定・持ち物を確認</span></label><label class="check"><input type="checkbox" data-i="8"><span>通信環境・カメラ・マイクを確認（オンライン）</span></label><label class="check"><input type="checkbox" data-i="9"><span>面接後に振り返るメモ欄を準備</span></label></section><section class="panel"><h2>当日の確認メモ</h2><label>集合場所・連絡先など<textarea id="memo" maxlength="3000" placeholder="企業の案内を見ながら記録"></textarea></label><div><button id="save">TXTに保存</button><button id="copy" class="secondary">コピー</button><button id="clear" class="secondary">すべてクリア</button></div><p id="status" role="status"></p><p class="muted">入力・チェック内容は自動保存しません。TXTやコピーには企業名・メモが含まれるため共有時にご注意ください。外部送信は行いません。</p></section><p><a href="28sotsu-mensetsu-1min-timer.html">面接1分回答タイマーへ</a></p></main><script>(()=>{const boxes=[...document.querySelectorAll('[data-i]')],$=id=>document.getElementById(id),status=$('status');function update(){let n=boxes.filter(x=>x.checked).length;$('count').textContent=`${n} / 10 項目確認済み`;$('bar').style.width=(n*10)+'%';}boxes.forEach(x=>x.addEventListener('change',update));function output(){return ['28卒 面接当日チェックリスト','企業名：'+$('company').value,'面接日：'+$('day').value,...boxes.map((x,i)=>(x.checked?'[x] ':'[ ] ')+x.nextElementSibling.textContent),'確認メモ：',$('memo').value].join('\n')}$('save').onclick=()=>{let b=new Blob([output()],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='28sotsu-mensetsu-checklist.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);status.textContent='TXT保存を開始しました';};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(output());status.textContent='コピーしました';}catch{status.textContent='コピーできませんでした。TXT保存をご利用ください';}};$('clear').onclick=()=>{if(!confirm('入力とチェックをすべて消去しますか？'))return;boxes.forEach(x=>x.checked=false);['company','day','memo'].forEach(x=>$(x).value='');update();status.textContent='クリアしました';};update();})();</script></body></html>

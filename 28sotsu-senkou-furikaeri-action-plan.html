<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28卒 選考振り返り・次回改善アクション作成｜就活コンパス</title><meta name="description" content="28卒向け。面接・ES・Webテストの選考結果を振り返り、事実と仮説を分けて次回の改善行動を作る無料ワーク。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-senkou-furikaeri-action-plan.html"><style>:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#172b45;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#103b65;color:white;padding:24px max(18px,calc((100vw - 900px)/2))}header a{color:#d8edff}main{max-width:900px;margin:25px auto;padding:0 16px 50px}.card{background:white;border:1px solid #dbe4ef;border-radius:16px;padding:22px;margin:18px 0;box-shadow:0 4px 16px #173f6110}h1{font-size:clamp(23px,4vw,34px);margin:8px 0}h2{font-size:20px;margin:0 0 15px}label{display:block;font-weight:700;margin:14px 0 6px}input,select,textarea{display:block;width:100%;font:inherit;border:1px solid #9aafc4;border-radius:9px;padding:12px;background:white;color:#162d45}textarea{min-height:100px;resize:vertical}button{font:inherit;border:0;border-radius:9px;padding:12px 18px;background:#1766a8;color:white;font-weight:700;cursor:pointer;margin:6px 6px 6px 0}button.secondary{background:#e6eef6;color:#14395a}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #f2b94b;outline-offset:2px}.hint{color:#52677b;font-size:14px}.notice{background:#fff7e5;border-left:4px solid #d9991c;padding:12px;border-radius:6px}.checks label{font-weight:400;display:flex;align-items:flex-start;gap:10px}.checks input{width:auto;margin-top:5px}#result{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef5fc;padding:18px;border-radius:10px;min-height:120px}footer{font-size:13px;color:#52677b}</style></head><body><header><a href="index.html">就活コンパス</a> / <a href="28sotsu-guide-directory.html">28卒ガイド</a><h1>選考振り返り・次回改善アクション</h1><p>結果の良し悪しだけで終わらせず、次に変える行動を1つ決める。</p></header><main><div class="notice">企業からの不合格理由が不明な場合、推測を事実として扱わないでください。入力は端末内だけで処理され、自動保存・外部送信されません。</div><section class="card"><h2>1. 選考の記録</h2><label for="company">企業名（任意）</label><input id="company" maxlength="100" placeholder="例：A社"><label for="stage">選考段階</label><select id="stage"><option>ES・書類</option><option>Webテスト</option><option>一次面接</option><option>二次面接</option><option>最終面接</option><option>グループディスカッション</option><option>その他</option></select><label for="outcome">結果</label><select id="outcome"><option>結果待ち</option><option>通過</option><option>不通過</option><option>辞退</option></select><label for="facts">実際に起きたこと（事実）</label><textarea id="facts" placeholder="例：質問に対して結論を述べるまで40秒かかった。面接官から深掘りが2回あった。"></textarea><label for="positive">うまくできたこと</label><textarea id="positive" placeholder="例：経験を数字で説明できた。"></textarea></section><section class="card"><h2>2. 改善の仮説</h2><label for="hypothesis">改善できそうな点（仮説）</label><textarea id="hypothesis" placeholder="例：結論を先に伝えると、回答がより分かりやすくなるかもしれない。"></textarea><label for="evidence">その仮説の根拠・不明点</label><textarea id="evidence" placeholder="例：回答時間が長かった。ただし不通過の理由は不明。"></textarea></section><section class="card"><h2>3. 次回の具体的な一歩</h2><label for="action">次に実行する行動（具体的に）</label><textarea id="action" placeholder="例：自己紹介と志望動機を各60秒で録音し、結論が最初の10秒に入るまで3回練習する。"></textarea><label for="deadline">実行期限（任意）</label><input id="deadline" type="date"><div class="checks"><label><input type="checkbox" id="check1">事実と推測を区別した</label><label><input type="checkbox" id="check2">改善行動は自分で実行できる</label><label><input type="checkbox" id="check3">次回までに確認する方法がある</label></div><button id="make">振り返りをまとめる</button><button class="secondary" id="clear">入力をクリア</button></section><section class="card"><h2>まとめ（編集・コピー可）</h2><div id="result" role="status" aria-live="polite">「振り返りをまとめる」を押すと、ここに結果が表示されます。</div><button id="copy">コピー</button><button id="save">TXT保存</button><p class="hint" id="status" role="status"></p></section><footer>※入力内容は自動保存されません。必要な場合はTXT保存してください。選考結果から合否理由を断定するものではありません。</footer></main><script>const $=id=>document.getElementById(id);let output='';const fields=['company','stage','outcome','facts','positive','hypothesis','evidence','action','deadline'];function v(id){return $(id).value.trim()||'未入力'}$('make').addEventListener('click',()=>{output=['【28卒 選考振り返り】','企業：'+v('company'),'段階：'+v('stage'),'結果：'+v('outcome'),'','■ 起きた事実',v('facts'),'','■ できたこと',v('positive'),'','■ 改善の仮説（合否理由の断定ではない）',v('hypothesis'),'','■ 根拠・不明点',v('evidence'),'','■ 次回の行動',v('action'),'期限：'+v('deadline'),'','確認：'+[1,2,3].filter(i=>$('check'+i).checked).length+'/3項目'].join('\n');$('result').textContent=output;$('status').textContent='まとめを作成しました。'});$('copy').addEventListener('click',async()=>{if(!output){$('status').textContent='先にまとめを作成してください。';return}try{await navigator.clipboard.writeText(output);$('status').textContent='コピーしました。'}catch(e){$('status').textContent='コピーできませんでした。内容を選択してコピーしてください。'}});$('save').addEventListener('click',()=>{if(!output){$('status').textContent='先にまとめを作成してください。';return}const blob=new Blob(['\ufeff'+output],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='28sotsu-senkou-furikaeri.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='TXTを保存しました。'});$('clear').addEventListener('click',()=>{if(!confirm('入力内容と作成したまとめを削除しますか？'))return;fields.forEach(id=>{if($(id).tagName==='SELECT')$(id).selectedIndex=0;else $(id).value=''});[1,2,3].forEach(i=>$('check'+i).checked=false);output='';$('result').textContent='「振り返りをまとめる」を押すと、ここに結果が表示されます。';$('status').textContent='入力をクリアしました。'});</script></body></html>

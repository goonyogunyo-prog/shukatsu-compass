<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="29卒向けインターン参加準備チェックリスト。企業研究・持ち物・当日の質問・振り返りを一枚で整理。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-internship-preparation-checklist.html"><title>29卒 インターン参加準備チェックリスト｜就活コンパス</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#182c43;background:#f3f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:24px 16px 60px}a{color:#135b9b}header{background:#153b60;color:white;padding:20px}header a{color:white}section{background:white;border:1px solid #dce5ed;border-radius:14px;padding:18px;margin:16px 0}h1{font-size:clamp(1.5rem,4vw,2rem)}h2{font-size:1.2rem}label{display:block;margin:10px 0;line-height:1.6}input[type=text],input[type=date],textarea{width:100%;padding:10px;border:1px solid #9baebe;border-radius:8px;font:inherit}textarea{min-height:90px}input[type=checkbox]{width:19px;height:19px;vertical-align:middle;margin-right:8px}button{background:#145d98;color:white;border:0;padding:12px 16px;border-radius:8px;font:inherit;cursor:pointer;margin:4px}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f0a12d}small{color:#506476}.progress{height:12px;background:#e1eaf1;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:#168768;width:0}#status{font-weight:700}footer{font-size:.9rem}</style></head><body><header><a href="./index.html">就活コンパス トップへ</a></header><main><h1>29卒 インターン参加準備チェックリスト</h1><p>参加前・当日・参加後の行動をまとめて確認。企業ごとの準備漏れを防ぐためのワークシートです。</p><section><h2>参加情報</h2><label>企業名<input id="company" type="text" maxlength="100" placeholder="例：〇〇株式会社"></label><label>参加日<input id="date" type="date"></label><label>参加形式<input id="format" type="text" maxlength="100" placeholder="例：対面・オンライン"></label></section><section><h2>準備の進捗</h2><p id="status" aria-live="polite">0 / 12 完了</p><div class="progress" role="progressbar" aria-label="準備完了率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="bar"></span></div><div id="checks"></div></section><section><h2>当日聞きたい質問</h2><label>社員に聞きたいこと<textarea id="questions" maxlength="3000" placeholder="例：若手が任される仕事と評価基準"></textarea></label><h2>参加後の振り返り</h2><label>印象に残った事実<textarea id="facts" maxlength="3000"></textarea></label><label>自分の感想・次の行動<textarea id="next" maxlength="3000"></textarea></label></section><section><h2>保存・共有</h2><p><small>内容はこのページ内でのみ扱います。自動保存・外部送信はしません。必要ならTXTを保存してください。</small></p><button id="save" type="button">TXTで保存</button><button id="copy" type="button">内容をコピー</button><button id="clear" type="button">全入力を消去</button><p id="notice" role="status" aria-live="polite"></p></section><footer><a href="./index.html">就活コンパスへ戻る</a></footer></main><script>const groups=[['参加前',['企業の事業・主要顧客を調べた','参加目的を自分の言葉で整理した','日時・場所・接続URLを確認した','服装・持ち物・交通手段を確認した','質問を2つ以上用意した']],['当日',['開始10分前に参加できる準備をした','社員の説明と自分の推測を分けてメモした','質問やワークに主体的に参加した']],['参加後',['学んだ仕事内容を整理した','企業への関心が変化した理由を書いた','今後の選考日程・締切を確認した','次に取る行動を決めた']]];const checks=document.getElementById('checks');groups.forEach(([title,items])=>{const h=document.createElement('h3');h.textContent=title;checks.append(h);items.forEach(t=>{const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.dataset.text=t;c.addEventListener('change',update);l.append(c,document.createTextNode(t));checks.append(l)})});const all=[...checks.querySelectorAll('input')];function update(){const n=all.filter(c=>c.checked).length;document.getElementById('status').textContent=n+' / '+all.length+' 完了';document.getElementById('bar').style.width=(n/all.length*100)+'%';document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',Math.round(n/all.length*100))}function report(){let a=['29卒 インターン参加準備チェックリスト','企業名: '+document.getElementById('company').value,'参加日: '+document.getElementById('date').value,'参加形式: '+document.getElementById('format').value,''];groups.forEach(([g,items])=>{a.push('【'+g+'】');items.forEach(t=>{const c=all.find(x=>x.dataset.text===t);a.push((c.checked?'[完了] ':'[未完了] ')+t)})});for(const [id,t] of [['questions','質問'],['facts','事実'],['next','感想・次の行動']])a.push('',t+':',document.getElementById(id).value);return a.join('\n')}document.getElementById('save').onclick=()=>{const blob=new Blob([report()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='29sotsu-internship-checklist.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('notice').textContent='TXTの保存を開始しました'};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(report());document.getElementById('notice').textContent='コピーしました'}catch{document.getElementById('notice').textContent='コピーできませんでした。TXT保存をご利用ください'}};document.getElementById('clear').onclick=()=>{if(!confirm('入力内容をすべて消去しますか？'))return;document.querySelectorAll('input[type=text],input[type=date],textarea').forEach(e=>e.value='');all.forEach(e=>e.checked=false);update();document.getElementById('notice').textContent='消去しました'};update();</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28卒 面接企業比較・振り返りワーク｜就活コンパス</title><meta name="description" content="28卒向け。複数企業の面接を比較し、志望度・仕事内容・働き方・面接の手応えを整理する無料ワーク。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-interview-company-comparison.html"><style>body{font-family:system-ui,sans-serif;background:#f5f7fb;color:#17243a;margin:0}main{max-width:900px;margin:auto;padding:24px 16px}a{color:#1755a4}.panel{background:white;border:1px solid #dce3ef;border-radius:14px;padding:20px;margin:16px 0}h1{font-size:clamp(1.5rem,4vw,2.2rem)}label{display:block;font-weight:650;margin:12px 0 5px}input,textarea,select{box-sizing:border-box;width:100%;font:inherit;padding:10px;border:1px solid #aab9cb;border-radius:8px}textarea{min-height:72px}button{font:inherit;padding:11px 15px;background:#164f96;color:white;border:0;border-radius:9px;cursor:pointer;margin:6px 6px 6px 0}button.secondary{background:#e8eff8;color:#17375f}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}}.small{color:#4c607b;font-size:.92rem}#result{white-space:pre-wrap;overflow-wrap:anywhere}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #efad32;outline-offset:2px}</style></head><body><main><p><a href="./">← 就活コンパスに戻る</a></p><h1>28卒｜面接企業比較・振り返りワーク</h1><p>面接で聞いた事実と自分の印象を分けて記録し、次の選考に向けて整理できます。採用可能性を予測するツールではありません。</p><div class="panel"><label for="company">企業名</label><input id="company" maxlength="100" placeholder="例：株式会社〇〇"><div class="grid"><div><label for="role">応募職種</label><input id="role" maxlength="100"></div><div><label for="date">面接日</label><input id="date" type="date"></div><div><label for="interest">現在の志望度（自分の感覚）</label><select id="interest"><option value="未評価">未評価</option><option value="高い">高い</option><option value="中程度">中程度</option><option value="検討中">検討中</option></select></div><div><label for="confidence">回答の手応え（自己評価）</label><select id="confidence"><option value="未評価">未評価</option><option value="良かった">良かった</option><option value="普通">普通</option><option value="改善したい">改善したい</option></select></div></div><label for="facts">面接で確認できた事実</label><textarea id="facts" maxlength="2000" placeholder="仕事内容・配属・働き方など。出典や確認者も記録"></textarea><label for="impression">自分の印象・感じたこと</label><textarea id="impression" maxlength="2000"></textarea><label for="question">次回確認したいこと</label><textarea id="question" maxlength="2000"></textarea><label for="next">次の行動</label><textarea id="next" maxlength="2000"></textarea><button id="add">比較リストに追加</button><button id="clear" class="secondary">入力欄をクリア</button><p class="small">データはこのページを開いている間だけ保持します。端末への自動保存・外部送信はしません。</p></div><div class="panel"><h2>比較リスト（最大10社）</h2><p id="count" aria-live="polite">0社</p><div id="result" aria-live="polite">企業を追加するとここに表示します。</div><button id="export">TXTを保存</button><button id="json">JSONバックアップ</button><label for="import">JSONバックアップを読み込む</label><input type="file" id="import" accept="application/json,.json"><button id="reset" class="secondary">リストを全削除</button><p class="small">JSONには企業名・面接メモが含まれます。共有先に注意してください。読み込みはこのブラウザ内で処理します。</p></div></main><script>(()=>{'use strict';const $=id=>document.getElementById(id);const fields=['company','role','date','interest','confidence','facts','impression','question','next'];let records=[];const val=id=>$(id).value;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){ $('count').textContent=records.length+'社';$('result').innerHTML=records.length?records.map((r,i)=>'<section style="border-top:1px solid #ddd;padding:12px 0"><strong>'+(i+1)+'. '+esc(r.company)+'</strong>（'+esc(r.interest)+'）<p>'+esc(r.role)+' / '+esc(r.date)+'</p><p>手応え：'+esc(r.confidence)+'</p><p>事実：'+esc(r.facts)+'</p><p>印象：'+esc(r.impression)+'</p><p>確認事項：'+esc(r.question)+'</p><p>次の行動：'+esc(r.next)+'</p><button class="secondary" data-remove="'+i+'">この企業を削除</button></section>').join(''):'企業を追加するとここに表示します。'}$('add').onclick=()=>{if(!val('company').trim()){alert('企業名を入力してください');$('company').focus();return}if(records.length>=10){alert('最大10社です');return}records.push(Object.fromEntries(fields.map(k=>[k,val(k).trim()])));render()};$('clear').onclick=()=>fields.forEach(k=>$(k).value=k==='interest'||k==='confidence'?'未評価':'');$('result').onclick=e=>{const b=e.target.closest('[data-remove]');if(b){records.splice(Number(b.dataset.remove),1);render()}};function download(name,data,type){const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('export').onclick=()=>download('28sotsu-interview-comparison.txt',records.map((r,i)=>[i+1+'. '+r.company,...fields.filter(k=>k!=='company').map(k=>k+': '+r[k])].join('\n')).join('\n\n'),'text/plain;charset=utf-8');$('json').onclick=()=>download('28sotsu-interview-comparison.json',JSON.stringify({version:1,records},null,2),'application/json');$('import').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>200000){alert('ファイルが大きすぎます');return}try{const x=JSON.parse(await f.text());if(x.version!==1||!Array.isArray(x.records)||x.records.length>10||!x.records.every(r=>r&&fields.every(k=>typeof r[k]==='string'&&r[k].length<=2000))){throw Error('形式が一致しません')}if(!confirm('現在の比較リストを読み込みデータで置き換えますか？'))return;records=x.records.map(r=>Object.fromEntries(fields.map(k=>[k,r[k]])));render()}catch(err){alert('読み込めませんでした：'+err.message)}finally{e.target.value=''}};$('reset').onclick=()=>{if(confirm('比較リストをすべて削除しますか？')){records=[];render()}};render()})();</script></body></html>

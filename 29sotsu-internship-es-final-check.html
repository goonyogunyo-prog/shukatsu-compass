<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29卒 インターンES提出前チェックリスト｜就活コンパス</title><meta name="description" content="29卒向けインターンESの提出前確認10項目。設問・文字数・企業名・期限を無料でセルフチェック。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-internship-es-final-check.html"><style>body{margin:0;background:#f5f7fb;color:#17243b;font-family:system-ui,-apple-system,sans-serif;line-height:1.7}main{max-width:760px;margin:auto;padding:24px 16px 80px}a{color:#1754a3}.panel{background:white;border:1px solid #dce3ef;border-radius:16px;padding:22px;margin:18px 0}h1{font-size:clamp(1.5rem,5vw,2.2rem);line-height:1.4}h2{font-size:1.15rem}.check{display:block;padding:13px 8px;border-bottom:1px solid #e8edf4}input[type=checkbox]{width:20px;height:20px;vertical-align:middle;accent-color:#155cbd}textarea{width:100%;box-sizing:border-box;min-height:115px;border:1px solid #a8b5c7;border-radius:8px;padding:12px;font:inherit}button{background:#174f9a;color:white;border:0;border-radius:8px;padding:12px 16px;margin:5px 6px 5px 0;font:inherit;cursor:pointer}button.secondary{background:#e8eef8;color:#193b69}#progress{font-weight:700}.bar{background:#e4eaf3;height:12px;border-radius:12px;overflow:hidden}#fill{height:100%;width:0;background:#2370c9;transition:width .15s}small{color:#53647b}@media(max-width:400px){.panel{padding:15px}button{width:100%;margin:5px 0}}</style></head><body><main><a href="./index.html">← 就活コンパス トップ</a><h1>29卒 インターンES提出前チェックリスト</h1><p>応募直前の見落としを10項目で確認。合否予測や自動添削ではありません。</p><section class="panel"><h2>提出前の10項目</h2><p id="progress" aria-live="polite">0 / 10項目 確認済み</p><div class="bar"><div id="fill"></div></div><label class="check"><input type="checkbox" class="task"> 設問の意図に答えている</label>
<label class="check"><input type="checkbox" class="task"> 指定文字数・形式を確認した</label>
<label class="check"><input type="checkbox" class="task"> 経験・役割・行動が具体的</label>
<label class="check"><input type="checkbox" class="task"> 成果を誇張せず事実で書いた</label>
<label class="check"><input type="checkbox" class="task"> 志望理由が応募先の特徴とつながる</label>
<label class="check"><input type="checkbox" class="task"> 企業名・プログラム名を確認した</label>
<label class="check"><input type="checkbox" class="task"> 誤字脱字・敬語を確認した</label>
<label class="check"><input type="checkbox" class="task"> 募集要項と提出期限を公式情報で確認した</label>
<label class="check"><input type="checkbox" class="task"> 個人情報や機密情報を含まない</label>
<label class="check"><input type="checkbox" class="task"> 提出後の控えを保存する準備ができた</label></section><section class="panel"><h2>最後に確認するメモ</h2><label for="memo">応募先・確認したい点（任意）</label><textarea id="memo" placeholder="例：ES締切の時刻を公式マイページで再確認"></textarea><div><button id="save" type="button">チェック結果をTXT保存</button><button id="copy" type="button" class="secondary">結果をコピー</button><button id="clear" type="button" class="secondary">入力をすべて消す</button></div><p id="status" role="status"></p><small>入力・チェックはこの画面内のみ。自動保存や外部送信はしません。ページを閉じる前に必要に応じてTXT保存してください。企業ごとの募集条件は必ず公式案内を優先してください。</small></section><p><a href="./29sotsu-start-guide-2026.html">29卒スタートガイドへ戻る</a></p></main><script>(()=>{'use strict';const checks=[...document.querySelectorAll('.task')],progress=document.getElementById('progress'),fill=document.getElementById('fill'),memo=document.getElementById('memo'),status=document.getElementById('status');function update(){const n=checks.filter(c=>c.checked).length;progress.textContent=n+' / '+checks.length+'項目 確認済み';fill.style.width=(100*n/checks.length)+'%'}function report(){return '29卒 インターンES提出前チェック\n'+checks.map(c=>(c.checked?'[済] ':'[未] ')+c.parentElement.textContent.trim()).join('\n')+'\n\nメモ\n'+memo.value}checks.forEach(c=>c.addEventListener('change',update));document.getElementById('save').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([report()],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='29sotsu-intern-es-check.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='TXT保存を開始しました'});document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(report());status.textContent='コピーしました'}catch(e){status.textContent='コピーできませんでした。TXT保存をご利用ください'}});document.getElementById('clear').addEventListener('click',()=>{if(!confirm('チェックとメモを消去しますか？'))return;checks.forEach(c=>c.checked=false);memo.value='';update();status.textContent='入力を消去しました'});update()})();</script></body></html>

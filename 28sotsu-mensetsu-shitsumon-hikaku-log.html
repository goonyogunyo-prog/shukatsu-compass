<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28卒 面接回答の改善比較ログ｜就活コンパス</title><meta name="description" content="28卒向け。面接回答の初稿と改善稿を並べて比較し、具体性・結論・企業との接点を確認する無料ワーク。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-mensetsu-shitsumon-hikaku-log.html"><style>:root{font-family:system-ui,sans-serif;color:#17263d;background:#f5f7fb}*{box-sizing:border-box}main{max-width:920px;margin:auto;padding:24px 16px}a{color:#1553b5}.panel{background:white;border:1px solid #d9e1ed;border-radius:16px;padding:20px;margin:16px 0}h1{font-size:clamp(1.5rem,4vw,2.2rem)}label{display:block;font-weight:650;margin:14px 0 6px}textarea,select,input{width:100%;padding:12px;border:1px solid #aebdd0;border-radius:9px;font:inherit}textarea{min-height:170px;resize:vertical}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}button{border:0;border-radius:9px;background:#174ea6;color:white;padding:12px 16px;cursor:pointer;margin:5px 5px 5px 0}button.secondary{background:#53647c}.muted{color:#52647c;font-size:.94rem}#result{white-space:pre-wrap;overflow-wrap:anywhere}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f6a43a}@media(max-width:650px){.cols{grid-template-columns:1fr}.panel{padding:15px}}</style></head><body><main><p><a href="./index.html">← 就活コンパス トップ</a></p><h1>28卒｜面接回答の改善比較ログ</h1><p>同じ質問への回答を改善前・改善後で並べ、変更点を整理します。合否を判定するものではありません。</p><section class="panel"><label for="question">練習する質問</label><select id="question"><option>自己紹介</option><option>学生時代に力を入れたこと</option><option>志望動機</option><option>自己PR</option><option>強みと弱み</option><option>困難を乗り越えた経験</option><option>チームでの役割</option><option>入社後に挑戦したいこと</option></select><div class="cols"><div><label for="before">改善前の回答</label><textarea id="before" placeholder="最初に考えた回答"></textarea><p class="muted" id="countBefore">0文字</p></div><div><label for="after">改善後の回答</label><textarea id="after" placeholder="具体的な行動や成果を加えて書き直す"></textarea><p class="muted" id="countAfter">0文字</p></div></div><label for="reason">改善した点・次に試すこと</label><textarea id="reason" placeholder="例：冒頭で結論を伝え、役割と成果を数字で補った"></textarea><p><label><input type="checkbox" class="check" style="width:auto">結論が最初にある</label><label><input type="checkbox" class="check" style="width:auto">自分の行動が具体的</label><label><input type="checkbox" class="check" style="width:auto">事実にない成果を加えていない</label><label><input type="checkbox" class="check" style="width:auto">質問への回答になっている</label></p><button id="make">比較メモを作成</button><button id="copy" class="secondary">コピー</button><button id="save" class="secondary">TXT保存</button><button id="clear" class="secondary">入力を消去</button><p id="status" role="status" aria-live="polite"></p></section><section class="panel"><h2>比較結果</h2><div id="result">回答を入力し「比較メモを作成」を押してください。</div></section><p class="muted">入力内容はブラウザ内のみで処理し、自動保存・外部送信しません。コピーやTXT保存した内容には個人情報が含まれる場合があります。</p></main><script>"use strict";const $=id=>document.getElementById(id);const ids=['before','after','reason'];const update=()=>{ $('countBefore').textContent=Array.from($('before').value).length+'文字';$('countAfter').textContent=Array.from($('after').value).length+'文字';};ids.forEach(id=>$(id).addEventListener('input',update));function build(){const a=$('before').value.trim(),b=$('after').value.trim();if(!a&&!b){$('status').textContent='回答を入力してください。';return '';}const checked=[...document.querySelectorAll('.check')];const s=['【面接回答 比較ログ】','質問：'+$('question').value,'','改善前（'+Array.from(a).length+'文字）',a||'（未入力）','','改善後（'+Array.from(b).length+'文字）',b||'（未入力）','','改善した点・次の練習',$('reason').value.trim()||'（未入力）','','セルフチェック',...['結論が最初にある','自分の行動が具体的','事実にない成果を加えていない','質問への回答になっている'].map((t,i)=>(checked[i].checked?'[x] ':'[ ] ')+t)].join('\n');$('result').textContent=s;$('status').textContent='比較メモを作成しました。';return s;}$('make').onclick=build;$('copy').onclick=async()=>{const s=build();if(!s)return;try{await navigator.clipboard.writeText(s);$('status').textContent='コピーしました。';}catch(e){$('status').textContent='コピーできませんでした。結果欄から選択してコピーしてください。';}};$('save').onclick=()=>{const s=build();if(!s)return;const url=URL.createObjectURL(new Blob([s],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='28sotsu-mensetsu-hikaku-log.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='TXT保存を開始しました。';};$('clear').onclick=()=>{ids.forEach(id=>$(id).value='');document.querySelectorAll('.check').forEach(x=>x.checked=false);$('result').textContent='回答を入力し「比較メモを作成」を押してください。';$('status').textContent='入力を消去しました。';update();};</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29卒 インターン応募締切から逆算する準備計画｜就活コンパス</title><meta name="description" content="29卒向け無料ツール。応募締切からES作成・添削・Webテスト・最終確認の日付を逆算。端末内で保存しCSVに書き出せます。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-internship-deadline-reverse-planner.html"><style>body{margin:0;background:#f5f7fb;color:#172a40;font:16px/1.65 system-ui,-apple-system,sans-serif}header,main,footer{max-width:820px;margin:auto;padding:22px}h1{font-size:clamp(1.5rem,4vw,2.2rem)}a{color:#145ca7}.panel{background:#fff;border:1px solid #dce4ed;border-radius:14px;padding:20px;margin:18px 0}label{display:block;font-weight:650;margin:12px 0 5px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #879bb2;border-radius:8px;font:inherit}button{border:0;border-radius:9px;padding:11px 16px;background:#155eaa;color:#fff;font:inherit;cursor:pointer;margin:10px 8px 0 0}button.secondary{background:#475569}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px 7px;border-bottom:1px solid #dce4ed}th{width:42%}.note{color:#4c5e73;font-size:.9rem}#status{min-height:1.5em} @media(max-width:500px){header,main,footer{padding:14px}.panel{padding:14px}td,th{display:block;width:auto;padding:5px}}</style></head><body><header><nav><a href="index.html">ホーム</a> / <a href="shukatsu-new-tools-directory.html">ツール一覧</a></nav><h1>29卒 インターン応募締切から逆算する準備計画</h1><p>締切の直前に慌てないよう、準備を5段階に分けて逆算します。</p></header><main><section class="panel"><label for="company">企業・プログラム名</label><input id="company" maxlength="100" placeholder="例：○○株式会社 夏インターン"><label for="deadline">応募締切日</label><input id="deadline" type="date"><label for="time">締切時刻（企業指定の現地時刻）</label><input id="time" type="time" value="23:59"><label for="buffer">提出前に確保する予備日数</label><input id="buffer" type="number" min="1" max="14" value="2"><button id="calculate">計画を作る</button><button id="save" class="secondary">端末に保存</button><button id="csv" class="secondary">CSV書き出し</button><button id="clear" class="secondary">保存データを削除</button><p id="status" role="status" aria-live="polite"></p></section><section class="panel" id="result" hidden><h2>逆算スケジュール</h2><p id="summary"></p><table><tbody id="tasks"></tbody></table><p class="note">これは目安です。Webテストや適性検査が別締切の場合は企業のマイページ・募集要項を優先してください。時刻は利用者が入力した現地時刻で、タイムゾーン変換は行いません。</p></section></main><footer><a href="shukatsu-new-tools-directory.html">ツール一覧に戻る</a></footer><script>(()=>{'use strict';const $=id=>document.getElementById(id),key='sc29_deadline_reverse_v1';let rows=[];const pad=n=>String(n).padStart(2,'0');function parse(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);if(!m)return null;const d=new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));return d.toISOString().slice(0,10)===s?d:null}function date(d,offset){const t=new Date(d.getTime());t.setUTCDate(t.getUTCDate()+offset);return t.getUTCFullYear()+'-'+pad(t.getUTCMonth()+1)+'-'+pad(t.getUTCDate())}function calc(){const d=parse($('deadline').value),buffer=Number($('buffer').value);if(!d||!Number.isInteger(buffer)||buffer<1||buffer>14){$('status').textContent='締切日と予備日数（1〜14）を確認してください。';return}const steps=[['募集要項・応募条件を確認',-buffer-10],['ESの構成・エピソードを整理',-buffer-7],['ES初稿・Webテスト準備',-buffer-5],['推敲・第三者チェック',-buffer-3],['提出・受付メール確認',-buffer]];rows=steps.map(([task,offset])=>({day:date(d,offset),task}));$('tasks').replaceChildren();for(const r of rows){const tr=document.createElement('tr'),th=document.createElement('th'),td=document.createElement('td');th.textContent=r.day;td.textContent=r.task;tr.append(th,td);$('tasks').append(tr)}$('summary').textContent=($('company').value.trim()||'応募予定')+'｜締切 '+$('deadline').value+' '+$('time').value+'／提出目標 '+rows[4].day;$('result').hidden=false;$('status').textContent='計画を作成しました。';}function snapshot(){return {company:$('company').value,deadline:$('deadline').value,time:$('time').value,buffer:$('buffer').value}}$('calculate').addEventListener('click',calc);$('save').addEventListener('click',()=>{if(!rows.length)calc();if(!rows.length)return;try{localStorage.setItem(key,JSON.stringify(snapshot()));$('status').textContent='この端末に保存しました。'}catch(e){$('status').textContent='保存できませんでした。ブラウザの設定を確認してください。'}});$('csv').addEventListener('click',()=>{if(!rows.length)calc();if(!rows.length)return;const esc=s=>'"'+String(s).replace(/"/g,'""')+'"';const csv='\ufeff日付,作業\r\n'+rows.map(r=>esc(r.day)+','+esc(r.task)).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='29sotsu-internship-plan.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='CSVを作成しました。'});$('clear').addEventListener('click',()=>{if(!confirm('このツールの保存データを削除しますか？'))return;try{localStorage.removeItem(key)}catch(e){};rows=[];$('result').hidden=true;for(const id of ['company','deadline'])$(id).value='';$('time').value='23:59';$('buffer').value='2';$('status').textContent='削除しました。'});try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&typeof saved==='object'){for(const id of ['company','deadline','time','buffer'])if(typeof saved[id]==='string')$(id).value=saved[id];calc()}}catch(e){}})();</script></body></html>

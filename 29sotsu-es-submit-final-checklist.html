<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29卒 ES提出前チェックリスト15項目｜就活コンパス</title><meta name="description" content="29卒向けのES提出前チェック15項目。締切・文字数・誤字・提出完了まで確認。メモをTXT保存できる無料ツール。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-es-submit-final-checklist.html"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#18263d;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:26px 16px 60px}a{color:#1658ad}h1{line-height:1.35;font-size:clamp(1.6rem,5vw,2.4rem)}.card{background:white;border:1px solid #dbe3ef;border-radius:16px;padding:20px;margin:18px 0}.item{display:flex;align-items:flex-start;gap:12px;padding:12px 2px;border-bottom:1px solid #edf0f5;line-height:1.6}.item input{width:20px;height:20px;flex:none;accent-color:#1565c0;margin-top:3px}input[type=text],input[type=date],textarea{display:block;width:100%;padding:12px;border:1px solid #aab9cc;border-radius:9px;font:inherit;margin:8px 0 16px}textarea{min-height:110px}button{border:0;border-radius:9px;background:#1459ac;color:white;padding:12px 18px;font:inherit;cursor:pointer;margin:5px 8px 5px 0}button.secondary{background:#e8edf5;color:#20334f}progress{width:100%;height:16px;accent-color:#1665bf}.muted{color:#52647b;font-size:.94rem}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f7a823;outline-offset:2px}</style></head><body><main><p><a href="./index.html">就活コンパス トップ</a></p><h1>29卒 ES提出前チェックリスト</h1><p>提出直前に確認したい15項目。送信ボタンを押しただけでは提出完了とは限りません。必ず受付状況まで確認しましょう。</p><section class="card"><label>企業名<input id="company" type="text" maxlength="120" placeholder="例：応募企業A"></label><label>締切日（時刻はメモへ）<input id="deadline" type="date"></label><label>締切時刻・応募コース・備考<textarea id="notes" maxlength="3000" placeholder="公式募集要項とマイページで確認した内容を記入"></textarea></label></section><section class="card"><h2>提出前・提出後の15項目</h2><p id="counter" aria-live="polite">0 / 15 項目確認済み</p><progress id="progress" max="15" value="0"></progress><label class="item"><input type="checkbox" class="check"><span>卒年・募集コース・応募資格を公式ページで確認した</span></label><label class="item"><input type="checkbox" class="check"><span>締切の年月日と時刻・タイムゾーンを確認した</span></label><label class="item"><input type="checkbox" class="check"><span>設問の指定文字数・改行条件を確認した</span></label><label class="item"><input type="checkbox" class="check"><span>企業名・事業名・職種名に誤記がない</span></label><label class="item"><input type="checkbox" class="check"><span>他社の社名・別企業向け文章が残っていない</span></label><label class="item"><input type="checkbox" class="check"><span>結論が設問に直接答えている</span></label><label class="item"><input type="checkbox" class="check"><span>経験の事実・数字を誇張していない</span></label><label class="item"><input type="checkbox" class="check"><span>自分の行動と結果が区別できる</span></label><label class="item"><input type="checkbox" class="check"><span>志望理由がその企業・職種に結びついている</span></label><label class="item"><input type="checkbox" class="check"><span>同じ表現の重複・誤字脱字を確認した</span></label><label class="item"><input type="checkbox" class="check"><span>フォームへ貼り付けた後の文字数を確認した</span></label><label class="item"><input type="checkbox" class="check"><span>添付ファイル形式・容量・ファイル名を確認した</span></label><label class="item"><input type="checkbox" class="check"><span>プレビューで段落・文字化けを確認した</span></label><label class="item"><input type="checkbox" class="check"><span>確認画面から送信完了まで操作した</span></label><label class="item"><input type="checkbox" class="check"><span>受付メールまたはマイページの提出済み表示を確認した</span></label></section><section class="card"><button id="save">TXTで保存</button><button id="print" class="secondary">印刷・PDF保存</button><button id="reset" class="secondary">入力を消去</button><p class="muted">入力内容はこのページから外部送信されず、自動保存もしません。再読み込みすると消えます。企業ごとの応募締切・提出方式は公式採用ページで再確認してください。</p></section></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),checks=[...document.querySelectorAll('.check')];function refresh(){const n=checks.filter(c=>c.checked).length;$('counter').textContent=n+' / '+checks.length+' 項目確認済み';$('progress').value=n}checks.forEach(c=>c.addEventListener('change',refresh));$('save').addEventListener('click',()=>{const lines=['29卒 ES提出前チェック','企業名: '+$('company').value,'締切日: '+$('deadline').value,'メモ: '+$('notes').value,'',...checks.map((c,i)=>(c.checked?'[x] ':'[ ] ')+(i+1)+'. '+c.nextElementSibling.textContent)];const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='29sotsu-es-checklist.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)});$('print').addEventListener('click',()=>window.print());$('reset').addEventListener('click',()=>{if(!confirm('すべての入力とチェックを消去しますか？'))return;checks.forEach(c=>c.checked=false);$('company').value='';$('deadline').value='';$('notes').value='';refresh()});refresh()})();</script></body></html>

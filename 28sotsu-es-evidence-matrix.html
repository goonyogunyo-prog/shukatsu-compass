<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28卒 ES根拠・数字整理シート | 就活コンパス</title><meta name="description" content="28卒向け。ESの主張と具体的な根拠・数字・自分の行動を対応づけて整理できる無料ワークシート。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-es-evidence-matrix.html"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#18263b;background:#f5f8fc}*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:22px 16px 65px}h1{font-size:clamp(1.5rem,5vw,2.1rem)}p{line-height:1.7}.panel{background:white;border:1px solid #dce5ef;border-radius:14px;padding:18px;margin:18px 0}label{display:block;font-weight:650;margin:14px 0 6px}textarea,input,select{width:100%;font:inherit;border:1px solid #aab9cc;border-radius:8px;padding:10px;background:#fff}textarea{min-height:80px;resize:vertical}button{font:inherit;border:0;border-radius:8px;background:#1756aa;color:#fff;padding:11px 16px;margin:8px 7px 4px 0;cursor:pointer}button.secondary{background:#526579}.note{font-size:.92rem;color:#50647e}#result{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf4fc;padding:14px;border-radius:10px;min-height:80px}a{color:#1756aa}</style></head><body><main><p><a href="./index.html">← 就活コンパス</a></p><h1>28卒 ES根拠・数字整理シート</h1><p>「強みがある」と書くだけでなく、行動・工夫・成果の根拠を一つずつ対応させるためのシートです。数字がない場合は無理に作らず、観察できた変化を記載しましょう。</p><section class="panel"><label for="theme">ESのテーマ</label><select id="theme"><option>ガクチカ</option><option>自己PR</option><option>志望動機</option><option>困難を乗り越えた経験</option></select><label for="claim">最も伝えたい主張</label><textarea id="claim" placeholder="例：関係者を巻き込み課題を解決した"></textarea><label for="situation">背景・課題（事実）</label><textarea id="situation" placeholder="いつ、どんな課題があったか"></textarea><label for="action">自分が実際に行った行動</label><textarea id="action" placeholder="自分の役割と具体的な工夫"></textarea><label for="evidence">根拠となる数字・第三者の反応</label><textarea id="evidence" placeholder="比較できる数字、反応、記録など。未確認ならその旨を記載"></textarea><label for="learning">学び・次に活かせること</label><textarea id="learning"></textarea><label for="uncertain">まだ確認が必要な情報</label><textarea id="uncertain" placeholder="数字の出典や役割の範囲など"></textarea><button id="make">整理結果を作成</button><button class="secondary" id="copy">コピー</button><button class="secondary" id="save">TXT保存</button><button class="secondary" id="clear">入力を消去</button><p class="note">入力内容はこの画面内でのみ扱い、自動保存・外部送信しません。</p></section><section class="panel"><h2>整理結果</h2><div id="result" aria-live="polite">入力後に「整理結果を作成」を押してください。</div></section></main><script>const ids=['theme','claim','situation','action','evidence','learning','uncertain'];const $=id=>document.getElementById(id);function report(){const names=['テーマ','主張','背景・課題','自分の行動','成果の根拠','学び','要確認事項'];return ids.map((id,i)=>names[i]+'：'+($(id).value.trim()||'未入力')).join('\n\n')}function update(){$('result').textContent=report()}$('make').addEventListener('click',update);$('copy').addEventListener('click',async()=>{update();try{await navigator.clipboard.writeText($('result').textContent);alert('コピーしました')}catch(e){alert('コピーできませんでした。結果を選択してコピーしてください')}});$('save').addEventListener('click',()=>{update();const blob=new Blob([$('result').textContent],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='es-evidence-matrix.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});$('clear').addEventListener('click',()=>{if(!confirm('入力をすべて消去しますか？'))return;ids.slice(1).forEach(id=>$(id).value='');$('theme').selectedIndex=0;$('result').textContent='入力を消去しました。'});</script></body></html>

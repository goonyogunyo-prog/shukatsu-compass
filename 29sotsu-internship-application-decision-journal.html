<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29卒 インターン応募判断メモ｜就活コンパス</title><meta name="description" content="29卒向け。インターン応募の判断理由、確認した募集条件、次の行動を1社ずつ整理。ブラウザ内で動作しJSON保存と復元に対応。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-internship-application-decision-journal.html"><style>body{font-family:system-ui,'Noto Sans JP',sans-serif;background:#f4f7fb;color:#18263a;margin:0;line-height:1.65}header,main,footer{max-width:780px;margin:auto;padding:20px}h1{font-size:clamp(1.5rem,4vw,2.2rem)}.panel{background:#fff;border:1px solid #d8e1ec;border-radius:14px;padding:20px;margin:16px 0}label{display:block;font-weight:700;margin:12px 0 5px}input,select,textarea{box-sizing:border-box;width:100%;font:inherit;padding:11px;border:1px solid #9aabc1;border-radius:8px}textarea{min-height:85px}button{font:inherit;border:0;border-radius:8px;padding:10px 14px;background:#1355a3;color:white;cursor:pointer;margin:5px 5px 5px 0}button.secondary{background:#e7edf5;color:#1c3858}button:focus-visible,a:focus-visible{outline:3px solid #e0a53b}small{color:#4b5e77}#status{font-weight:700}a{color:#14549c}@media(max-width:420px){.panel{padding:14px}header,main,footer{padding:14px}}</style></head><body><header><a href="index.html">就活コンパス</a> / <a href="shukatsu-new-tools-directory.html">無料ツール一覧</a><h1>29卒 インターン応募判断メモ</h1><p>応募する・見送る理由を事実と自分の考えに分けて整理。迷ったときに見直せる1社分のワークです。</p></header><main><section class="panel"><label for="company">企業名</label><input id="company" maxlength="120" placeholder="例：〇〇株式会社"><label for="decision">現時点の判断</label><select id="decision"><option>検討中</option><option>応募する</option><option>今回は見送る</option></select><label for="facts">公式募集要項で確認した事実</label><textarea id="facts" maxlength="3000" placeholder="募集対象、締切、開催形式、参加条件など。未確認事項は未確認と記入"></textarea><label for="source">公式情報のURL・確認日</label><textarea id="source" maxlength="1000" placeholder="URLと確認日"></textarea><label for="reasons">自分が応募したい／見送る理由</label><textarea id="reasons" maxlength="3000" placeholder="興味・学び・日程・準備負荷など"></textarea><label for="unknown">まだ確認できていないこと</label><textarea id="unknown" maxlength="2000"></textarea><label for="next">次の行動と期限</label><textarea id="next" maxlength="1000"></textarea><p><button id="save">JSONで保存</button><button id="copy" class="secondary">文章をコピー</button><button id="clear" class="secondary">入力を消去</button></p><label for="restore">保存したJSONを復元</label><input id="restore" type="file" accept="application/json,.json"><p id="status" role="status" aria-live="polite"></p><small>入力は自動保存・送信しません。JSONファイルには入力内容がそのまま含まれます。共有端末や第三者への送付に注意してください。応募締切や条件は必ず企業公式サイトで再確認してください。</small></section></main><footer><a href="29sotsu-start-guide-2026.html">29卒ガイドに戻る</a></footer><script>const ids=['company','decision','facts','source','reasons','unknown','next'];const el=id=>document.getElementById(id);const status=s=>el('status').textContent=s;function values(){return Object.fromEntries(ids.map(id=>[id,el(id).value]))}function summary(){const v=values();return '29卒 インターン応募判断メモ\n'+ids.map(id=>({company:'企業名',decision:'判断',facts:'公式情報で確認した事実',source:'情報源と確認日',reasons:'判断理由',unknown:'未確認事項',next:'次の行動と期限'}[id])+': '+v[id]).join('\n')}function download(s,name){const url=URL.createObjectURL(new Blob([s],{type:'application/json;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}el('save').onclick=()=>{download(JSON.stringify({version:1,values:values()},null,2),'29sotsu-internship-decision.json');status('JSONファイルを作成しました')};el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(summary());status('コピーしました')}catch{status('コピーできません。ブラウザの権限をご確認ください')}};el('clear').onclick=()=>{if(!confirm('入力をすべて消去しますか？'))return;for(const id of ids)el(id).value=id==='decision'?'検討中':'';status('入力を消去しました')};el('restore').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(file.size>50000){status('ファイルが大きすぎます');return}try{const obj=JSON.parse(await file.text());if(obj.version!==1||!obj.values||typeof obj.values!=='object')throw Error();for(const id of ids){if(typeof obj.values[id]!=='string'||obj.values[id].length>4000)throw Error()}if(!['検討中','応募する','今回は見送る'].includes(obj.values.decision))throw Error();if(!confirm('現在の入力を保存ファイルで置き換えますか？'))return;for(const id of ids)el(id).value=obj.values[id];status('復元しました')}catch{status('対応していないJSON形式です')}finally{e.target.value=''}};</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28卒 面接回答の構成練習 | 就活コンパス</title><meta name="description" content="28卒向けの面接回答練習。結論・根拠・経験・入社後の活用を整理し、回答をTXTで保存できます。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-interview-question-bank.html"><style>body{font-family:system-ui,sans-serif;line-height:1.7;margin:0;background:#f5f7fb;color:#17253a}main{max-width:800px;margin:auto;padding:24px 16px}h1{line-height:1.3}section{background:white;padding:20px;border-radius:16px;margin:16px 0;box-shadow:0 2px 10px #17253a12}label{display:block;font-weight:700;margin-top:14px}textarea,input,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #abb8cb;border-radius:8px;font:inherit}textarea{min-height:95px}button{background:#174f8a;color:white;border:0;border-radius:9px;padding:12px 16px;font:inherit;cursor:pointer;margin:6px 6px 0 0}button:focus-visible,a:focus-visible{outline:3px solid #e89c32}#result{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef4fb;padding:16px;border-radius:9px}small{color:#53627b}a{color:#15569d}@media(max-width:420px){main{padding:12px}section{padding:15px}}</style></head><body><main><p><a href="./">← 就活コンパスへ</a></p><h1>28卒 面接回答の構成練習</h1><p>回答を「結論→理由→具体例→入社後の活用」の順で整理。練習用の一般的な質問例です。</p><section><label for="company">企業名（任意）</label><input id="company" maxlength="100" placeholder="例：〇〇株式会社"><label for="question">練習する質問</label><select id="question"><option value="0">なぜこの業界を志望するのですか</option><option value="1">なぜ同業他社ではなく当社ですか</option><option value="2">入社後に挑戦したい仕事は何ですか</option><option value="3">学生時代に最も力を入れたことは何ですか</option><option value="4">困難をどのように乗り越えましたか</option><option value="5">周囲と意見が対立した経験はありますか</option><option value="6">失敗から何を学びましたか</option><option value="7">あなたの強みはどの仕事で活かせますか</option><option value="8">あなたの弱みと改善策を教えてください</option><option value="9">他社の選考状況を教えてください</option><option value="10">仕事選びで譲れない軸は何ですか</option><option value="11">最後に質問はありますか</option></select><label for="conclusion">結論</label><textarea id="conclusion" placeholder="最初に一文で回答"></textarea><label for="reason">理由</label><textarea id="reason" placeholder="なぜそう考えるのか"></textarea><label for="example">具体例</label><textarea id="example" placeholder="経験・行動・結果"></textarea><label for="future">入社後の活用・学び</label><textarea id="future" placeholder="仕事への接続、または学び"></textarea><button id="compose" type="button">回答を組み立てる</button><button id="save" type="button">TXT保存</button><button id="clear" type="button">入力を消去</button></section><section><h2>回答プレビュー</h2><div id="result" role="status" aria-live="polite">入力後に「回答を組み立てる」を押してください。</div><p><small>内容はこのページから送信されません。自動保存もしません。実際の選考では自分の経験に合わせて調整してください。</small></p></section></main><script>const questions=["なぜこの業界を志望するのですか", "なぜ同業他社ではなく当社ですか", "入社後に挑戦したい仕事は何ですか", "学生時代に最も力を入れたことは何ですか", "困難をどのように乗り越えましたか", "周囲と意見が対立した経験はありますか", "失敗から何を学びましたか", "あなたの強みはどの仕事で活かせますか", "あなたの弱みと改善策を教えてください", "他社の選考状況を教えてください", "仕事選びで譲れない軸は何ですか", "最後に質問はありますか"];const ids=['conclusion','reason','example','future'];function val(id){return document.getElementById(id).value.trim()}function build(){const parts=[`企業：${val('company')||'未入力'}`,`質問：${questions[Number(val('question'))]}`,...ids.map((id,i)=>['結論','理由','具体例','入社後の活用・学び'][i]+'：'+(val(id)||'（未入力）'))];return parts.join('\n\n')}document.getElementById('compose').addEventListener('click',()=>{document.getElementById('result').textContent=build()});document.getElementById('save').addEventListener('click',()=>{const blob=new Blob([build()],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');const u=URL.createObjectURL(blob);a.href=u;a.download='面接回答練習.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});document.getElementById('clear').addEventListener('click',()=>{if(!confirm('入力内容を消去しますか？'))return;['company',...ids].forEach(id=>document.getElementById(id).value='');document.getElementById('question').selectedIndex=0;document.getElementById('result').textContent='入力を消去しました。'});</script></body></html>

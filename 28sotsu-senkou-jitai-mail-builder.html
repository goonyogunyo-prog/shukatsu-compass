<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28卒 選考辞退メール作成・送信前チェック｜就活コンパス</title><meta name="description" content="28卒向け。選考辞退の連絡メールを状況別に作成。宛先・件名・日時の確認チェック付き。入力内容は送信されません。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-senkou-jitai-mail-builder.html"><style>:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#172b43;background:#f3f7fb}*{box-sizing:border-box}body{margin:0}header{background:#143454;color:white;padding:20px max(18px,calc((100% - 850px)/2))}header a{color:white}main{max-width:850px;margin:25px auto;padding:0 16px 60px}section{background:white;border:1px solid #d7e2ee;border-radius:14px;padding:22px;margin:18px 0}h1{font-size:clamp(24px,4vw,34px)}h2{font-size:21px}label{display:block;font-weight:650;margin:16px 0 6px}input,select,textarea{font:inherit;width:100%;border:1px solid #9daec0;border-radius:8px;padding:12px;background:white;color:#142b43}textarea{min-height:115px;resize:vertical}button{font:inherit;background:#135da1;color:white;border:0;border-radius:9px;padding:12px 17px;cursor:pointer;margin:5px 5px 5px 0}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #f4b63e;outline-offset:2px}.secondary{background:#4d647a}.note{color:#50637a;line-height:1.7}.checks label{font-weight:400;display:flex;align-items:flex-start;gap:10px}.checks input{width:auto;margin-top:5px}#result{white-space:pre-wrap;line-height:1.8;border:1px solid #bdcfdf;border-radius:8px;padding:15px;background:#f9fbfd;min-height:150px;overflow-wrap:anywhere}#status{font-weight:bold;color:#125d38}@media(max-width:480px){section{padding:16px}button{width:100%;margin:5px 0}}</style></head><body><header><a href="index.html">就活コンパス TOP</a> / 28卒</header><main><h1>選考辞退メール作成・送信前チェック</h1><p class="note">選考を辞退するときの連絡文面を下書きできます。企業ごとの案内や締切を優先し、無断欠席を避けましょう。辞退理由を詳しく書く必要はありません。</p><section><h2>1. 連絡内容を入力</h2><label for="kind">辞退する段階</label><select id="kind"><option value="interview">面接・選考の辞退</option><option value="before">応募後・日程確定前の辞退</option><option value="offer">内定の辞退</option></select><label for="company">企業名（任意）</label><input id="company" maxlength="100" placeholder="例：株式会社〇〇"><label for="person">担当者名（任意）</label><input id="person" maxlength="80" placeholder="例：採用ご担当者"><label for="student">自分の氏名（任意）</label><input id="student" maxlength="80" placeholder="例：山田 太郎"><label for="date">予定日時（面接の場合のみ・任意）</label><input id="date" maxlength="100" placeholder="例：11月10日 14時"><button id="make">文面を作成</button><button id="clear" class="secondary">入力を消去</button></section><section><h2>2. 下書き</h2><label for="subject">件名（編集可能）</label><input id="subject"><label for="draft">本文（編集可能）</label><textarea id="draft" rows="13"></textarea><button id="copy">件名・本文をコピー</button><button id="save" class="secondary">TXT保存</button><p id="status" aria-live="polite"></p><p class="note">送信機能はありません。メールアプリに貼り付け、宛先を確認してからご自身で送信してください。入力内容は自動保存・外部送信されません。</p></section><section class="checks"><h2>3. 送信前の確認</h2><label><input type="checkbox">採用窓口の正式な宛先を確認した</label><label><input type="checkbox">企業名・担当者名・自分の氏名を確認した</label><label><input type="checkbox">選考日時や内定承諾期限を確認した</label><label><input type="checkbox">必要な場合、電話連絡や指定フォームでの手続きを確認した</label><label><input type="checkbox">誤字・件名・送信タイミングを確認した</label><p id="progress" class="note">0 / 5 項目確認済み</p></section><p><a href="28sotsu-guide-directory.html">28卒ガイドに戻る</a></p></main><script>const $=id=>document.getElementById(id);const clean=s=>s.trim();function build(){const company=clean($('company').value)||'株式会社〇〇',person=clean($('person').value)||'採用ご担当者',student=clean($('student').value)||'氏名',date=clean($('date').value),kind=$('kind').value;const salutation=company+'\n'+person+' 様\n\n';let reason='',subject='';if(kind==='offer'){subject='内定辞退のご連絡（'+student+'）';reason='このたびは内定のご連絡をいただき、誠にありがとうございました。\n慎重に検討した結果、誠に勝手ながら内定を辞退させていただきたく、ご連絡いたしました。';}else if(kind==='before'){subject='選考辞退のご連絡（'+student+'）';reason='このたびは選考の機会をいただき、誠にありがとうございます。\n大変恐縮ですが、諸般の事情により、今後の選考を辞退させていただきたくご連絡いたしました。';}else{subject='選考辞退のご連絡（'+student+'）';reason=(date?date+'に予定いただいている選考につきまして、\n':'このたびご案内いただいた選考につきまして、\n')+'誠に恐縮ですが、諸般の事情により辞退させていただきたくご連絡いたしました。';}$('subject').value=subject;$('draft').value=salutation+'お世話になっております。'+student+'です。\n\n'+reason+'\n\nお忙しい中、貴重なお時間をいただいたにもかかわらず、このようなご連絡となり申し訳ございません。\nこれまでのご対応に心より感謝申し上げます。\n何卒よろしくお願いいたします。\n\n'+student;$('status').textContent='下書きを作成しました。送信前に必ず内容を確認してください。';}function all(){return '件名：'+$('subject').value+'\n\n'+$('draft').value}function save(){const blob=new Blob([all()],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='senkou-jitai-mail.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);$('status').textContent='TXTファイルを保存しました。'}$('make').addEventListener('click',build);$('save').addEventListener('click',save);$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(all());$('status').textContent='コピーしました。'}catch(e){$('status').textContent='コピーできませんでした。本文を選択してコピーしてください。';}});$('clear').addEventListener('click',()=>{for(const id of ['company','person','student','date','subject','draft'])$(id).value='';$('kind').value='interview';$('status').textContent='入力を消去しました。';});document.querySelectorAll('.checks input').forEach(c=>c.addEventListener('change',()=>{$('progress').textContent=document.querySelectorAll('.checks input:checked').length+' / 5 項目確認済み';}));build();</script></body></html>

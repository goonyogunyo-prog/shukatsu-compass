<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29卒 インターン選考の学び・次回改善ログ｜就活コンパス</title><meta name="description" content="29卒向け。インターン応募・選考の事実、フィードバック、仮説、改善行動を分けて記録。端末保存・TXT出力に対応。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-internship-selection-learning-log.html"><style>body{margin:0;background:#f4f7fc;color:#18263d;font:16px/1.7 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:24px 16px 64px}.panel{background:white;padding:clamp(16px,4vw,30px);border-radius:16px;box-shadow:0 6px 24px #20305012}h1{font-size:clamp(1.5rem,5vw,2.1rem);line-height:1.4}label{display:block;font-weight:700;margin:18px 0 6px}textarea,input{box-sizing:border-box;width:100%;font:inherit;padding:10px;border:1px solid #8b9aaf;border-radius:8px}textarea{resize:vertical}button{background:#1556a1;color:#fff;border:0;border-radius:8px;padding:12px 15px;font-weight:700;margin:10px 7px 0 0;cursor:pointer}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #f3b22b}.note{background:#eaf2ff;border-radius:10px;padding:14px}#status{min-height:1.6em}a{color:#1556a1}@media(max-width:420px){button{width:100%;margin:8px 0 0}}</style></head><body><main><p><a href="29sotsu-start-guide-2026.html">← 29卒スタートガイド</a></p><h1>29卒 インターン選考の学び・次回改善ログ</h1><p class="note">合否の理由は企業が公表していない限り断定できません。<strong>確認できた事実・企業の発言・自分の仮説</strong>を分け、次の応募に活かしましょう。記録はこの端末にのみ保存されます。</p><section class="panel"><form id="form"><label for="company">企業名・プログラム名</label><textarea id="company" rows="3" placeholder="企業名・プログラム名"></textarea>
<label for="stage">応募・選考の段階</label><textarea id="stage" rows="3" placeholder="応募・選考の段階"></textarea>
<label for="facts">確認できた事実（設問・案内・結果など）</label><textarea id="facts" rows="3" placeholder="確認できた事実（設問・案内・結果など）"></textarea>
<label for="effort">自分が準備・実行したこと</label><textarea id="effort" rows="3" placeholder="自分が準備・実行したこと"></textarea>
<label for="feedback">企業から直接得たフィードバック（なければ「なし」）</label><textarea id="feedback" rows="3" placeholder="企業から直接得たフィードバック（なければ「なし」）"></textarea>
<label for="hypothesis">自分の仮説（事実と区別）</label><textarea id="hypothesis" rows="3" placeholder="自分の仮説（事実と区別）"></textarea>
<label for="next">次回試す具体的な改善行動</label><textarea id="next" rows="3" placeholder="次回試す具体的な改善行動"></textarea>
<label for="deadline">改善の実行予定日</label><input id="deadline" type="date">
<label for="verification">改善できたか判断する方法</label><textarea id="verification" rows="3" placeholder="改善できたか判断する方法"></textarea></form><button type="button" id="save">記録を保存</button><button type="button" id="export">TXTを書き出す</button><button type="button" id="clear">入力と保存を削除</button><p id="status" role="status" aria-live="polite"></p></section><p><a href="29sotsu-tools-directory.html">29卒ツール一覧</a>｜<a href="index.html">トップへ戻る</a></p></main><script>"use strict";const ids=["company", "stage", "facts", "effort", "feedback", "hypothesis", "next", "deadline", "verification"],labels=["企業名・プログラム名", "応募・選考の段階", "確認できた事実（設問・案内・結果など）", "自分が準備・実行したこと", "企業から直接得たフィードバック（なければ「なし」）", "自分の仮説（事実と区別）", "次回試す具体的な改善行動", "改善の実行予定日", "改善できたか判断する方法"],key="sc29_intern_selection_learning_v1";const el=id=>document.getElementById(id),status=t=>el("status").textContent=t;function values(){return Object.fromEntries(ids.map(id=>[id,el(id).value]));}try{const old=JSON.parse(localStorage.getItem(key)||"null");if(old&&typeof old==="object")ids.forEach(id=>{if(typeof old[id]==="string")el(id).value=old[id];});}catch(e){status("保存済みデータを読み込めませんでした。ブラウザの保存設定をご確認ください。");}el("save").onclick=()=>{try{localStorage.setItem(key,JSON.stringify(values()));status("この端末に保存しました。");}catch(e){status("保存できませんでした。ブラウザの空き容量・設定をご確認ください。");}};el("export").onclick=()=>{const v=values(),body=ids.map((id,i)=>labels[i]+"\n"+(v[id]||"（未入力）")).join("\n\n");const blob=new Blob(["29卒 インターン選考の学び・次回改善ログ\n\n"+body],{type:"text/plain;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="29sotsu-internship-learning-log.txt";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);status("TXTの書き出しを開始しました。");};el("clear").onclick=()=>{if(!confirm("入力内容とこの端末の保存データを削除しますか？"))return;try{localStorage.removeItem(key);}catch(e){status("保存データの削除に失敗しました。");return;}el("form").reset();status("入力と保存データを削除しました。");};</script></body></html>

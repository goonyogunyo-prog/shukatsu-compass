<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29卒 OB・OG訪問 質問準備シート12選 | 就活コンパス</title><meta name="description" content="29卒向けOB・OG訪問の質問12選。訪問相手、目的、質問選択、当日のメモ、次の行動を整理しTXT保存できる無料ツール。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-obog-visit-question-planner.html"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#17263c;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:24px 16px 64px}header{background:#153c69;color:white;padding:16px}header a{color:white}h1{font-size:clamp(1.55rem,4vw,2.2rem);line-height:1.4}.card{background:white;border:1px solid #dbe4ef;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 3px 14px #17263c0a}label.field{display:block;font-weight:650;margin:12px 0}input[type=text],input[type=date],textarea{display:block;width:100%;margin-top:6px;padding:11px;border:1px solid #9daec4;border-radius:8px;font:inherit}textarea{min-height:95px;resize:vertical}.q{display:flex;align-items:flex-start;gap:12px;padding:12px 6px;border-bottom:1px solid #e8edf4;cursor:pointer}.q input{margin-top:8px;width:20px;height:20px;flex-shrink:0}.q span{display:grid;gap:4px}.q small{color:#53647b}.q strong{font-weight:550}.actions{display:flex;flex-wrap:wrap;gap:10px}button{background:#1856a0;border:0;border-radius:8px;color:white;font:inherit;padding:12px 16px;cursor:pointer}button.secondary{background:#e5ebf3;color:#19304c}.hint{color:#4f6074;font-size:.92rem}#status{min-height:1.5em}a{color:#1856a0}@media(max-width:420px){.card{padding:14px}.actions button{flex:1}}</style></head><body><header><a href="./index.html">就活コンパス トップへ</a> / 29卒向け</header><main><h1>OB・OG訪問 質問準備シート</h1><p>質問12選から聞きたい内容を選び、訪問前の準備と訪問後の振り返りを1枚に整理できます。選択した質問とメモをTXTで保存できます。</p><section class="card"><h2>訪問の基本情報</h2><label class="field">企業名<input id="company" type="text" maxlength="120" placeholder="例：〇〇株式会社"></label><label class="field">訪問日<input id="date" type="date"></label><label class="field">相手の部署・職種<input id="role" type="text" maxlength="120" placeholder="例：法人営業 3年目"></label><label class="field">今回確認したいこと<textarea id="goal" placeholder="例：若手の裁量と実際の業務内容"></textarea></label></section><section class="card"><h2>聞きたい質問を選ぶ</h2><p id="count" aria-live="polite">選択：0 / 12問</p><label class="q"><input type="checkbox" data-q="0"><span><small>仕事内容</small><strong>入社1〜3年目に担当する業務と一日の流れを教えてください。</strong></span></label>
<label class="q"><input type="checkbox" data-q="1"><span><small>仕事内容</small><strong>仕事で最も難しい判断を求められるのはどんな場面ですか。</strong></span></label>
<label class="q"><input type="checkbox" data-q="2"><span><small>成長</small><strong>入社前に想像していた仕事と、実際の仕事で違った点は何ですか。</strong></span></label>
<label class="q"><input type="checkbox" data-q="3"><span><small>成長</small><strong>若手が任される仕事の範囲はどのように広がりますか。</strong></span></label>
<label class="q"><input type="checkbox" data-q="4"><span><small>社風</small><strong>部署を越えて協力する際、どのように意思決定していますか。</strong></span></label>
<label class="q"><input type="checkbox" data-q="5"><span><small>社風</small><strong>活躍している社員に共通する行動はありますか。</strong></span></label>
<label class="q"><input type="checkbox" data-q="6"><span><small>事業</small><strong>競合他社と比べて顧客に選ばれる理由は何だと思いますか。</strong></span></label>
<label class="q"><input type="checkbox" data-q="7"><span><small>事業</small><strong>今後、特に変化が大きいと感じる事業領域はどこですか。</strong></span></label>
<label class="q"><input type="checkbox" data-q="8"><span><small>選考</small><strong>学生時代の経験をどのように仕事に結びつけて伝えるとよいですか。</strong></span></label>
<label class="q"><input type="checkbox" data-q="9"><span><small>選考</small><strong>志望理由を考えるうえで確認すべき情報はありますか。</strong></span></label>
<label class="q"><input type="checkbox" data-q="10"><span><small>働き方</small><strong>繁忙期と通常期で働き方はどのように変わりますか。</strong></span></label>
<label class="q"><input type="checkbox" data-q="11"><span><small>働き方</small><strong>入社後の配属や異動にはどのような希望反映の機会がありますか。</strong></span></label><p class="hint">限られた時間を考え、優先度の高い5問程度を選ぶのがおすすめです。</p></section><section class="card"><h2>訪問後の記録</h2><label class="field">印象に残った回答<textarea id="answer"></textarea></label><label class="field">企業理解・志望度の変化<textarea id="insight"></textarea></label><label class="field">次の行動<textarea id="next"></textarea></label></section><div class="actions"><button id="download" type="button">選択質問とメモをTXT保存</button><button id="clear" type="button" class="secondary">すべてクリア</button></div><p id="status" role="status" aria-live="polite"></p><p class="hint">入力内容はこのページから送信されず、自動保存もされません。ページを閉じる前にTXT保存してください。個人情報や機密情報は入力しないでください。</p><p><a href="./29sotsu-start-guide-2026.html">29卒スタートガイドに戻る</a></p></main><script>(()=>{'use strict';const ids=['company','date','role','goal','answer','insight','next'];const qs=[...document.querySelectorAll('[data-q]')];const val=id=>document.getElementById(id).value;const status=document.getElementById('status');function update(){document.getElementById('count').textContent=`選択：${qs.filter(q=>q.checked).length} / ${qs.length}問`;}qs.forEach(q=>q.addEventListener('change',update));document.getElementById('download').addEventListener('click',()=>{const selected=qs.filter(q=>q.checked).map((q,i)=>`${i+1}. ${q.nextElementSibling.querySelector('strong').textContent}`);const fields=[['企業名','company'],['訪問日','date'],['部署・職種','role'],['確認したいこと','goal'],['印象に残った回答','answer'],['企業理解・志望度の変化','insight'],['次の行動','next']];const lines=['29卒 OB・OG訪問 質問準備シート','',...fields.slice(0,4).map(([k,id])=>`${k}: ${val(id)}`),'','【選択した質問】',...(selected.length?selected:['未選択']),'',...fields.slice(4).map(([k,id])=>`${k}: ${val(id)}`)];const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='29sotsu-obog-visit-questions.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='TXTファイルを作成しました。';});document.getElementById('clear').addEventListener('click',()=>{if(!confirm('入力内容とチェックをすべて消去しますか？'))return;ids.forEach(id=>document.getElementById(id).value='');qs.forEach(q=>q.checked=false);update();status.textContent='入力内容を消去しました。';});update();})();</script></body></html>

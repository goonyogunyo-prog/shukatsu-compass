<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28卒 面接振り返り・改善アクション記録 | 就活コンパス</title><meta name="description" content="28卒向け。面接で確認できた事実と自分の仮説を分け、次の改善行動と期限を整理する無料シート。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-mensetsu-feedback-action-tracker.html"><style>body{font-family:system-ui,sans-serif;background:#f5f7fb;color:#17243c;margin:0}main{max-width:760px;margin:auto;padding:24px 16px 60px}a{color:#1259a8}h1{font-size:clamp(1.5rem,5vw,2.1rem)}.panel{background:white;padding:clamp(16px,4vw,30px);border-radius:16px;box-shadow:0 4px 22px #1a315010}label{display:block;font-weight:700;margin-top:20px;margin-bottom:8px}textarea,input{box-sizing:border-box;width:100%;border:1px solid #9aa9bb;border-radius:9px;padding:12px;font:inherit;background:#fff}textarea{resize:vertical}button{border:0;border-radius:9px;padding:12px 16px;background:#1558a3;color:white;font-weight:700;cursor:pointer;margin:8px 6px 0 0}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #e0a500}.note{background:#eef4ff;padding:14px;border-radius:9px;line-height:1.7}#clear{background:#5d6675}#status{min-height:1.5em}@media(max-width:480px){button{width:100%;margin:8px 0 0}}</style></head><body><main><nav><a href="index.html">就活コンパス</a> / <a href="28sotsu-guide-directory.html">28卒ガイド</a></nav><h1>28卒 面接振り返り・改善アクション記録</h1><p class="note">選考結果の理由は企業側にしか分かりません。「確認できた事実」「企業の発言」「自分の仮説」を分けて、次の面接に向けた行動に落とし込みましょう。入力内容はこの端末内にのみ保存され、外部送信しません。共有端末では使用後に削除してください。</p><section class="panel"><label for="company">企業名</label><textarea id="company" rows="2" placeholder="企業名"></textarea>
<label for="date">面接日</label><input id="date" type="date">
<label for="stage">選考段階</label><textarea id="stage" rows="2" placeholder="選考段階"></textarea>
<label for="facts">面接で実際に聞かれた質問・確認できた事実</label><textarea id="facts" rows="2" placeholder="面接で実際に聞かれた質問・確認できた事実"></textarea>
<label for="feedback">企業から明示されたフィードバック（なければ「なし」）</label><textarea id="feedback" rows="2" placeholder="企業から明示されたフィードバック（なければ「なし」）"></textarea>
<label for="hypothesis">自分の振り返り・仮説（推測として記録）</label><textarea id="hypothesis" rows="2" placeholder="自分の振り返り・仮説（推測として記録）"></textarea>
<label for="action">次回の具体的な改善行動</label><textarea id="action" rows="2" placeholder="次回の具体的な改善行動"></textarea>
<label for="deadline">改善の実施予定日</label><input id="deadline" type="date">
<label for="proof">改善できたか確認する方法</label><textarea id="proof" rows="2" placeholder="改善できたか確認する方法"></textarea><div><button id="copy" type="button">記録をコピー</button><button id="txt" type="button">TXT保存</button><button id="clear" type="button">保存内容を削除</button></div><p id="status" role="status" aria-live="polite"></p></section><p><a href="28sotsu-guide-directory.html">28卒ガイドに戻る</a></p></main><script>const ids=["company", "date", "stage", "facts", "feedback", "hypothesis", "action", "deadline", "proof"];const key='sc_28_interview_feedback_v1';const $=id=>document.getElementById(id);function values(){return Object.fromEntries(ids.map(id=>[id,$(id).value]));}function output(){const v=values();return ids.map(id=>$(id).previousElementSibling.textContent+'\n'+(v[id]||'未入力')).join('\n\n');}function save(){try{localStorage.setItem(key,JSON.stringify(values()));$('status').textContent='端末に保存しました';}catch(e){$('status').textContent='保存できませんでした。コピー・TXT保存をご利用ください';}}function restore(){try{const v=JSON.parse(localStorage.getItem(key)||'{}');ids.forEach(id=>$(id).value=v[id]||'');}catch(e){$('status').textContent='保存データを読み込めませんでした';}}ids.forEach(id=>$(id).addEventListener('input',save));$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(output());$('status').textContent='コピーしました';}catch(e){$('status').textContent='コピーに失敗しました';}};$('txt').onclick=()=>{const blob=new Blob([output()],{type:'text/plain;charset=utf-8'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='面接振り返り.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};$('clear').onclick=()=>{if(!confirm('このページの保存データを削除しますか？'))return;localStorage.removeItem(key);ids.forEach(id=>$(id).value='');$('status').textContent='削除しました';};restore();</script></body></html>

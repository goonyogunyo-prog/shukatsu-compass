<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29卒 インターン応募優先順位整理｜就活コンパス</title><meta name="description" content="29卒向け。インターン応募候補を締切・興味・学び・準備負荷で整理する無料ワーク。端末内保存とCSV出力に対応。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-internship-application-priority-planner.html"><style>:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#1a2940;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}main{max-width:880px;margin:auto;padding:24px 16px 70px}header{background:#17335d;color:white;padding:18px 16px}header div{max-width:880px;margin:auto}header a{color:white}h1{font-size:clamp(1.45rem,4vw,2rem)}p{line-height:1.7}.panel{background:white;border:1px solid #d9e2ef;border-radius:14px;padding:20px;margin:18px 0}label{display:block;font-weight:700;margin:12px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #a9bad0;border-radius:8px;font:inherit}textarea{min-height:75px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:8px;background:#245bb2;color:white;font:inherit;font-weight:700;padding:11px 16px;cursor:pointer}button.secondary{background:#e9f0fa;color:#183e75}button.danger{background:#a43c43}table{border-collapse:collapse;width:100%;min-width:650px}th,td{border-bottom:1px solid #dce5ef;padding:10px;text-align:left;vertical-align:top}th{background:#edf3fb}.scroll{overflow-x:auto}small,.muted{color:#52637a}a{color:#245bb2}@media(max-width:550px){.grid{grid-template-columns:1fr}.panel{padding:14px}}</style></head><body><header><div><a href="index.html">就活コンパス</a> / <a href="shukatsu-new-tools-directory.html">ツール一覧</a><h1>29卒｜インターン応募優先順位整理</h1></div></header><main><p>応募先を増やす前に、興味・学びたいこと・締切・準備負荷を整理。スコアは自分で決める優先度の目安で、合格可能性の予測ではありません。</p><section class="panel"><h2>候補を追加</h2><div class="grid"><div><label for="company">企業・プログラム名</label><input id="company" maxlength="100" placeholder="例：〇〇社 夏インターン"></div><div><label for="deadline">応募締切（公式情報で確認）</label><input id="deadline" type="date"></div><div><label for="interest">興味の強さ（1〜5）</label><select id="interest"><option>3</option><option>1</option><option>2</option><option>4</option><option>5</option></select></div><div><label for="learning">学びの期待（1〜5）</label><select id="learning"><option>3</option><option>1</option><option>2</option><option>4</option><option>5</option></select></div><div><label for="effort">準備負荷（1=小、5=大）</label><select id="effort"><option>3</option><option>1</option><option>2</option><option>4</option><option>5</option></select></div><div><label for="source">募集要項URL（任意）</label><input id="source" type="url" placeholder="https://..."></div></div><label for="memo">応募する理由・確認事項</label><textarea id="memo" maxlength="1000"></textarea><div class="actions"><button id="add">候補を保存</button><button id="export" class="secondary">CSVを書き出す</button><button id="clear" class="danger">全データ削除</button></div><p id="status" role="status" aria-live="polite" class="muted"></p></section><section class="panel"><h2>候補一覧 <span id="count"></span></h2><p class="muted">優先度 = 興味×2 ＋ 学び×2 − 準備負荷。締切が近い順で表示し、同じ日付なら優先度順に並びます。締切未入力は末尾です。</p><div class="scroll"><table><thead><tr><th>応募候補</th><th>締切</th><th>優先度</th><th>メモ・出典</th><th>操作</th></tr></thead><tbody id="list"></tbody></table></div></section><p><small>データはこの端末のブラウザ内に保存します。共有端末では入力しないでください。募集内容・締切は必ず企業公式情報を確認してください。ブラウザの設定によって保存できない場合があります。</small></p></main><script>(()=>{'use strict';const key='sc29_intern_priority_v1';const $=id=>document.getElementById(id);let entries=[];try{const a=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(a))entries=a.filter(x=>x&&typeof x.company==='string').slice(0,100)}catch(e){$('status').textContent='保存データを読み込めませんでした'}const save=()=>{try{localStorage.setItem(key,JSON.stringify(entries));return true}catch(e){$('status').textContent='端末保存に失敗しました。CSVで控えを保存してください';return false}};const score=x=>2*Number(x.interest)+2*Number(x.learning)-Number(x.effort);const render=()=>{$('list').replaceChildren();const sorted=[...entries].sort((a,b)=>(a.deadline||'9999').localeCompare(b.deadline||'9999')||score(b)-score(a));$('count').textContent='（'+entries.length+'件）';for(const x of sorted){const tr=document.createElement('tr');const cell=(value)=>{const td=document.createElement('td');td.textContent=value;tr.append(td);return td};cell(x.company);cell(x.deadline||'未入力');cell(String(score(x))+'点');const td=cell(x.memo||'');if(x.source&&/^https:\/\//i.test(x.source)){td.append(document.createElement('br'));const a=document.createElement('a');a.href=x.source;a.textContent='公式情報を開く';a.target='_blank';a.rel='noopener noreferrer';td.append(a)}const last=document.createElement('td'),btn=document.createElement('button');btn.className='secondary';btn.textContent='削除';btn.addEventListener('click',()=>{entries=entries.filter(e=>e.id!==x.id);save();render()});last.append(btn);tr.append(last);$('list').append(tr)}if(!entries.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=5;td.textContent='まだ候補がありません';tr.append(td);$('list').append(tr)}};$('add').addEventListener('click',()=>{const company=$('company').value.trim();if(!company){$('status').textContent='企業・プログラム名を入力してください';$('company').focus();return}if(entries.length>=100){$('status').textContent='登録上限は100件です';return}entries.push({id:String(Date.now())+'_'+Math.random().toString(36).slice(2),company,deadline:$('deadline').value,interest:$('interest').value,learning:$('learning').value,effort:$('effort').value,source:$('source').value.trim(),memo:$('memo').value.trim()});save();render();$('company').value='';$('memo').value='';$('status').textContent='候補を追加しました'});$('clear').addEventListener('click',()=>{if(!confirm('登録したすべての候補を削除しますか？'))return;entries=[];save();render();$('status').textContent='削除しました'});$('export').addEventListener('click',()=>{const quote=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const rows=[['企業・プログラム','締切','興味','学び','準備負荷','優先度','募集要項URL','メモ'],...entries.map(x=>[x.company,x.deadline,x.interest,x.learning,x.effort,score(x),x.source,x.memo])];const csv='﻿'+rows.map(r=>r.map(quote).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='29sotsu-internship-priority.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});render()})();</script></body></html>

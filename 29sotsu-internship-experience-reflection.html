<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>29卒 インターン参加後の振り返りシート｜就活コンパス</title><meta name="description" content="29卒向け。インターン参加後に事実・解釈・適性・次の行動を分けて整理する無料シート。端末保存とTXT出力に対応。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-internship-experience-reflection.html"><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#17243a;font:16px/1.7 system-ui,sans-serif}header{background:#122b4a;color:#fff;padding:20px max(16px,calc((100vw - 880px)/2))}header a{color:#d7ebff}main{max-width:880px;margin:auto;padding:24px 16px 80px}h1{font-size:clamp(1.5rem,4vw,2.1rem);line-height:1.4}section{background:white;border:1px solid #dce4ed;border-radius:14px;padding:22px;margin:20px 0}label{display:block;font-weight:700;margin:16px 0 6px}input,textarea{width:100%;font:inherit;border:1px solid #8c9cae;border-radius:8px;padding:10px}textarea{min-height:100px;resize:vertical}button{padding:12px 18px;margin:8px 8px 0 0;background:#164d81;color:white;border:0;border-radius:8px;font:inherit;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ffb84d}.muted{color:#536579}footer{padding:20px;text-align:center}</style></head><body><header><a href="index.html">就活コンパス</a> / <a href="29sotsu-start-guide-2026.html">29卒ガイド</a></header><main><h1>29卒 インターン参加後の振り返りシート</h1><p>「楽しかった」で終わらせず、企業理解と次の応募準備につなげる。社員の発言など確認できた事実と、自分の推測を区別して記録しましょう。</p><section><label for="company">企業・プログラム名</label><input id="company" autocomplete="organization"><label for="date">参加日</label><input type="date" id="date"><label for="f0">目的：参加前に確かめたかったこと</label><textarea id="f0" placeholder="具体的に記録（未確認は未確認と記入）"></textarea><label for="f1">体験：実際に担当・見学した仕事</label><textarea id="f1" placeholder="具体的に記録（未確認は未確認と記入）"></textarea><label for="f2">発見：社員の発言・公開情報など確認できた事実</label><textarea id="f2" placeholder="具体的に記録（未確認は未確認と記入）"></textarea><label for="f3">解釈：自分の考察（事実と分ける）</label><textarea id="f3" placeholder="具体的に記録（未確認は未確認と記入）"></textarea><label for="f4">適性：自分の強みと合う点・合わない点</label><textarea id="f4" placeholder="具体的に記録（未確認は未確認と記入）"></textarea><label for="f5">次の一手：追加で調べること・次の行動</label><textarea id="f5" placeholder="具体的に記録（未確認は未確認と記入）"></textarea><p class="muted">記入内容はこのブラウザ内に保存され、外部送信しません。共有端末では利用に注意してください。ブラウザデータ削除で失われるため、TXT出力をおすすめします。</p><button type="button" id="export">TXTで保存</button><button type="button" id="clear">入力と保存を削除</button><p role="status" aria-live="polite" id="status"></p></section><section><h2>振り返りの使い方</h2><p>①参加前の目的と体験を照合 → ②事実と解釈を分離 → ③志望理由に使える具体例を抽出 → ④不足情報を次回の質問にする。</p></section></main><footer><a href="index.html">トップに戻る</a></footer><script>const ids=['company','date','f0','f1','f2','f3','f4','f5'];const key='sc_29_intern_reflection_v1';const $=id=>document.getElementById(id);function snapshot(){return Object.fromEntries(ids.map(id=>[id,$(id).value]));}function save(){try{localStorage.setItem(key,JSON.stringify(snapshot()));$('status').textContent='この端末に保存しました';}catch(e){$('status').textContent='保存できません。TXT出力を利用してください';}}function output(){const d=snapshot();return '29卒 インターン振り返り\n企業：'+d.company+'\n参加日：'+d.date+'\n\n'+['目的','体験','確認できた事実','自分の解釈','適性','次の行動'].map((t,i)=>t+'\n'+d['f'+i]).join('\n\n');}function download(){const blob=new Blob([output()],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='intern-reflection.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}function reset(){if(!confirm('入力内容と端末保存を削除しますか？'))return;ids.forEach(id=>$(id).value='');try{localStorage.removeItem(key)}catch(e){}$('status').textContent='削除しました';}try{const old=JSON.parse(localStorage.getItem(key)||'{}');ids.forEach(id=>{if(typeof old[id]==='string')$(id).value=old[id]})}catch(e){}ids.forEach(id=>$(id).addEventListener('input',save));$('export').addEventListener('click',download);$('clear').addEventListener('click',reset);</script></body></html>

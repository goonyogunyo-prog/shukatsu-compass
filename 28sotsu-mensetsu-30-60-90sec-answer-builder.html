<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28卒 面接30秒・60秒・90秒回答構成ワーク｜就活コンパス</title><meta name="description" content="28卒向け。面接の自己紹介・ガクチカ・志望動機を30秒、60秒、90秒で話すための回答構成を整理。文字数目安、チェック、TXT保存に対応。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-mensetsu-30-60-90sec-answer-builder.html"><style>:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#18283d;background:#f4f7fc}*{box-sizing:border-box}main{max-width:850px;margin:32px auto;padding:28px;background:white;border-radius:18px;box-shadow:0 6px 24px #152f5310}h1{font-size:clamp(1.45rem,4vw,2rem)}label{display:block;font-weight:700;margin:16px 0 7px}select,textarea,input{width:100%;padding:12px;border:1px solid #b7c7da;border-radius:9px;font:inherit}textarea{min-height:90px;resize:vertical}button{border:0;border-radius:9px;padding:11px 15px;background:#1558ae;color:white;font:inherit;cursor:pointer;margin:5px 7px 5px 0}button.secondary{background:#e8eff8;color:#173e6a}.panel{background:#edf5ff;padding:17px;border-radius:12px;margin:18px 0}#output{min-height:150px}small,.muted{color:#53647a}a{color:#1458b2}fieldset{border:1px solid #d3deed;border-radius:10px;margin-top:18px}fieldset label{font-weight:400;margin:9px 0}fieldset input{width:auto;margin-right:7px}@media(max-width:600px){main{margin:0;padding:18px;border-radius:0}button{width:100%;margin:5px 0}}</style></head><body><main><p><a href="./index.html">← 就活コンパスに戻る</a></p><h1>28卒｜面接回答30秒・60秒・90秒 構成ワーク</h1><p>経験を「結論→具体例→学び・接続」の順で整理。自分で入力した内容だけを使って回答のたたき台を作ります。合否予測や自動添削ではありません。</p><label for="question">質問</label><select id="question"><option>自己紹介</option><option>学生時代に力を入れたこと</option><option>志望動機</option><option>自己PR</option><option>強みと弱み</option><option>挫折経験</option><option>チームでの役割</option><option>入社後に挑戦したいこと</option></select><label for="duration">目標時間</label><select id="duration"><option value="30">30秒</option><option value="60" selected>60秒</option><option value="90">90秒</option></select><label for="point">① 結論・最も伝えたいこと</label><textarea id="point" placeholder="例：私の強みは、周囲の意見をまとめて行動につなげる力です。"></textarea><label for="episode">② 根拠となる具体的な行動・数字</label><textarea id="episode" placeholder="状況、課題、自分の行動、結果を具体的に"></textarea><label for="learning">③ 学び・志望先との接点</label><textarea id="learning" placeholder="その経験から得たこと、今後どう活かすか"></textarea><button id="make">回答案を組み立てる</button><button class="secondary" id="clear">入力を消去</button><div class="panel" aria-live="polite"><strong id="stats">目標60秒・目安約300字</strong><p class="muted">発話速度を1分300字として概算。実際は声に出して計測してください。</p></div><label for="output">回答案（自由に編集できます）</label><textarea id="output"></textarea><p id="count" aria-live="polite">0文字</p><button id="copy">回答案をコピー</button><button id="download">TXT保存</button><p id="notice" aria-live="polite"></p><fieldset><legend>声に出す前の確認</legend><label><input type="checkbox">最初に結論を述べている</label><label><input type="checkbox">自分の行動が具体的である</label><label><input type="checkbox">数字・事実は正確である</label><label><input type="checkbox">志望先との接点が自然である</label><label><input type="checkbox">実際に時間を測って話した</label></fieldset><p class="muted"><small>入力内容はこのページ内だけで処理し、自動保存・外部送信しません。ページを閉じる前に必要な内容を保存してください。企業の正式な設問・時間指定を優先してください。</small></p><p><a href="./28sotsu-mensetsu-1min-timer.html">面接1分回答タイマーで練習する →</a></p></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),fields=['point','episode','learning'];const count=()=>{$('count').textContent=Array.from($('output').value).length+'文字（目安 '+Math.round(Number($('duration').value)*5)+'字）'};const stats=()=>{$('stats').textContent='目標'+$('duration').value+'秒・目安約'+Number($('duration').value)*5+'字';count()};$('duration').addEventListener('change',stats);$('output').addEventListener('input',count);$('make').addEventListener('click',()=>{const p=$('point').value.trim(),e=$('episode').value.trim(),l=$('learning').value.trim();if(!p&&!e&&!l){$('notice').textContent='先に材料を入力してください。';return}$('output').value=[p,e,l].filter(Boolean).join('\n\n');$('notice').textContent='回答案を作成しました。話し言葉に編集してください。';count()});$('clear').addEventListener('click',()=>{if(!confirm('入力と回答案をすべて消去しますか？'))return;fields.forEach(id=>$(id).value='');$('output').value='';document.querySelectorAll('input[type=checkbox]').forEach(x=>x.checked=false);$('notice').textContent='消去しました。';count()});$('copy').addEventListener('click',async()=>{if(!$('output').value.trim())return $('notice').textContent='回答案が空です。';try{await navigator.clipboard.writeText($('output').value);$('notice').textContent='コピーしました。'}catch(e){$('output').focus();$('output').select();$('notice').textContent='コピーできませんでした。選択した文章を手動でコピーしてください。'}});$('download').addEventListener('click',()=>{if(!$('output').value.trim())return $('notice').textContent='回答案が空です。';const blob=new Blob(['質問：'+$('question').value+'\n目標：'+$('duration').value+'秒\n\n'+$('output').value],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='28sotsu-mensetsu-answer.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$('notice').textContent='TXTファイルを作成しました。'});stats()})();</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29卒 インターン選考振り返りシート｜就活コンパス</title><meta name="description" content="29卒向けインターン選考の振り返り。設問・回答・改善点・次の行動を端末内で整理し、TXTで保存できます。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-internship-selection-review.html"><style>body{font-family:system-ui,sans-serif;background:#f5f7fb;color:#17243a;margin:0;line-height:1.65}main{max-width:800px;margin:auto;padding:24px 16px 60px}section{background:white;border:1px solid #dce4ef;border-radius:16px;padding:20px;margin:16px 0}label{display:block;font-weight:650;margin:14px 0 5px}input,textarea,select{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #aebbd0;border-radius:9px}textarea{min-height:100px}button{font:inherit;border:0;border-radius:9px;padding:12px 16px;background:#164b8b;color:white;cursor:pointer;margin:5px 5px 5px 0}button:focus-visible,a:focus-visible{outline:3px solid #ed9a20;outline-offset:3px}.secondary{background:#56677d}.muted{color:#506078;font-size:.92rem}a{color:#164b8b}h1{line-height:1.3}</style></head><body><main><nav><a href="index.html">就活コンパス ホーム</a> ／ <a href="shukatsu-new-tools-directory.html">ツール一覧</a></nav><h1>29卒｜インターン選考振り返りシート</h1><p>選考の結果だけでなく、自分が伝えた内容と次の改善行動を整理するための無料ワークです。合否予測や自動評価は行いません。</p><section><label for="company">企業名・プログラム名</label><input id="company" maxlength="120" placeholder="例：○○株式会社 3days"><label for="stage">振り返る段階</label><select id="stage"><option>ES</option><option>Webテスト</option><option>録画面接</option><option>個人面接</option><option>グループディスカッション</option><option>その他</option></select><label for="date">実施・提出日</label><input id="date" type="date"><label for="question">実際に問われた内容・課題</label><textarea id="question"></textarea><label for="answer">自分が回答・実施したこと（事実）</label><textarea id="answer"></textarea><label for="good">できたこと・根拠</label><textarea id="good"></textarea><label for="improve">次回改善したいこと</label><textarea id="improve"></textarea><label for="next">次に取る具体的な行動</label><textarea id="next" placeholder="例：ガクチカを60秒で説明できるように練習"></textarea><label for="deadline">改善行動の目標日</label><input id="deadline" type="date"><p id="status" role="status" aria-live="polite" class="muted">入力内容はこの端末のブラウザ内でのみ扱います。</p><button id="save">端末に保存</button><button id="export">TXT保存</button><button id="copy" class="secondary">文章をコピー</button><button id="clear" class="secondary">入力と端末保存を削除</button></section><p class="muted">端末保存にはlocalStorageを使用します。共有端末では保存しないでください。ブラウザのデータ削除で消える場合があります。企業の選考情報は守秘義務に注意し、共有しないでください。</p></main><script>"use strict";(()=>{const ids=['company','stage','date','question','answer','good','improve','next','deadline'],key='sc_29_internship_review_v1',status=document.getElementById('status');const data=()=>Object.fromEntries(ids.map(id=>[id,document.getElementById(id).value]));const text=()=>ids.map(id=>document.querySelector('label[for="'+id+'"]').textContent+'\n'+data()[id]).join('\n\n');try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&typeof saved==='object')ids.forEach(id=>{if(typeof saved[id]==='string')document.getElementById(id).value=saved[id]});}catch(e){status.textContent='端末保存の読み込みに失敗しました。'}document.getElementById('save').onclick=()=>{try{localStorage.setItem(key,JSON.stringify(data()));status.textContent='この端末に保存しました。'}catch(e){status.textContent='保存できませんでした。TXT保存をご利用ください。'}};document.getElementById('export').onclick=()=>{const url=URL.createObjectURL(new Blob([text()],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='29sotsu-internship-review.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='TXTを作成しました。'};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(text());status.textContent='コピーしました。'}catch(e){status.textContent='コピーできませんでした。TXT保存をご利用ください。'}};document.getElementById('clear').onclick=()=>{if(!confirm('入力とこのツールの端末保存を削除しますか？'))return;ids.forEach(id=>document.getElementById(id).value=id==='stage'?'ES':'');try{localStorage.removeItem(key)}catch(e){}status.textContent='入力と保存データを削除しました。'};})();</script></body></html>

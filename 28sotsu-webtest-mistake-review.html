<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28卒 Webテスト復習・間違い分析シート｜就活コンパス</title><meta name="description" content="28卒向け。SPI・玉手箱などのWebテストで間違えた問題の原因と次の対策を整理する無料復習シート。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-webtest-mistake-review.html"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#182b43;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:36px auto;padding:0 18px}header{background:#173b68;color:white;padding:20px}header a{color:white}h1{font-size:clamp(1.5rem,4vw,2.1rem)}.panel{background:white;border:1px solid #dce5ef;border-radius:14px;padding:22px;margin:20px 0}label{display:block;font-weight:650;margin:15px 0 6px}input,select,textarea{width:100%;font:inherit;border:1px solid #a9b7c8;border-radius:8px;padding:11px;background:white}textarea{min-height:85px;resize:vertical}button{border:0;background:#155eab;color:white;padding:12px 16px;border-radius:8px;cursor:pointer;font-weight:650;margin:5px 6px 5px 0}button.secondary{background:#526479}.help{color:#53647b;font-size:.93rem}#records article{border-top:1px solid #dce5ef;padding:12px 0;overflow-wrap:anywhere}#records button{background:#8a3545}footer{padding:24px 0;color:#526479}a{color:#135aa0}@media(max-width:500px){main{margin:18px auto}.panel{padding:16px}button{width:100%;margin:6px 0}}</style></head><body><header><a href="./index.html">← 就活コンパスへ戻る</a></header><main><h1>28卒｜Webテスト間違い分析・復習シート</h1><p>SPI・玉手箱などの演習で間違えた問題を「原因」と「次にやること」に分けて記録。実際の出題内容の転載や機密情報の記入は避けてください。</p><section class="panel"><h2>復習記録を追加</h2><label for="type">分野</label><select id="type"><option>非言語・計数</option><option>言語</option><option>英語</option><option>その他</option></select><label for="topic">単元・問題の特徴（問題文の転載は不要）</label><input id="topic" maxlength="120" placeholder="例：割合と損益算"><label for="cause">間違えた原因</label><select id="cause"><option>解法を知らなかった</option><option>時間が足りなかった</option><option>計算・読み違い</option><option>条件整理が不十分</option><option>原因を調査中</option></select><label for="action">次回の具体的な対策</label><textarea id="action" maxlength="800" placeholder="例：割合の基本問題を5問解き直す"></textarea><label for="date">復習予定日（任意）</label><input id="date" type="date"><button id="add">記録を追加</button><p class="help" id="status" role="status" aria-live="polite"></p></section><section class="panel"><h2>記録一覧 <span id="count">0件</span></h2><button class="secondary" id="export">TXT保存</button><button class="secondary" id="clear">全件削除</button><div id="records"></div><p class="help">記録はこのブラウザ内（localStorage）にのみ保存します。共有端末では削除してください。ブラウザのデータ消去で失われるため、必要ならTXTで保存してください。</p></section><footer><a href="./28sotsu-guide-directory.html">28卒ガイド</a> ｜ <a href="./index.html">トップページ</a><p>就活コンパス｜非公式の学習補助ツール。選考形式や試験範囲は応募先の案内を優先してください。</p></footer></main><script>(()=>{'use strict';const key='sc_28_webtest_review_v1';const $=id=>document.getElementById(id);let data=[];try{const saved=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(saved))data=saved.filter(x=>x&&typeof x==='object').slice(0,200)}catch(e){$('status').textContent='保存済みデータを読み込めませんでした。'}function persist(){try{localStorage.setItem(key,JSON.stringify(data));return true}catch(e){$('status').textContent='端末保存に失敗しました。TXT保存を利用してください。';return false}}function render(){const root=$('records');root.replaceChildren();$('count').textContent=data.length+'件';if(!data.length){const p=document.createElement('p');p.textContent='まだ記録がありません。';root.append(p);return}data.forEach((r,i)=>{const art=document.createElement('article');const h=document.createElement('h3');h.textContent=(i+1)+'. '+r.type+'｜'+r.topic;const p=document.createElement('p');p.textContent='原因：'+r.cause+' ／ 復習予定：'+(r.date||'未設定');const note=document.createElement('p');note.textContent='対策：'+r.action;const del=document.createElement('button');del.textContent='この記録を削除';del.addEventListener('click',()=>{if(!confirm('この記録を削除しますか？'))return;data.splice(i,1);persist();render()});art.append(h,p,note,del);root.append(art)})}function safe(v){return String(v||'').replace(/[\r\n\t]+/g,' ').trim()}$('add').addEventListener('click',()=>{const topic=safe($('topic').value),action=safe($('action').value);if(!topic||!action){$('status').textContent='単元と対策を入力してください。';return}data.unshift({type:$('type').value,topic,cause:$('cause').value,action,date:$('date').value});data=data.slice(0,200);persist();$('topic').value='';$('action').value='';$('status').textContent='記録を追加しました。';render()});$('clear').addEventListener('click',()=>{if(!data.length||!confirm('すべての復習記録を削除しますか？'))return;data=[];persist();render();$('status').textContent='全件削除しました。'});$('export').addEventListener('click',()=>{if(!data.length){$('status').textContent='保存する記録がありません。';return}const lines=['28卒 Webテスト復習記録','作成日：'+new Date().toLocaleDateString('ja-JP'),''];data.forEach((r,i)=>lines.push((i+1)+'. '+r.type+' / '+r.topic,'原因：'+r.cause,'対策：'+r.action,'復習予定：'+(r.date||'未設定'),''));const url=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='webtest-review.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});render()})();</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28卒 内定回答期限・確認事項整理ツール｜就活コンパス</title><meta name="description" content="28卒向け。内定の回答期限、確認事項、次の行動を端末内で整理する無料ツール。CSV・JSONで保存できます。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-naitei-response-deadline-planner.html"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#172638;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:880px;margin:auto;padding:24px 16px 70px}header{background:#132c49;color:white;padding:18px 22px}header a{color:white}h1{font-size:clamp(1.55rem,5vw,2.3rem)}.panel{background:white;border:1px solid #dbe4ee;border-radius:14px;padding:20px;margin:18px 0}label{display:block;font-weight:650;margin:12px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #aab9c9;border-radius:8px;font:inherit}textarea{min-height:90px}button{background:#174d80;color:white;border:0;border-radius:8px;padding:11px 15px;font:inherit;cursor:pointer;margin:5px 5px 5px 0}button.secondary{background:#e8eef5;color:#173554}button:focus-visible,input:focus-visible{outline:3px solid #e6a82d}article{border-top:1px solid #dae3ed;padding:14px 0;overflow-wrap:anywhere}.muted{color:#4c5e70;font-size:.92rem}.warn{color:#a33c16;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:580px){.row{grid-template-columns:1fr}}.empty{padding:12px;color:#526376}</style></head><body><header><a href="./index.html">就活コンパス トップへ</a>　/　28卒向け</header><main><h1>内定回答期限・確認事項整理</h1><p>内定先ごとの回答期限と、返事をする前に確認したいことを一覧にまとめます。回答期限の延長可否は企業ごとに異なるため、必ず担当者に確認してください。</p><section class="panel"><h2>企業を登録</h2><form id="form"><label for="company">企業名</label><input id="company" maxlength="100" required placeholder="例：株式会社〇〇"><div class="row"><div><label for="deadline">回答期限</label><input id="deadline" type="date" required></div><div><label for="status">状況</label><select id="status"><option>検討中</option><option>確認待ち</option><option>承諾済み</option><option>辞退済み</option></select></div></div><label for="question">確認事項・次の行動</label><textarea id="question" maxlength="2000" placeholder="例：配属・勤務地・労働条件通知書を確認する"></textarea><button type="submit">登録する</button></form></section><section class="panel"><h2>登録一覧 <span id="count">0件</span></h2><label for="filter">表示</label><select id="filter"><option value="all">すべて</option><option value="open">未回答のみ</option><option value="done">回答済みのみ</option></select><div id="entries" aria-live="polite"></div><button id="csv" class="secondary" type="button">CSV保存</button><button id="backup" class="secondary" type="button">JSONバックアップ</button><label for="restore">JSONから復元（現在の一覧を置換）</label><input type="file" id="restore" accept="application/json,.json"><button id="clear" class="secondary" type="button">全件削除</button></section><p class="muted">入力内容はこのブラウザのlocalStorageに保存されます。外部送信はしません。共有端末では使用後に削除してください。CSVやJSONには企業名・メモが含まれるため保管先に注意してください。期限の残日数は端末の日付を基準に算出し、通知や自動同期はありません。内定承諾・辞退の法的判断を行うものではありません。</p></main><script>(()=>{'use strict';const KEY='sc28_offer_deadline_v1';const $=id=>document.getElementById(id);let data=[];try{const d=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(d))data=d.filter(valid).slice(0,200)}catch{}function valid(x){return x&&typeof x.id==='string'&&typeof x.company==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.deadline)&&['検討中','確認待ち','承諾済み','辞退済み'].includes(x.status)&&typeof x.question==='string'}function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('端末への保存に失敗しました。JSONバックアップを利用してください。')}}function node(tag,txt){const e=document.createElement(tag);e.textContent=txt;return e}function render(){const box=$('entries');box.replaceChildren();$('count').textContent=data.length+'件';const filter=$('filter').value;let items=[...data].sort((a,b)=>a.deadline.localeCompare(b.deadline));items=items.filter(x=>filter==='all'||(filter==='done'?['承諾済み','辞退済み'].includes(x.status):!['承諾済み','辞退済み'].includes(x.status)));if(!items.length)box.append(node('p','該当する登録はありません。'));for(const x of items){const art=document.createElement('article');art.append(node('h3',x.company));const date=new Date(x.deadline+'T00:00:00');const today=new Date();today.setHours(0,0,0,0);const days=Math.round((date-today)/86400000);const p=node('p','回答期限：'+x.deadline+'（'+(days<0?Math.abs(days)+'日経過':days===0?'今日':days+'日後')+'）');if(days<=3&&!['承諾済み','辞退済み'].includes(x.status))p.className='warn';art.append(p,node('p','確認事項：'+(x.question||'未入力')));const label=node('label','状況を変更');const sel=document.createElement('select');for(const s of ['検討中','確認待ち','承諾済み','辞退済み']){const op=node('option',s);op.value=s;sel.append(op)}sel.value=x.status;sel.addEventListener('change',()=>{x.status=sel.value;save();render()});label.append(sel);art.append(label);const del=node('button','削除');del.className='secondary';del.type='button';del.addEventListener('click',()=>{if(confirm(x.company+'を削除しますか？')){data=data.filter(y=>y.id!==x.id);save();render()}});art.append(del);box.append(art)}}function download(filename,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('form').addEventListener('submit',e=>{e.preventDefault();if(data.length>=200)return alert('登録は最大200件です');const company=$('company').value.trim(),deadline=$('deadline').value;if(!company||!/^\d{4}-\d{2}-\d{2}$/.test(deadline))return;data.push({id:String(Date.now())+'-'+Math.random().toString(36).slice(2),company,deadline,status:$('status').value,question:$('question').value.slice(0,2000)});save();$('form').reset();render()});$('filter').addEventListener('change',render);$('csv').addEventListener('click',()=>{const rows=[['企業名','回答期限','状況','確認事項'],...data.map(x=>[x.company,x.deadline,x.status,x.question])];const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');download('naitei-deadlines.csv',csv,'text/csv;charset=utf-8')});$('backup').addEventListener('click',()=>download('naitei-deadlines.json',JSON.stringify({version:1,items:data},null,2),'application/json'));$('restore').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>1000000)throw Error('ファイルが大きすぎます');const d=JSON.parse(await f.text());if(d.version!==1||!Array.isArray(d.items)||d.items.length>200||!d.items.every(valid))throw Error('形式が一致しません');if(confirm('現在の登録を置き換えますか？')){data=d.items.map(x=>({id:x.id.slice(0,100),company:x.company.slice(0,100),deadline:x.deadline,status:x.status,question:x.question.slice(0,2000)}));save();render()}}catch(err){alert('復元できません：'+err.message)}finally{e.target.value=''}});$('clear').addEventListener('click',()=>{if(confirm('登録内容をすべて削除しますか？')){data=[];save();render()}});render()})();</script></body></html>

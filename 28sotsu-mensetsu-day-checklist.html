<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28卒 面接当日チェックリスト｜持ち物・接続・連絡先｜就活コンパス</title><meta name="description" content="28卒向け面接当日チェックリスト。対面・オンライン面接の準備を12項目で確認し、TXT保存や印刷ができます。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-mensetsu-day-checklist.html"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#192b3a;background:#f5f8fb}*{box-sizing:border-box}body{margin:0}main{max-width:780px;margin:auto;padding:24px 16px 60px}header{background:#14314c;color:white;padding:18px}header a{color:white}h1{font-size:clamp(1.5rem,4vw,2.2rem);line-height:1.4}section{background:white;border:1px solid #dce5ec;border-radius:14px;padding:20px;margin:18px 0}.item{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid #edf0f4;line-height:1.5}.item input{margin-top:5px;min-width:20px;min-height:20px}input[type=text],input[type=date],textarea{width:100%;padding:12px;border:1px solid #a7b9c8;border-radius:8px;font:inherit}textarea{min-height:100px}button{border:0;border-radius:8px;background:#145e84;color:white;padding:12px 16px;cursor:pointer;font:inherit;margin:5px 5px 5px 0}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #f3a846}progress{width:100%;height:18px}small{color:#526676}.muted{color:#526676} @media print{header,button,.no-print{display:none}body{background:white}section{break-inside:avoid}}</style></head><body><header><a href="./index.html">就活コンパス トップへ</a>　/　<a href="./28sotsu-guide-directory.html">28卒ガイド</a></header><main><p class="muted">28卒 / 面接準備 / 無料</p><h1>面接当日チェックリスト</h1><p>対面・オンライン面接の準備漏れを防ぐための確認用シート。企業からの正式案内が最優先です。</p><section><h2>面接情報</h2><p><label>企業名（任意）<input id="company" type="text" maxlength="120" placeholder="例：株式会社〇〇"></label></p><p><label>面接日（任意）<input id="day" type="date"></label></p><p><label>形式 <select id="mode"><option>対面</option><option>オンライン</option><option>未定</option></select></label></p></section><section><h2>準備チェック</h2><p id="counter" role="status">0 / 12項目完了</p><progress id="progress" value="0" max="12"></progress><div id="tasks"><label class="item"><input type="checkbox" class="task" data-n="0"><span>企業の面接案内メールで日時・開始時刻を確認した</span></label>
<label class="item"><input type="checkbox" class="task" data-n="1"><span>会場住所またはオンラインURLを確認した</span></label>
<label class="item"><input type="checkbox" class="task" data-n="2"><span>対面の場合、交通経路と遅延時の代替経路を確認した</span></label>
<label class="item"><input type="checkbox" class="task" data-n="3"><span>オンラインの場合、接続・カメラ・マイクをテストした</span></label>
<label class="item"><input type="checkbox" class="task" data-n="4"><span>履歴書・ES・ポートフォリオなど指定書類を用意した</span></label>
<label class="item"><input type="checkbox" class="task" data-n="5"><span>身分証・学生証など指定された持ち物を確認した</span></label>
<label class="item"><input type="checkbox" class="task" data-n="6"><span>面接官への質問を2〜3個準備した</span></label>
<label class="item"><input type="checkbox" class="task" data-n="7"><span>志望理由・自己PR・ガクチカを声に出して練習した</span></label>
<label class="item"><input type="checkbox" class="task" data-n="8"><span>緊急連絡先・遅刻時の連絡方法を確認した</span></label>
<label class="item"><input type="checkbox" class="task" data-n="9"><span>服装・身だしなみ・必要な充電器を確認した</span></label>
<label class="item"><input type="checkbox" class="task" data-n="10"><span>面接後に振り返るメモ欄を用意した</span></label>
<label class="item"><input type="checkbox" class="task" data-n="11"><span>個人情報を含む資料の取り扱いを確認した</span></label></div></section><section><h2>当日のメモ</h2><label for="memo">集合場所・接続先の確認事項など（URL・パスワードなどの機密情報は入力しないでください）</label><textarea id="memo" maxlength="2000" placeholder="例：受付は開始10分前、指定の持ち物は履歴書"></textarea><div><button id="save" type="button">TXT保存</button><button id="print" type="button">印刷・PDF保存</button><button id="clear" type="button">入力を消去</button></div><p class="muted">自動保存・外部送信はしません。画面を閉じる前に必要ならTXT保存してください。共有端末では入力内容に注意してください。</p></section><p><a href="./28sotsu-guide-directory.html">28卒ガイドへ戻る</a></p></main><script>(function(){'use strict';const checks=[...document.querySelectorAll('.task')];const counter=document.getElementById('counter'),progress=document.getElementById('progress');function refresh(){const n=checks.filter(x=>x.checked).length;counter.textContent=n+' / '+checks.length+'項目完了';progress.max=checks.length;progress.value=n;}checks.forEach(x=>x.addEventListener('change',refresh));refresh();document.getElementById('save').addEventListener('click',()=>{const lines=['28卒 面接当日チェックリスト','企業名: '+document.getElementById('company').value,'面接日: '+document.getElementById('day').value,'形式: '+document.getElementById('mode').value,'',...checks.map(x=>(x.checked?'[済] ':'[未] ')+x.nextElementSibling.textContent),'','メモ:',document.getElementById('memo').value];const blob=new Blob(['\uFEFF'+lines.join('\n')],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mensetsu-day-checklist.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);});document.getElementById('print').addEventListener('click',()=>window.print());document.getElementById('clear').addEventListener('click',()=>{if(!confirm('すべての入力とチェックを消去しますか？'))return;checks.forEach(x=>x.checked=false);document.getElementById('company').value='';document.getElementById('day').value='';document.getElementById('mode').selectedIndex=0;document.getElementById('memo').value='';refresh();});})();</script></body></html>

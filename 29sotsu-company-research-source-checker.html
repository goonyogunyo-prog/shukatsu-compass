<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29卒 企業研究の情報源チェックシート｜就活コンパス</title><meta name="description" content="29卒向け。企業研究で集めた情報の出典・確認日・事実と推測を整理し、志望動機の根拠を見直せる無料シート。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-company-research-source-checker.html"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#172a40;background:#f3f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:22px 16px 70px}header{background:#103d69;color:white;padding:18px}header a{color:white}h1{font-size:clamp(1.5rem,5vw,2.2rem)}.card{background:white;border:1px solid #d9e4ed;border-radius:14px;padding:18px;margin:16px 0}label{display:block;font-weight:700;margin:12px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #a6bacb;border-radius:8px;font:inherit;background:white}textarea{min-height:86px}button{background:#1263a6;color:white;border:0;border-radius:8px;padding:12px 16px;font-weight:700;cursor:pointer;margin:5px 5px 5px 0}button.secondary{background:#425b70}.note{color:#4b5c6b;font-size:.94rem}#result{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f9fc;padding:15px;border-radius:8px}a{color:#1263a6}@media(max-width:400px){main{padding:14px 12px}button{width:100%;margin:5px 0}}</style></head><body><header><a href="./index.html">就活コンパス</a> ／ 29卒向け</header><main><h1>企業研究の情報源チェックシート</h1><p>企業研究で「どこで見た情報か」を忘れないためのワーク。事実・推測・未確認情報を区別して、ESや面接での思い込みを減らそう。</p><div class="card"><label for="company">企業名</label><input id="company" placeholder="例：株式会社〇〇"><label for="topic">調べた項目</label><select id="topic"><option>事業内容</option><option>強み・競争優位</option><option>仕事内容</option><option>社風・働き方</option><option>中期経営計画</option><option>その他</option></select><label for="claim">確認した内容</label><textarea id="claim" placeholder="具体的な数値や取り組みを記入"></textarea><label for="source">情報源の名称・URL</label><input id="source" placeholder="企業公式サイト、IR資料、採用ページなど"><label for="checked">確認日</label><input type="date" id="checked"><label for="confidence">情報の位置づけ</label><select id="confidence"><option>公式資料で確認した事実</option><option>第三者情報（追加確認が必要）</option><option>自分の推測・解釈</option><option>未確認</option></select><label for="use">志望動機・質問への活用</label><textarea id="use" placeholder="この情報から何を考えたか／社員に何を聞きたいか"></textarea><button id="add">記録に追加</button><button class="secondary" id="clear">入力をクリア</button></div><div class="card"><h2>整理した記録 <span id="count">0件</span></h2><p class="note">このページは入力を自動保存しません。ページを閉じる前にTXTを保存してください。外部への送信は行いません。</p><div id="result" aria-live="polite">まだ記録はありません。</div><button id="copy">記録をコピー</button><button id="download">TXT保存</button><button class="secondary" id="reset">全記録を削除</button></div><p class="note">※ 企業公式の採用情報やIR資料を優先し、確認日も残してください。就活コンパスは情報の真偽を自動判定しません。</p><p><a href="./29sotsu-start-guide-2026.html">29卒スタートガイドに戻る</a></p></main><script>"use strict";const ids=["company","topic","claim","source","checked","confidence","use"];let records=[];const el=id=>document.getElementById(id);const get=()=>Object.fromEntries(ids.map(id=>[id,el(id).value.trim()]));const render=()=>{el("count").textContent=records.length+"件";el("result").textContent=records.length?records.map((r,i)=>`【${i+1}件目】\n企業名：${r.company}\n項目：${r.topic}\n内容：${r.claim}\n情報源：${r.source}\n確認日：${r.checked||"未記入"}\n区分：${r.confidence}\n活用：${r.use}`).join("\n\n"):"まだ記録はありません。"};el("add").onclick=()=>{let r=get();if(!r.company||!r.claim||!r.source){alert("企業名・確認した内容・情報源を入力してください");return}records.push(r);render()};el("clear").onclick=()=>{ids.forEach(id=>{if(el(id).tagName==="SELECT")el(id).selectedIndex=0;else el(id).value=""})};el("copy").onclick=async()=>{if(!records.length)return;try{await navigator.clipboard.writeText(el("result").textContent);alert("コピーしました")}catch(e){alert("コピーできませんでした。TXT保存をお試しください")}};el("download").onclick=()=>{if(!records.length)return;const blob=new Blob([el("result").textContent],{type:"text/plain;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="29sotsu-company-research-notes.txt";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};el("reset").onclick=()=>{if(confirm("記録をすべて削除しますか？")){records=[];render()}};render();</script></body></html>

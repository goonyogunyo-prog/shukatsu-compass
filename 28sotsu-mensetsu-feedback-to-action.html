<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="28卒向け。面接で受けたフィードバックを事実・解釈・次の改善行動に分けて整理する無料ワーク。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-mensetsu-feedback-to-action.html"><title>28卒 面接フィードバック改善ワーク｜就活コンパス</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#182b41;background:#f3f7fb}*{box-sizing:border-box}body{margin:0}header,main,footer{max-width:820px;margin:auto;padding:22px}header a{color:#175a9e}h1{font-size:clamp(1.5rem,5vw,2.2rem)}.card{background:white;border:1px solid #dbe4ef;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 2px 8px #12283c0a}label{display:block;font-weight:700;margin:14px 0 5px}textarea,input,select{width:100%;border:1px solid #9baec4;border-radius:9px;padding:11px;font:inherit;background:white}textarea{min-height:95px;resize:vertical}button{background:#145f9c;color:white;border:0;border-radius:9px;padding:11px 15px;font:inherit;cursor:pointer;margin:5px 6px 5px 0}button.secondary{background:#e9f1fa;color:#163a61}button:focus-visible,a:focus-visible{outline:3px solid #f7a927;outline-offset:2px}.note{color:#52657c;font-size:.92rem;line-height:1.7}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f7fb;border-radius:10px;padding:14px;line-height:1.7}@media(max-width:500px){header,main,footer{padding:14px}.card{padding:15px}}</style></head><body><header><a href="./index.html">← 就活コンパス トップへ</a>　<a href="./28sotsu-guide-directory.html">28卒ガイド</a></header><main><p>28卒 / 面接準備 / 無料ワーク</p><h1>面接フィードバックを、次の改善行動に変える</h1><p>面接官の発言や自分の反省を混同せず、次の練習を1つ決めるワークです。合否理由の推測や自動判定はしません。</p><section class="card"><label for="company">企業名（任意）</label><input id="company" maxlength="120" placeholder="例：企業A"><label for="stage">選考段階</label><select id="stage"><option>一次面接</option><option>二次面接</option><option>最終面接</option><option>その他</option></select><label for="fact">① 実際に聞かれた質問・言われた言葉（事実）</label><textarea id="fact" placeholder="例：『なぜその方法を選んだのですか？』と質問された"></textarea><label for="answer">② 自分が実際に答えた内容</label><textarea id="answer" placeholder="覚えている範囲で記録"></textarea><label for="reflection">③ 自分の振り返り・仮説（事実と区別）</label><textarea id="reflection" placeholder="例：結論を先に話せなかったかもしれない"></textarea><label for="action">④ 次の面接までに試す具体的な行動</label><textarea id="action" placeholder="例：回答を60秒にまとめ、録音して1回聞き直す"></textarea><label for="deadline">実施予定日（任意）</label><input id="deadline" type="date"><label for="metric">⑤ 改善を確かめる方法</label><textarea id="metric" placeholder="例：結論を冒頭15秒以内に言えるか確認"></textarea></section><section class="card"><h2>次回までの確認</h2><label><input type="checkbox" class="check" style="width:auto"> 面接官の発言と自分の推測を区別した</label><label><input type="checkbox" class="check" style="width:auto"> 行動は自分で実行できる内容にした</label><label><input type="checkbox" class="check" style="width:auto"> 改善を確認する方法を決めた</label><button id="build">振り返りを作成</button><button id="copy" class="secondary">コピー</button><button id="save" class="secondary">TXT保存</button><button id="clear" class="secondary">入力を消去</button><p id="status" role="status" aria-live="polite" class="note"></p><pre id="result">入力後「振り返りを作成」を押してください。</pre></section><p class="note">入力内容はこのページ内でのみ処理し、自動保存・外部送信しません。コピー・TXTには企業名などの入力内容が含まれるため共有時に注意してください。フィードバックがなかった場合は、質問や回答など自分が確認できた事実だけを記録してください。</p></main><footer><a href="./index.html">就活コンパスへ戻る</a></footer><script>const ids=['company','stage','fact','answer','reflection','action','deadline','metric'];const el=id=>document.getElementById(id);let output='';function build(){const d=Object.fromEntries(ids.map(id=>[id,el(id).value.trim()]));const labels={company:'企業',stage:'選考段階',fact:'実際の質問・発言（事実）',answer:'実際の回答',reflection:'自分の振り返り（仮説）',action:'次の改善行動',deadline:'実施予定日',metric:'改善の確認方法'};output='【28卒 面接振り返り】\n'+ids.map(id=>labels[id]+'：'+(d[id]||'未入力')).join('\n')+'\n確認項目：'+[...document.querySelectorAll('.check')].filter(x=>x.checked).length+'/3';el('result').textContent=output;el('status').textContent='振り返りを作成しました。'}el('build').addEventListener('click',build);el('copy').addEventListener('click',async()=>{if(!output)build();try{await navigator.clipboard.writeText(output);el('status').textContent='コピーしました。'}catch(e){el('status').textContent='コピーできませんでした。テキストを選択してコピーしてください。'}});el('save').addEventListener('click',()=>{if(!output)build();const blob=new Blob([output],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='28sotsu-mensetsu-feedback.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);el('status').textContent='TXTを保存しました。'});el('clear').addEventListener('click',()=>{if(!confirm('すべての入力を消去しますか？'))return;ids.forEach(id=>{if(id==='stage')el(id).selectedIndex=0;else el(id).value=''});document.querySelectorAll('.check').forEach(x=>x.checked=false);output='';el('result').textContent='入力後「振り返りを作成」を押してください。';el('status').textContent='入力を消去しました。'});</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29卒 インターン振り返り・次の行動整理シート｜就活コンパス</title><meta name="description" content="29卒向け。インターンで学んだこと・社員の話・志望度の変化・次の行動を整理。TXT・JSON保存対応。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-internship-reflection-action-plan.html"><style>body{margin:0;background:#f4f7fb;color:#17243a;font:16px/1.65 system-ui,sans-serif}main{max-width:790px;margin:auto;padding:24px 16px 60px}h1{font-size:clamp(1.5rem,5vw,2.2rem);line-height:1.3}.panel{background:white;border:1px solid #d8e0eb;border-radius:16px;padding:22px;margin:18px 0}label{display:block;font-weight:700;margin:16px 0 5px}textarea,input,select{box-sizing:border-box;width:100%;padding:11px;border:1px solid #9aacc5;border-radius:9px;font:inherit}textarea{min-height:90px}button{border:0;border-radius:9px;background:#174c9e;color:white;padding:11px 15px;font:inherit;cursor:pointer;margin:6px 6px 6px 0}button.secondary{background:#41536e}a{color:#174c9e}small{color:#53637a}#status{min-height:1.6em}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main><p><a href="./index.html">← 就活コンパス トップ</a></p><h1>29卒 インターン振り返り・次の行動整理シート</h1><p>参加したインターンを「事実」「自分の感想」「次の行動」に分けて記録。応募条件・選考日程は必ず企業の公式案内を確認してください。</p><section class="panel"><label for="company">企業名</label><input id="company" maxlength="120" placeholder="例：〇〇株式会社"><label for="date">参加日</label><input id="date" type="date"><label for="program">参加したプログラム・仕事内容（事実）</label><textarea id="program" maxlength="3000"></textarea><label for="people">社員から聞いた話（事実・出典）</label><textarea id="people" maxlength="3000"></textarea><label for="impression">自分が感じた魅力・違和感（感想）</label><textarea id="impression" maxlength="3000"></textarea><label for="strength">自分の強みを発揮できた場面</label><textarea id="strength" maxlength="3000"></textarea><label for="questions">追加で確認したいこと</label><textarea id="questions" maxlength="3000"></textarea><label for="interest">参加後の志望度（自己評価）</label><select id="interest"><option value="">未選択</option><option>高まった</option><option>変わらない</option><option>下がった</option><option>まだ判断できない</option></select><label for="next">次の行動（企業研究・OB訪問・ESなど）</label><textarea id="next" maxlength="3000"></textarea><label for="deadline">次の行動の期限（任意）</label><input id="deadline" type="date"></section><section class="panel"><h2>振り返りのまとめ</h2><button id="make">まとめを表示</button><button id="txt">TXT保存</button><button id="json">JSONバックアップ</button><label for="restore">JSONから復元</label><input id="restore" type="file" accept="application/json,.json"><button class="secondary" id="clear">入力を消去</button><p id="status" role="status" aria-live="polite"></p><pre id="output"></pre><small>入力内容は自動保存・外部送信しません。TXT・JSONには個人情報が含まれる場合があります。共有に注意してください。</small></section><p><a href="./29sotsu-start-guide-2026.html">29卒スタートガイドに戻る</a></p></main><script>const ids=['company','date','program','people','impression','strength','questions','interest','next','deadline'];const $=id=>document.getElementById(id);const collect=()=>Object.fromEntries(ids.map(id=>[id,$(id).value]));const labels={company:'企業名',date:'参加日',program:'プログラム・仕事内容（事実）',people:'社員から聞いた話（事実）',impression:'自分の感想',strength:'強みを発揮した場面',questions:'追加で確認したいこと',interest:'参加後の志望度',next:'次の行動',deadline:'次の行動の期限'};const summary=()=>Object.entries(collect()).map(([k,v])=>labels[k]+'：'+(v||'未入力')).join('\n\n');function save(filename,text,type){const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('make').onclick=()=>{$('output').textContent=summary();$('status').textContent='まとめを表示しました'};$('txt').onclick=()=>{save('29sotsu-internship-reflection.txt',summary(),'text/plain;charset=utf-8');$('status').textContent='TXT保存を開始しました'};$('json').onclick=()=>{save('29sotsu-internship-reflection.json',JSON.stringify({version:1,data:collect()},null,2),'application/json');$('status').textContent='JSON保存を開始しました'};$('restore').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>100000)throw Error('ファイルが大きすぎます');const o=JSON.parse(await f.text());if(o.version!==1||!o.data||typeof o.data!=='object')throw Error('対応していない形式です');for(const id of ids){if(typeof o.data[id]!=='string'||o.data[id].length>3000)throw Error('入力形式が不正です')}for(const id of ids)$(id).value=o.data[id];$('output').textContent=summary();$('status').textContent='復元しました'}catch(err){$('status').textContent='復元失敗：'+err.message}finally{e.target.value=''}};$('clear').onclick=()=>{if(!confirm('このページの入力をすべて消去しますか？'))return;ids.forEach(id=>$(id).value='');$('output').textContent='';$('status').textContent='消去しました'};</script></body></html>

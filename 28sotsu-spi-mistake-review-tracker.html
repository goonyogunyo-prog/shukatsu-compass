<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28卒 SPI間違い直しノート｜就活コンパス</title><meta name="description" content="SPIの間違えた問題を分野・原因・再挑戦日で整理。復習優先度を確認できる無料ノート。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-spi-mistake-review-tracker.html"><style>:root{font-family:system-ui,sans-serif;color:#172b45;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#102b50;color:white;padding:24px max(18px,calc((100% - 900px)/2))}main{max-width:900px;margin:auto;padding:20px}section{background:white;border:1px solid #dce4ee;border-radius:16px;padding:20px;margin:18px 0}h1{font-size:clamp(24px,5vw,36px)}label{display:block;margin:12px 0;font-weight:650}input,select,textarea,button{font:inherit}input,select,textarea{display:block;width:100%;padding:11px;border:1px solid #a6b5c9;border-radius:9px;margin-top:6px}textarea{min-height:88px}button{border:0;border-radius:9px;background:#1355a3;color:white;padding:11px 15px;cursor:pointer;margin:5px 5px 5px 0}button.secondary{background:#53677f}.entry{border-top:1px solid #dce4ee;padding:16px 0;overflow-wrap:anywhere}.muted{color:#53677f}a{color:inherit}strong{color:#123b70}@media(max-width:520px){main{padding:12px}section{padding:14px}button{width:100%;margin:5px 0}}</style></head><body><header><a href="index.html">← 就活コンパス</a><h1>28卒 SPI間違い直しノート</h1><p>苦手を「原因」と「次の練習」に分けて整理</p></header><main><section><h2>間違えた問題を登録</h2><p class="muted">問題文の転載は避け、問題集のページ番号や自分の要約を記録してください。</p><form id="form"><label>分野<select id="category"><option>非言語・推論</option><option>非言語・割合</option><option>非言語・損益算</option><option>非言語・速度算</option><option>非言語・集合</option><option>言語・語彙</option><option>言語・長文</option><option>その他</option></select></label><label>教材・問題番号<input id="reference" maxlength="100" required placeholder="例：問題集P.42 問3"></label><label>間違えた原因<select id="cause"><option>解法を知らなかった</option><option>条件を読み違えた</option><option>計算ミス</option><option>時間不足</option><option>その他</option></select></label><label>次回の解き方・注意点<textarea id="memo" maxlength="1200" required placeholder="例：表を作って条件を整理する"></textarea></label><label>次の復習日<input id="due" type="date" required></label><button type="submit">ノートに追加</button></form></section><section><h2>復習リスト</h2><p id="summary" aria-live="polite"></p><label>表示<select id="filter"><option value="all">すべて</option><option value="due">期限到来・期限超過</option><option value="pending">未復習</option><option value="done">復習済み</option></select></label><div id="items"></div><button id="txt" type="button">TXT保存</button><button id="json" type="button">JSONバックアップ</button><label>JSON復元<input id="import" type="file" accept=".json,application/json"></label><button id="clear" class="secondary" type="button">全件削除</button><p class="muted">データはこのページ内だけで扱い、自動保存・外部送信しません。ページを閉じる前にJSONを保存してください。復元すると現在の内容は置き換わります。</p></section></main><script>"use strict";const $=id=>document.getElementById(id);let data=[];const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};$('due').value=today();function download(filename,content,type){const u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function render(){const now=today(),f=$('filter').value,visible=data.filter(x=>f==='all'||(f==='due'&&!x.done&&x.due<=now)||(f==='pending'&&!x.done)||(f==='done'&&x.done));$('summary').textContent=`登録 ${data.length}件 / 未復習 ${data.filter(x=>!x.done).length}件 / 期限到来 ${data.filter(x=>!x.done&&x.due<=now).length}件`;$('items').replaceChildren();visible.sort((a,b)=>Number(a.done)-Number(b.done)||a.due.localeCompare(b.due)).forEach(x=>{const d=document.createElement('div');d.className='entry';const h=document.createElement('strong');h.textContent=x.category+'｜'+x.reference;const p=document.createElement('p');p.textContent=`${x.cause} / 復習日：${x.due} / ${x.done?'復習済み':'未復習'}`;const m=document.createElement('p');m.textContent=x.memo;const toggle=document.createElement('button');toggle.textContent=x.done?'未復習に戻す':'復習済みにする';toggle.onclick=()=>{x.done=!x.done;render()};const del=document.createElement('button');del.className='secondary';del.textContent='削除';del.onclick=()=>{if(confirm('この記録を削除しますか？')){data=data.filter(y=>y.id!==x.id);render()}};d.append(h,p,m,toggle,del);$('items').append(d)});if(!visible.length)$('items').textContent='該当する記録はありません。'}$('form').onsubmit=e=>{e.preventDefault();data.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),category:$('category').value,reference:$('reference').value.trim(),cause:$('cause').value,memo:$('memo').value.trim(),due:$('due').value,done:false});$('form').reset();$('due').value=today();render()};$('filter').onchange=render;$('txt').onclick=()=>download('spi-review.txt',data.map(x=>[x.category,x.reference,x.cause,x.memo,x.due,x.done?'済':'未'].join(' | ')).join('\n'),'text/plain;charset=utf-8');$('json').onclick=()=>download('spi-review-backup.json',JSON.stringify({version:1,items:data},null,2),'application/json');$('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>1000000)throw Error('ファイルが大きすぎます');const obj=JSON.parse(await file.text());if(obj.version!==1||!Array.isArray(obj.items)||obj.items.length>500)throw Error('形式が違います');const valid=obj.items.every(x=>typeof x.id==='string'&&typeof x.category==='string'&&typeof x.reference==='string'&&x.reference.length<=100&&typeof x.cause==='string'&&typeof x.memo==='string'&&x.memo.length<=1200&&/^\d{4}-\d{2}-\d{2}$/.test(x.due)&&typeof x.done==='boolean');if(!valid)throw Error('データを確認してください');if(confirm('現在の記録をバックアップの内容に置き換えますか？')){data=obj.items;render()}}catch(err){alert('復元できません：'+err.message)}e.target.value=''};$('clear').onclick=()=>{if(confirm('すべての記録を削除しますか？')){data=[];render()}};render();</script></body></html>

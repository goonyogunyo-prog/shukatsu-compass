<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29卒 企業説明会メモ・比較シート｜就活コンパス</title><meta name="description" content="29卒向け。企業説明会で聞いた仕事内容・働き方・選考条件を事実と印象に分けて記録し、最大10社を比較できる無料ツール。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-company-session-notes-comparison.html"><style>body{font-family:system-ui,-apple-system,sans-serif;line-height:1.65;background:#f4f7fb;color:#1c2b40;margin:0}header,main,footer{max-width:850px;margin:auto;padding:20px}h1{font-size:clamp(1.5rem,4vw,2.2rem)}.panel{background:white;padding:20px;border:1px solid #d8e1ee;border-radius:14px;margin:16px 0}label{display:block;font-weight:650;margin-top:12px}input,textarea{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #9aabc0;border-radius:8px}textarea{min-height:80px}button{padding:11px 16px;margin:8px 8px 0 0;background:#1559a8;color:white;border:0;border-radius:9px;font:inherit;cursor:pointer}button.secondary{background:#53677f}.entry{border-top:1px solid #dce4ef;padding:12px 0;overflow-wrap:anywhere}small{color:#506079}a{color:#1559a8}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f3a647;outline-offset:2px}@media(max-width:480px){header,main,footer{padding:14px}.panel{padding:14px}}</style></head><body><header><a href="index.html">就活コンパス</a> / <a href="shukatsu-new-tools-directory.html">ツール一覧</a><h1>29卒｜企業説明会メモ・比較シート</h1><p>聞いた事実と自分の印象を分けて記録。最大10社を比較し、次に確認する質問を整理します。</p></header><main><section class="panel"><form id="form"><label for="company">企業名（必須）</label><input id="company" maxlength="80" required><label for="date">参加日</label><input id="date" type="date"><label for="facts">説明会で確認した事実（仕事内容・制度・応募条件など）</label><textarea id="facts" maxlength="3000" placeholder="例：公式説明資料で確認した内容。資料名も記録"></textarea><label for="impression">自分の印象・興味（主観）</label><textarea id="impression" maxlength="3000"></textarea><label for="questions">追加で確認したい質問</label><textarea id="questions" maxlength="2000"></textarea><label for="source">確認元・資料URL（任意）</label><input id="source" maxlength="500" placeholder="資料名や公式URL"><button type="submit">この企業を記録</button><button type="button" class="secondary" id="clear">入力をクリア</button></form></section><section class="panel"><h2>企業比較一覧 <span id="count">0 / 10</span></h2><div id="entries" aria-live="polite"></div><button id="export" type="button">比較メモをTXT保存</button><button id="copy" type="button" class="secondary">比較メモをコピー</button><button id="wipe" type="button" class="secondary">全記録を削除</button><p id="status" role="status"></p></section><p><small>このツールは企業の優劣や内定可能性を判定しません。募集条件は必ず企業公式情報で再確認してください。記録は利用端末のブラウザ内に保存されます。共有端末では利用に注意し、必要に応じて削除してください。</small></p></main><footer><a href="shukatsu-new-tools-directory.html">ツール一覧へ戻る</a></footer><script>"use strict";const KEY="sc29_company_session_notes_v1";const $=id=>document.getElementById(id);let records=[];try{const v=JSON.parse(localStorage.getItem(KEY)||"[]");if(Array.isArray(v))records=v.filter(x=>x&&typeof x.company==="string").slice(0,10)}catch(e){}const fields=["company","date","facts","impression","questions","source"];function save(){try{localStorage.setItem(KEY,JSON.stringify(records));return true}catch(e){$("status").textContent="端末保存に失敗しました。TXTで保存してください。";return false}}function report(){return "29卒 企業説明会メモ\n\n"+records.map((r,i)=>`${i+1}. ${r.company} (${r.date||"日付未記入"})\n確認した事実: ${r.facts}\n自分の印象: ${r.impression}\n追加質問: ${r.questions}\n確認元: ${r.source}`).join("\n\n")}function render(){const root=$("entries");root.replaceChildren();$("count").textContent=records.length+" / 10";if(!records.length){root.textContent="まだ記録がありません。";return}records.forEach((r,i)=>{const box=document.createElement("article");box.className="entry";const h=document.createElement("h3");h.textContent=r.company+"（"+(r.date||"日付未記入")+"）";box.append(h);[["確認した事実",r.facts],["自分の印象",r.impression],["次の質問",r.questions],["確認元",r.source]].forEach(([label,value])=>{if(!value)return;const p=document.createElement("p");const b=document.createElement("strong");b.textContent=label+": ";p.append(b,document.createTextNode(value));box.append(p)});const del=document.createElement("button");del.type="button";del.className="secondary";del.textContent="この企業を削除";del.addEventListener("click",()=>{if(confirm(r.company+" の記録を削除しますか？")){records.splice(i,1);save();render()}});box.append(del);root.append(box)})}$("form").addEventListener("submit",e=>{e.preventDefault();const r=Object.fromEntries(fields.map(f=>[f,$(f).value.trim()]));if(!r.company)return;if(records.length>=10){$("status").textContent="最大10社です。不要な記録を削除してください。";return}records.push(r);save();render();$("form").reset();$("status").textContent="記録を追加しました。"});$("clear").onclick=()=>$("form").reset();$("wipe").onclick=()=>{if(confirm("保存した全企業の記録を削除しますか？")){records=[];save();render();$("status").textContent="全記録を削除しました。"}};$("export").onclick=()=>{const blob=new Blob([report()],{type:"text/plain;charset=utf-8"});const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download="29sotsu-company-session-notes.txt";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(report());$("status").textContent="コピーしました。"}catch(e){$("status").textContent="コピーできませんでした。TXT保存をご利用ください。"}};render();</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="29卒向けガクチカSTAR整理シート。状況・課題・行動・結果を整理し、400字の文章を作成。入力内容は端末内で処理します。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-gakuchika-star-worksheet.html"><title>29卒 ガクチカSTAR整理・400字作成シート | 就活コンパス</title><style>:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#17233b;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#122b54;color:white;padding:24px max(16px,calc((100% - 860px)/2))}header a{color:#dbeafe}main{max-width:860px;margin:24px auto;padding:0 16px 48px}h1{font-size:clamp(1.5rem,4vw,2rem);margin:.5em 0}h2{font-size:1.15rem;margin:0 0 12px}.card{background:white;border:1px solid #dbe3ef;border-radius:16px;padding:20px;margin:18px 0;box-shadow:0 3px 12px #1731530a}label{display:block;font-weight:700;margin:12px 0 6px}textarea,input{width:100%;font:inherit;padding:12px;border:1px solid #9eacc0;border-radius:9px;background:white;color:#17233b}textarea{min-height:92px;resize:vertical}textarea:focus,input:focus{outline:3px solid #b7d5ff}small,.muted{color:#52627a}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:11px 16px;background:#174d9c;color:white;font-weight:700}button.secondary{background:#e9eff9;color:#183b70}button.danger{background:#fff0f0;color:#9b1b1b}.count{font-variant-numeric:tabular-nums;font-weight:700}#draft{min-height:220px}a{color:#174d9c}footer{margin-top:24px;color:#52627a;font-size:.9rem}@media(max-width:480px){.card{padding:15px}.actions button{flex:1 1 100%}}</style></head><body><header><a href="./index.html">← 就活コンパス トップへ</a><h1>29卒 ガクチカSTAR整理シート</h1><p>経験を「状況・課題・行動・結果」に分解して、伝わる文章へ。</p></header><main><section class="card"><h2>① 経験を整理する</h2><label for="theme">経験のテーマ</label><input id="theme" maxlength="120" placeholder="例：学園祭の企画責任者"><label for="s">S｜状況・背景</label><textarea id="s" placeholder="いつ、どんな組織で、何に取り組んだ？"></textarea><label for="t">T｜課題・目標</label><textarea id="t" placeholder="解決すべき課題と目標を具体的に"></textarea><label for="a">A｜自分の行動</label><textarea id="a" placeholder="自分が考え、実行したこと。工夫と理由も"></textarea><label for="r">R｜結果・学び</label><textarea id="r" placeholder="数値などの結果と、再現できる学び"></textarea><label for="strength">仕事に活かす強み</label><textarea id="strength" placeholder="経験から分かる、自分ならではの強み"></textarea><div class="actions"><button id="build" type="button">② 下書きを作成</button><button class="secondary" id="example" type="button">構成のヒント</button></div><p id="hint" class="muted" aria-live="polite"></p></section><section class="card"><h2>② 400字の下書きを調整する</h2><p class="muted">自動生成は素材の結合です。事実関係を確認し、自分の言葉で整えてください。</p><label for="draft">編集できる文章</label><textarea id="draft" maxlength="5000" placeholder="上の『下書きを作成』を押すか、直接入力してください。"></textarea><p class="count" id="count" aria-live="polite">0 / 400字</p><div class="actions"><button id="copy" type="button">文章をコピー</button><button id="txt" class="secondary" type="button">TXT保存</button><button id="json" class="secondary" type="button">JSONバックアップ</button><button id="restore" class="secondary" type="button">JSON復元</button><button id="clear" class="danger" type="button">全入力を削除</button></div><input id="file" type="file" accept="application/json,.json" hidden><p id="status" class="muted" role="status"></p></section><footer>入力内容はサーバーに送信しません。自動保存も行いません。ページを閉じる前にTXTまたはJSONで保存してください。<p><a href="./index.html">就活コンパスへ戻る</a></p></footer></main><script>(()=>{'use strict';const keys=['theme','s','t','a','r','strength','draft'];const el=id=>document.getElementById(id);const val=id=>el(id).value.trim();const status=msg=>el('status').textContent=msg;const count=()=>{const n=Array.from(el('draft').value).length;el('count').textContent=n+' / 400字'+(n>400?'（400字を超えています）':'')};el('draft').addEventListener('input',count);el('build').addEventListener('click',()=>{const chunks=[val('theme')?'私が学生時代に力を入れたことは、'+val('theme')+'である。':'',val('s'),val('t')?'課題は'+val('t')+'であった。':'',val('a')?'そこで私は'+val('a')+'。':'',val('r')?'その結果、'+val('r')+'。':'',val('strength')?'この経験から、'+val('strength')+'を培った。':''];el('draft').value=chunks.filter(Boolean).join('\n').replace(/。。/g,'。');count();status('下書きを作成しました。文末や重複を確認してください。')});el('example').addEventListener('click',()=>{el('hint').textContent='目安：状況10〜15%、課題15〜20%、行動40〜50%、結果・学び20〜30%。数字は実際に確認できるものだけ記入してください。'});function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}el('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(el('draft').value);status('文章をコピーしました。')}catch(e){el('draft').focus();el('draft').select();status('自動コピーできませんでした。選択した文章を手動でコピーしてください。')}});el('txt').addEventListener('click',()=>{download('29sotsu-gakuchika.txt',el('draft').value,'text/plain;charset=utf-8');status('TXTを保存しました。')});el('json').addEventListener('click',()=>{const data={version:1,values:Object.fromEntries(keys.map(k=>[k,el(k).value]))};download('29sotsu-gakuchika-backup.json',JSON.stringify(data,null,2),'application/json');status('JSONを保存しました。')});el('restore').addEventListener('click',()=>el('file').click());el('file').addEventListener('change',async()=>{const file=el('file').files[0];if(!file)return;try{if(file.size>1000000)throw Error('ファイルが大きすぎます');const data=JSON.parse(await file.text());if(data.version!==1||!data.values||typeof data.values!=='object'||keys.some(k=>typeof data.values[k]!=='string'))throw Error('形式が正しくありません');keys.forEach(k=>el(k).value=data.values[k]);count();status('JSONを復元しました。')}catch(e){status('復元できません：'+e.message)}finally{el('file').value=''}});el('clear').addEventListener('click',()=>{if(!confirm('すべての入力を削除しますか？'))return;keys.forEach(k=>el(k).value='');count();status('入力を削除しました。')});count()})();</script></body></html>

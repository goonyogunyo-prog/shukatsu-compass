<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>28卒 選考振り返り・次回改善アクションシート | 就活コンパス</title><meta name="description" content="28卒向け。書類・Webテスト・面接の選考結果を振り返り、事実と推測を分けて次回の改善行動を整理する無料ワークシート。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-senkou-result-evidence-nextstep.html"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#152638;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#14375b;color:white;padding:20px max(16px,calc((100% - 850px)/2))}header a{color:white}main{max-width:850px;margin:24px auto;padding:0 16px 60px}section{background:white;padding:22px;border-radius:14px;margin:18px 0;box-shadow:0 2px 12px #15263810}label{display:block;font-weight:700;margin:14px 0 6px}input,select,textarea{width:100%;border:1px solid #aab8c8;border-radius:8px;padding:11px;font:inherit}textarea{min-height:85px;resize:vertical}button{background:#12639b;color:white;border:0;border-radius:8px;padding:12px 16px;font:inherit;cursor:pointer;margin:6px 6px 6px 0}button.secondary{background:#506174}.note{color:#526272;font-size:.93rem;line-height:1.7}h1{line-height:1.35}h2{font-size:1.25rem}#result{white-space:pre-wrap;background:#eef4fa;padding:16px;border-radius:8px;overflow-wrap:anywhere}a{color:#12639b}@media(max-width:480px){section{padding:16px}header{padding:18px 16px}}</style></head><body><header><a href="./index.html">就活コンパス</a> / 28卒</header><main><h1>28卒｜選考振り返り・次回改善アクションシート</h1><p class="note">選考結果の理由は企業から説明されない限り断定できません。確認できた事実と自分の仮説を分け、次の応募で試す行動に落とし込みましょう。入力内容は自動送信されません。</p><section><h2>1. 選考の記録</h2><label for="company">企業名（任意）</label><input id="company" maxlength="100" placeholder="例：〇〇株式会社"><label for="stage">選考段階</label><select id="stage"><option>書類選考</option><option>Webテスト</option><option>一次面接</option><option>二次面接</option><option>最終面接</option><option>その他</option></select><label for="date">結果を確認した日</label><input id="date" type="date"><label for="outcome">結果</label><select id="outcome"><option>不通過</option><option>通過</option><option>結果待ち</option><option>辞退</option></select></section><section><h2>2. 事実と仮説を分ける</h2><label for="facts">確認できた事実（質問・所要時間・提出内容など）</label><textarea id="facts" placeholder="例：志望理由について深掘りが2問あった"></textarea><label for="feedback">企業から直接伝えられたフィードバック（なければ空欄）</label><textarea id="feedback"></textarea><label for="hypothesis">自分の仮説（原因の断定はしない）</label><textarea id="hypothesis" placeholder="例：具体例の説明が長かった可能性がある"></textarea></section><section><h2>3. 次回の改善計画</h2><label for="action">次回試す具体的な行動</label><textarea id="action" placeholder="例：志望理由を60秒で説明し、録音して確認する"></textarea><label for="deadline">実施予定日</label><input id="deadline" type="date"><label for="measure">改善を確かめる方法</label><textarea id="measure" placeholder="例：結論→理由→具体例の順で60秒以内に話せたか"></textarea><button id="generate">振り返りをまとめる</button><button id="copy" class="secondary">結果をコピー</button><button id="download" class="secondary">TXT保存</button><button id="reset" class="secondary">入力を消去</button><p id="status" class="note" role="status" aria-live="polite"></p><h2>まとめ</h2><div id="result" aria-live="polite">「振り返りをまとめる」を押すと表示されます。</div></section><p><a href="./28sotsu-guide-directory.html">28卒の記事一覧へ戻る</a></p></main><script>(()=>{'use strict';const ids=['company','stage','date','outcome','facts','feedback','hypothesis','action','deadline','measure'];const labels=['企業名','選考段階','結果確認日','結果','確認できた事実','企業からのフィードバック','自分の仮説（未確認）','次回試す行動','実施予定日','改善の確認方法'];const $=id=>document.getElementById(id);let summary='';function build(){summary='28卒 選考振り返り・改善計画\n'+ids.map((id,i)=>labels[i]+'：'+($(id).value.trim()||'未記入')).join('\n')+'\n※選考理由は企業から確認できない限り断定しない。';$('result').textContent=summary;$('status').textContent='まとめを作成しました。';} $('generate').addEventListener('click',build);$('copy').addEventListener('click',async()=>{if(!summary)build();try{await navigator.clipboard.writeText(summary);$('status').textContent='コピーしました。';}catch(e){$('status').textContent='コピーできませんでした。TXT保存をご利用ください。';}});$('download').addEventListener('click',()=>{if(!summary)build();const url=URL.createObjectURL(new Blob([summary],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='28sotsu-selection-review.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='TXTファイルを作成しました。';});$('reset').addEventListener('click',()=>{if(!confirm('入力内容を消去しますか？'))return;ids.forEach(id=>{$(id).value='';});$('stage').selectedIndex=0;$('outcome').selectedIndex=0;summary='';$('result').textContent='「振り返りをまとめる」を押すと表示されます。';$('status').textContent='入力を消去しました。';});})();</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29卒 インターン応募締切・提出準備プラン｜就活コンパス</title><meta name="description" content="29卒向け。インターン応募締切からES・Webテスト・提出確認の準備日を逆算し、チェックリストを無料で作成。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-internship-entry-deadline-planner.html"><style>body{font-family:system-ui,sans-serif;background:#f5f7fb;color:#182638;margin:0;line-height:1.7}main{max-width:760px;margin:auto;padding:24px 16px 64px}a{color:#1258a5}.panel{background:white;padding:24px;border-radius:16px;box-shadow:0 3px 16px #20344b14;margin:18px 0}label{display:block;font-weight:600;margin:14px 0 6px}input[type=date],input[type=text],textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #aab6c5;border-radius:8px;font:inherit}button{padding:11px 16px;border:0;border-radius:8px;background:#164c83;color:white;font-weight:700;margin:8px 8px 8px 0;cursor:pointer}.check{font-weight:400;padding:8px 0;border-bottom:1px solid #eee}.check input{width:18px;height:18px;vertical-align:middle}.muted{color:#546477}#result{white-space:pre-wrap;background:#f0f5fa;padding:14px;border-radius:8px}@media(max-width:480px){.panel{padding:16px}h1{font-size:1.65rem}}</style></head><body><main><nav><a href="index.html">就活コンパス</a> / 29卒</nav><h1>インターン応募締切・提出準備プラン</h1><p>締切から逆算して、ES・Webテスト・提出確認を整理。日付は目安です。実際の締切と受検条件は企業の公式案内を優先してください。</p><section class="panel"><label for="company">企業・プログラム名</label><input id="company" type="text" maxlength="100" placeholder="例：○○株式会社 夏季インターン"><label for="deadline">応募締切日</label><input id="deadline" type="date"><p class="muted">締切時刻は計算対象外です。23:59締切とは限らないため、必ず公式ページで確認してください。</p><button id="make">準備日を計算</button><div id="result" aria-live="polite">締切日を入力してください。</div><button id="copy">結果をコピー</button><button id="save">TXT保存</button></section><section class="panel"><h2>提出前チェック <span id="count">0 / 8</span></h2><label class="check"><input type="checkbox" class="item"> 募集要項と応募資格を公式ページで確認した</label><label class="check"><input type="checkbox" class="item"> 締切日時とタイムゾーンを確認した</label><label class="check"><input type="checkbox" class="item"> ES設問・文字数制限を確認した</label><label class="check"><input type="checkbox" class="item"> Webテストの有無と受検期限を確認した</label><label class="check"><input type="checkbox" class="item"> 提出書類・成績証明書などを確認した</label><label class="check"><input type="checkbox" class="item"> マイページの登録とログインを確認した</label><label class="check"><input type="checkbox" class="item"> 提出前の見直し時間を確保した</label><label class="check"><input type="checkbox" class="item"> 提出完了画面・メールを確認した</label><button id="reset">チェックをリセット</button><p class="muted">チェックはこのページ内だけで管理し、自動保存しません。提出完了は企業マイページ等で確認してください。</p></section><p><a href="29sotsu-start-guide-2026.html">29卒スタートガイドへ戻る</a></p></main><script>(()=>{'use strict';const $=id=>document.getElementById(id);const items=[...document.querySelectorAll('.item')];const fmt=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('/');const shift=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return fmt(x)};function build(){const s=$('deadline').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(s)){$('result').textContent='締切日を入力してください。';return}const d=new Date(s+'T12:00:00');if(!Number.isFinite(d.getTime())||d.getFullYear()!==Number(s.slice(0,4))||d.getMonth()+1!==Number(s.slice(5,7))||d.getDate()!==Number(s.slice(8,10))){$('result').textContent='有効な日付を入力してください。';return}const today=new Date();today.setHours(12,0,0,0);const days=Math.round((d-today)/86400000);const prefix=$('company').value.trim()||'応募先未入力';$('result').textContent=`${prefix}\n応募締切：${fmt(d)}（時刻は要確認）\n残り日数：${days}日\n\n${shift(d,-7)}：募集要項・設問を確認\n${shift(d,-5)}：ES下書き・必要書類準備\n${shift(d,-3)}：ES推敲・Webテスト受検条件確認\n${shift(d,-1)}：余裕を持って提出・完了確認\n\n※締切まで7日未満の場合は、過去日付の作業を今日から優先してください。`;}$('make').addEventListener('click',build);items.forEach(el=>el.addEventListener('change',()=>{$('count').textContent=items.filter(x=>x.checked).length+' / 8'}));$('reset').addEventListener('click',()=>{items.forEach(x=>x.checked=false);$('count').textContent='0 / 8'});const exportText=()=> $('result').textContent+'\n\n'+items.map(x=>(x.checked?'[x] ':'[ ] ')+x.parentElement.textContent.trim()).join('\n');$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(exportText());alert('コピーしました')}catch(e){alert('コピーできませんでした。TXT保存をご利用ください。')}});$('save').addEventListener('click',()=>{const blob=new Blob([exportText()],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='29sotsu-internship-plan.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});})();</script></body></html>

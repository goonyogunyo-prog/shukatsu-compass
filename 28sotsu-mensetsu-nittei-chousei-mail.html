<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28卒 面接日程調整メール作成ツール｜就活コンパス</title><meta name="description" content="28卒向け。面接の日程候補提示・日程変更・日程確定のメールを無料で作成。送信前チェック付き。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-mensetsu-nittei-chousei-mail.html"><style>:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#18283d;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#112a49;color:white;padding:18px max(18px,calc((100vw - 920px)/2))}header a{color:#fff}main{max-width:920px;margin:auto;padding:24px 16px 60px}h1{font-size:clamp(1.5rem,4vw,2.1rem)}.card{background:white;border:1px solid #d9e2ee;border-radius:14px;padding:20px;margin:18px 0}label{display:block;font-weight:650;margin:14px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #a8b8cc;border-radius:8px;font:inherit}textarea{min-height:110px;resize:vertical}button{border:0;border-radius:9px;background:#174e8b;color:white;padding:12px 17px;font:inherit;cursor:pointer;margin:6px 8px 6px 0}button.secondary{background:#e7eef7;color:#173a60}.hint{font-size:.91rem;color:#516378}.status{min-height:1.4em;color:#155b35}.checks label{font-weight:400;display:flex;align-items:flex-start;gap:8px}.checks input{width:auto;margin-top:5px}#output{min-height:300px;line-height:1.8}a{color:#195b9c}@media(max-width:480px){.card{padding:14px}button{width:100%;margin:5px 0}}</style></head><body><header><a href="./index.html">就活コンパス</a> ／ <a href="./28sotsu-guide-directory.html">28卒ガイド</a></header><main><h1>28卒 面接日程調整メール作成ツール</h1><p>候補日時の提示・日程変更のお願い・確定への返信を、必要事項から下書きにできます。送信は行いません。</p><section class="card"><h2>1. メールの種類と必要事項</h2><label for="kind">メールの種類</label><select id="kind"><option value="proposal">面接候補日時を提示</option><option value="change">決定済み日程の変更をお願い</option><option value="confirm">提示された日程を承諾・確認</option></select><label for="company">企業名</label><input id="company" placeholder="例：株式会社〇〇" maxlength="120"><label for="person">採用担当者名（不明なら採用ご担当者）</label><input id="person" placeholder="例：人事部 田中様" maxlength="120"><label for="self">自分の氏名</label><input id="self" placeholder="例：山田 太郎" maxlength="80"><label for="school">大学・学部（任意）</label><input id="school" placeholder="例：〇〇大学〇〇学部" maxlength="120"><label for="old">元の日程（変更の場合）</label><input id="old" placeholder="例：11月12日（木）14:00"><label for="dates">候補日時／確定日時</label><textarea id="dates" placeholder="例：11月16日（月）10:00〜12:00&#10;11月17日（火）13:00〜17:00"></textarea><label for="note">補足（任意）</label><textarea id="note" placeholder="例：オンライン面接のURLについてもご教示いただけますと幸いです。"></textarea><button id="make">件名・本文を作成</button><button class="secondary" id="clear">入力をクリア</button><p class="hint">日付・曜日の一致、時刻、タイムゾーン、所要時間は自動検証しません。企業からの正式案内を優先してください。</p></section><section class="card"><h2>2. 下書きを編集・保存</h2><label for="subject">件名</label><input id="subject" placeholder="作成後に表示"><label for="output">本文（編集可能）</label><textarea id="output" placeholder="上のボタンで下書きを作成します"></textarea><button id="copy">件名と本文をコピー</button><button class="secondary" id="download">TXT保存</button><p id="status" class="status" role="status" aria-live="polite"></p></section><section class="card checks"><h2>3. 送信前の確認</h2><label><input type="checkbox">企業名・担当者名・敬称が正しい</label><label><input type="checkbox">候補日・曜日・時間帯が正しい</label><label><input type="checkbox">企業からの案内や返信期限に沿っている</label><label><input type="checkbox">辞退・変更理由などに不要な個人情報がない</label><label><input type="checkbox">宛先・件名・署名を送信直前に確認した</label><p id="progress" class="hint">確認 0 / 5</p></section><p class="hint">入力内容はこのページ内で処理し、自動保存・外部送信しません。共有端末では保存したTXTやクリップボードの取り扱いに注意してください。メール送信機能はありません。</p><p><a href="./28sotsu-guide-directory.html">28卒ガイドに戻る</a></p></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),value=id=>$(id).value.trim();const lines=s=>s.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);function create(){const company=value('company')||'【企業名】',person=value('person')||'採用ご担当者様',self=value('self')||'【氏名】',school=value('school'),date=lines(value('dates')),old=value('old'),note=value('note'),kind=value('kind');let subject='',intro='',detail='';if(kind==='proposal'){subject='面接日程のご相談（'+self+'）';intro='面接の機会をいただき、誠にありがとうございます。';detail='下記の日時で調整可能でございます。\n'+(date.length?date.map((x,i)=>'第'+(i+1)+'希望：'+x).join('\n'):'【候補日時を記入】')+'\n\nご都合のよい日時をご指定いただけますと幸いです。'}else if(kind==='change'){subject='面接日程変更のお願い（'+self+'）';intro='面接日程をご調整いただき、ありがとうございます。';detail=(old?'予定いただいております'+old+'の面接につきまして、':'予定いただいております面接につきまして、')+'やむを得ない事情により、日程変更をご相談できないでしょうか。\nご迷惑をおかけし、大変申し訳ございません。\n\n代替候補日時：\n'+(date.length?date.map((x,i)=>'第'+(i+1)+'希望：'+x).join('\n'):'【候補日時を記入】')+'\n\n難しい場合は、貴社のご都合に合わせて再調整いたします。'}else{subject='面接日程の確認（'+self+'）';intro='面接日程のご案内をいただき、誠にありがとうございます。';detail='ご案内いただいた'+(date.join('、')||'【確定日時】')+'にて承知いたしました。\n当日はどうぞよろしくお願いいたします。'}$('subject').value=subject;$('output').value=company+'\n'+person+'\n\nお世話になっております。\n'+(school?school+'の':'')+self+'と申します。\n\n'+intro+'\n'+detail+(note?'\n\n'+note:'')+'\n\nお忙しいところ恐れ入りますが、何卒よろしくお願いいたします。\n\n'+(school?school+'\n':'')+self;$('status').textContent='下書きを作成しました。日時・敬称・署名を確認してください。'}$('make').addEventListener('click',create);$('clear').addEventListener('click',()=>{for(const id of ['company','person','self','school','old','dates','note','subject','output'])$(id).value='';$('kind').value='proposal';document.querySelectorAll('.checks input').forEach(c=>c.checked=false);update();$('status').textContent='入力をクリアしました。'});function content(){return '件名：'+value('subject')+'\n\n'+value('output')}$('copy').addEventListener('click',async()=>{if(!value('output'))return $('status').textContent='先に下書きを作成してください。';try{await navigator.clipboard.writeText(content());$('status').textContent='コピーしました。'}catch(e){$('status').textContent='コピーできませんでした。本文を選択して手動でコピーしてください。'}});$('download').addEventListener('click',()=>{if(!value('output'))return $('status').textContent='先に下書きを作成してください。';const url=URL.createObjectURL(new Blob([content()],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='28sotsu_mensetsu_nittei_mail.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='TXT保存を開始しました。'});function update(){const n=[...document.querySelectorAll('.checks input')].filter(x=>x.checked).length;$('progress').textContent='確認 '+n+' / 5'}document.querySelectorAll('.checks input').forEach(x=>x.addEventListener('change',update));})();</script></body></html>

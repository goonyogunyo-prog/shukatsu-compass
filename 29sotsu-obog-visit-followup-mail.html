<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29卒 OB・OG訪問のお礼メール作成・振り返りシート｜就活コンパス</title><meta name="description" content="29卒向け。OB・OG訪問のお礼メールを自分の学びから作成。送信前チェック、文字数、コピー、TXT保存、振り返りに対応。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-obog-visit-followup-mail.html"><style>:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#17243c;font-family:system-ui,-apple-system,sans-serif;line-height:1.7}main{max-width:780px;margin:auto;padding:22px 16px 70px}a{color:#174c9b}header{background:#122747;color:#fff;padding:18px}header a{color:#fff}.panel{background:#fff;border:1px solid #dbe3ef;border-radius:16px;padding:22px;margin:20px 0}label{display:block;font-weight:700;margin:14px 0 5px}input,textarea{display:block;width:100%;border:1px solid #9aaac2;border-radius:8px;padding:12px;font:inherit;background:#fff;color:#14233a}textarea{min-height:95px}button{border:0;border-radius:8px;background:#1856a8;color:#fff;padding:12px 16px;margin:7px 7px 7px 0;font:inherit;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f0ad32;outline-offset:2px}.secondary{background:#44546d}.hint{color:#52627b;font-size:.92rem}#out{min-height:260px;white-space:pre-wrap}ul{padding-left:22px}@media print{header,button,.hint{display:none}body{background:#fff}.panel{border:0;padding:0}}</style></head><body><header><a href="./index.html">就活コンパス</a> ／ 29卒 無料ツール</header><main><h1>OB・OG訪問のお礼メール作成＆振り返り</h1><p>訪問で実際に聞いたことを整理し、相手に合わせたお礼メールの下書きを作成。メールの送信は行いません。</p><section class="panel"><h2>1. 訪問内容を整理</h2><label for="person">お相手のお名前・敬称</label><input id="person" maxlength="80" placeholder="例：山田様"><label for="company">会社名・所属（任意）</label><input id="company" maxlength="100" placeholder="例：〇〇株式会社 営業部"><label for="date">訪問日（任意）</label><input id="date" type="date"><label for="learn">印象に残った学び・具体的なお話</label><textarea id="learn" maxlength="800" placeholder="例：顧客の課題を聞き取るために、最初に現場へ足を運ぶというお話"></textarea><label for="action">学びを踏まえて次に取り組むこと</label><textarea id="action" maxlength="500" placeholder="例：業界研究で顧客の課題を調べ、次回の面談で質問を整理する"></textarea><label for="sender">自分の氏名（任意）</label><input id="sender" maxlength="80" placeholder="例：明治大学 経済学部 〇〇"><button id="generate">お礼メールの下書きを作る</button><button class="secondary" id="clear">入力をクリア</button><p class="hint">実際に聞いていない内容は書かないでください。会社名・氏名・訪問日はメール送信前に確認してください。</p></section><section class="panel"><h2>2. メールを編集・保存</h2><label for="subject">件名</label><input id="subject" maxlength="160" value="OB・OG訪問のお礼"><label for="out">本文（自由に編集できます）</label><textarea id="out" aria-describedby="count"></textarea><p id="count" aria-live="polite">0文字</p><button id="copy">件名・本文をコピー</button><button id="download" class="secondary">TXT保存</button><p id="status" role="status" aria-live="polite"></p><h3>送信前チェック</h3><ul><li><label><input type="checkbox" style="display:inline;width:auto">宛名・敬称・会社名が正しい</label></li><li><label><input type="checkbox" style="display:inline;width:auto">学びは訪問で実際に聞いた内容である</label></li><li><label><input type="checkbox" style="display:inline;width:auto">誤字脱字・送信先・送信タイミングを確認した</label></li></ul><p class="hint">入力内容はこのページ内だけで処理し、自動保存・外部送信しません。共有端末では作業後に入力を消してください。メールソフトへの貼り付け・送信はご自身で行ってください。</p></section><p><a href="./29sotsu-start-guide-2026.html">29卒の就活ガイドに戻る</a></p></main><script>"use strict";const $=id=>document.getElementById(id);const ids=["person","company","date","learn","action","sender"];function val(id){return $(id).value.trim()}function update(){ $("count").textContent=Array.from($("out").value).length+"文字" }$("out").addEventListener("input",update);$("generate").addEventListener("click",()=>{const name=val("person")||"〇〇様";const co=val("company");const learned=val("learn")||"お仕事について具体的に伺えたこと";const action=val("action")||"本日学んだことを今後の企業研究に活かしてまいります";$("subject").value="OB・OG訪問のお礼";$("out").value=(co?co+"\n":"")+name+"\n\n本日はお忙しい中、貴重なお時間をいただき、誠にありがとうございました。\n\n特に、"+learned+"というお話が印象に残っております。\n"+action+"。\n\n改めまして、本日はありがとうございました。\n今後ともどうぞよろしくお願いいたします。\n\n"+(val("sender")||"氏名");update();$("status").textContent="下書きを作成しました。内容を確認・編集してください。"});$("clear").addEventListener("click",()=>{if(!confirm("入力内容をすべて消去しますか？"))return;ids.forEach(id=>$(id).value="");$("out").value="";$("subject").value="OB・OG訪問のお礼";update();$("status").textContent="入力を消去しました。"});function contents(){return "件名："+val("subject")+"\n\n"+$("out").value}$("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(contents());$("status").textContent="コピーしました。"}catch(e){$("status").textContent="コピーできませんでした。本文を選択して手動でコピーしてください。"}});$("download").addEventListener("click",()=>{const url=URL.createObjectURL(new Blob([contents()],{type:"text/plain;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download="obog-visit-thankyou.txt";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$("status").textContent="TXTを保存しました。"});update();</script></body></html>

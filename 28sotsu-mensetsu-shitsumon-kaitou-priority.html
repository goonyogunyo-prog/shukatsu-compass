<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28卒 面接質問の回答準備・優先順位チェック｜就活コンパス</title><meta name="description" content="28卒向け。面接質問の回答準備を12問で整理し、未準備の質問を優先表示。端末内で動作する無料チェックシート。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-mensetsu-shitsumon-kaitou-priority.html"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#17283a;background:#f5f8fc}*{box-sizing:border-box}body{margin:0}main{max-width:920px;margin:auto;padding:24px 16px 70px}a{color:#075f91}header{background:#102e49;color:white;padding:18px}header a{color:white}h1{font-size:clamp(1.5rem,4vw,2.1rem)}.lead{line-height:1.8}.panel{background:white;border:1px solid #dbe4ec;border-radius:14px;padding:20px;margin:16px 0}button,select{font:inherit;padding:10px 12px;border:1px solid #a9bccd;border-radius:8px;background:white;color:#16334d}button{cursor:pointer}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #2086bd}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.item{border-top:1px solid #e0e7ee;padding:16px 0}.item:first-child{border:0}.item h3{margin:0 0 10px;font-size:1rem}.item label{display:block;margin:8px 0}.item textarea{width:100%;min-height:85px;padding:10px;border:1px solid #adbfcd;border-radius:8px;font:inherit;resize:vertical}.small{font-size:.9rem;color:#536678}.pill{display:inline-block;background:#e7f2f8;border-radius:20px;padding:3px 9px;font-size:.8rem}#status{font-weight:700}footer{margin-top:24px;font-size:.85rem;color:#586a7a}@media(max-width:500px){.panel{padding:14px}.toolbar>*{flex:1 1 130px}}</style></head><body><header><a href="./index.html">就活コンパス</a>　/　<a href="./28sotsu-guide-directory.html">28卒ガイド</a></header><main><p class="pill">28卒 / 無料 / 登録不要</p><h1>面接質問の回答準備・優先順位チェック</h1><p class="lead">面接で聞かれやすい12問について、回答の準備状況とメモを整理。未準備の質問から取り組めます。質問は一般的な練習例で、実際の出題を保証するものではありません。</p><section class="panel"><div class="toolbar"><label>表示 <select id="filter"><option value="all">すべて</option><option value="todo">未準備のみ</option><option value="ready">準備済みのみ</option></select></label><button id="export">TXTに保存</button><button id="reset">全入力を削除</button></div><p id="status" aria-live="polite"></p><p class="small">回答メモは自動保存しません。ページを閉じる前にTXT保存してください。共有端末でも入力はこのページ内だけで扱います。</p></section><section class="panel" id="questions"></section><footer>面接対策の自己整理ツールです。応募先企業の募集要項や案内を必ず確認してください。入力内容は外部送信しません。</footer></main><script>"use strict";const questions=["自己紹介を1分でお願いします","学生時代に力を入れたことは何ですか","その活動で最も難しかったことは何ですか","課題に対してなぜその行動を選びましたか","チームで意見が対立したときどうしましたか","あなたの強みと具体例を教えてください","弱みと改善のための行動を教えてください","なぜこの業界を志望しますか","なぜ当社を志望しますか","入社後に取り組みたい仕事は何ですか","失敗経験とそこから学んだことは何ですか","最後に質問はありますか"];const entries=questions.map(()=>({ready:false,memo:""}));const root=document.getElementById("questions"),filter=document.getElementById("filter"),status=document.getElementById("status");function render(){root.replaceChildren();questions.forEach((q,i)=>{const e=entries[i];if(filter.value==="todo"&&e.ready||filter.value==="ready"&&!e.ready)return;const box=document.createElement("article");box.className="item";const title=document.createElement("h3");title.textContent=(i+1)+". "+q;const label=document.createElement("label");const cb=document.createElement("input");cb.type="checkbox";cb.checked=e.ready;cb.addEventListener("change",()=>{e.ready=cb.checked;render()});label.append(cb,document.createTextNode(" 回答を準備済みにする"));const ta=document.createElement("textarea");ta.placeholder="結論・具体例・数字・学びなどをメモ";ta.value=e.memo;ta.setAttribute("aria-label",q+"の回答メモ");ta.addEventListener("input",()=>{e.memo=ta.value});box.append(title,label,ta);root.append(box)});status.textContent="準備済み "+entries.filter(e=>e.ready).length+" / "+questions.length+"問";if(!root.childElementCount){root.textContent="この条件に一致する質問はありません。"}}filter.addEventListener("change",render);document.getElementById("export").addEventListener("click",()=>{const text=questions.map((q,i)=>(i+1)+". "+q+"\n準備: "+(entries[i].ready?"済み":"未準備")+"\n"+entries[i].memo).join("\n\n");const blob=new Blob(["面接質問の回答準備\n\n"+text],{type:"text/plain;charset=utf-8"});const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="28sotsu-mensetsu-priority.txt";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});document.getElementById("reset").addEventListener("click",()=>{if(!confirm("12問のチェックとメモをすべて消去しますか？"))return;entries.forEach(e=>{e.ready=false;e.memo=""});filter.value="all";render()});render();</script></body></html>

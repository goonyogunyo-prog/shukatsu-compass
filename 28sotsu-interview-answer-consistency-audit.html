<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28卒 面接回答の一貫性チェック｜就活コンパス</title><meta name="description" content="28卒向け。ESと面接回答の主張・具体例・数字・志望理由の矛盾を整理する無料チェックツール。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-interview-answer-consistency-audit.html"><style>:root{font-family:system-ui,sans-serif;color:#183047;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:840px;margin:auto;padding:24px 16px 60px}h1{font-size:clamp(1.5rem,4vw,2.2rem)}.card{background:white;border:1px solid #d9e2ed;border-radius:14px;padding:18px;margin:16px 0}label{display:block;font-weight:650;margin:12px 0 5px}textarea,input,select{width:100%;font:inherit;padding:10px;border:1px solid #9aabbc;border-radius:8px}textarea{min-height:85px}button{font:inherit;border:0;background:#1765a6;color:white;padding:11px 16px;border-radius:8px;margin:5px 6px 5px 0;cursor:pointer}button.secondary{background:#52667a}.note{color:#536477;font-size:.93rem}.result{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7fb;padding:14px;border-radius:9px}a{color:#1765a6}</style></head><body><main><nav><a href="index.html">就活コンパス トップ</a> / <a href="shukatsu-new-tools-directory.html">ツール一覧</a></nav><h1>28卒｜面接回答の一貫性チェック</h1><p>ESと面接で話す内容を並べて確認。AIによる自動採点ではなく、自分で矛盾を発見するためのチェックシートです。</p><section class="card"><label for="company">企業名（任意）</label><input id="company" autocomplete="off"><label for="topic">確認するテーマ</label><select id="topic"><option>志望動機</option><option>ガクチカ</option><option>自己PR</option><option>強み・弱み</option><option>就活の軸</option></select><label for="es">提出済みESの主張・根拠</label><textarea id="es" placeholder="ESに実際に書いた内容を要約"></textarea><label for="talk">面接で話す主張・根拠</label><textarea id="talk" placeholder="面接で話す予定の内容を要約"></textarea><label for="numbers">数字・時期・役割の整合性</label><textarea id="numbers" placeholder="人数、売上、担当範囲、時系列など"></textarea><label for="gap">違いがある部分と、その説明</label><textarea id="gap" placeholder="表現の違いか、事実の矛盾かを区別"></textarea><label for="next">次の修正・練習アクション</label><textarea id="next"></textarea><label><input type="checkbox" id="fact" style="width:auto"> 事実・数字・役割が一致している</label><label><input type="checkbox" id="reason" style="width:auto"> 主張と根拠がつながっている</label><label><input type="checkbox" id="why" style="width:auto"> 志望理由と就活の軸が矛盾しない</label><label><input type="checkbox" id="natural" style="width:auto"> 丸暗記ではなく自分の言葉で説明できる</label><button id="make">チェック結果を更新</button><button id="copy" class="secondary">結果をコピー</button><button id="download" class="secondary">TXT保存</button><button id="clear" class="secondary">入力を削除</button><p id="status" role="status" aria-live="polite" class="note"></p><h2>チェック結果</h2><div id="result" class="result"></div></section><p class="note">入力内容はこの端末のブラウザ内にのみ保存します。共用端末では入力しないでください。企業の非公開情報や個人情報の入力は避けてください。</p></main><script>const ids=['company','topic','es','talk','numbers','gap','next','fact','reason','why','natural'];const key='sc28-consistency-v1';const $=id=>document.getElementById(id);function values(){return Object.fromEntries(ids.map(id=>[id,$(id).type==='checkbox'?$(id).checked:$(id).value]))}function report(){const v=values(),checks=[['事実・数字・役割',v.fact],['主張と根拠',v.reason],['就活の軸との整合',v.why],['自分の言葉',v.natural]];return '28卒 面接回答の一貫性チェック\n企業：'+(v.company||'未入力')+'\nテーマ：'+v.topic+'\n\nES：'+v.es+'\n面接：'+v.talk+'\n数字・時期・役割：'+v.numbers+'\n差異の説明：'+v.gap+'\n次の行動：'+v.next+'\n\n確認：'+checks.filter(x=>x[1]).length+'/4\n'+checks.map(x=>(x[1]?'済':'未')+' '+x[0]).join('\n')}function render(){$('result').textContent=report()}function save(){try{localStorage.setItem(key,JSON.stringify(values()));$('status').textContent='この端末に保存しました'}catch(e){$('status').textContent='保存できませんでした。必要ならTXTで保存してください'}render()}for(const id of ids)$(id).addEventListener('input',save);$('make').onclick=render;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(report());$('status').textContent='コピーしました'}catch(e){$('status').textContent='コピーできませんでした。TXT保存を利用してください'}};$('download').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([report()],{type:'text/plain;charset=utf-8'}));a.href=url;a.download='28sotsu-interview-consistency.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('clear').onclick=()=>{if(!confirm('保存した入力をすべて削除しますか？'))return;for(const id of ids){if($(id).type==='checkbox')$(id).checked=false;else $(id).value=''}$('topic').value='志望動機';try{localStorage.removeItem(key)}catch(e){}$('status').textContent='削除しました';render()};try{const v=JSON.parse(localStorage.getItem(key)||'null');if(v&&typeof v==='object')for(const id of ids)if(Object.hasOwn(v,id)){if($(id).type==='checkbox')$(id).checked=!!v[id];else $(id).value=String(v[id])}}catch(e){}render();</script></body></html>

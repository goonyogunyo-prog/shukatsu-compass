<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28卒 最終面接準備チェックシート｜就活コンパス</title><meta name="description" content="28卒向け。最終面接の志望理由・競合比較・入社後の貢献・逆質問を整理。6項目チェック、TXT保存、端末内保存に対応。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/28sotsu-final-interview-preparation-check.html"><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#192b40;font:16px/1.65 system-ui,sans-serif}header{background:#14304f;color:white;padding:16px max(16px,calc((100vw - 850px)/2))}header a{color:#e1f1ff}main{max-width:850px;margin:auto;padding:20px 16px 70px}h1{font-size:clamp(1.5rem,4vw,2rem);line-height:1.35}section{background:white;border:1px solid #d7e2ec;border-radius:14px;padding:20px;margin:18px 0}label{display:block;font-weight:650;margin:14px 0 6px}input[type=text],textarea{display:block;width:100%;font:inherit;padding:10px;border:1px solid #879bb0;border-radius:8px}textarea{resize:vertical}.check{font-weight:400;display:flex;gap:9px;align-items:start}.check input{margin-top:7px;flex-shrink:0}button{font:inherit;background:#15558a;color:white;border:0;border-radius:8px;padding:11px 15px;margin:6px 7px 6px 0;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #e8a52e}.muted{color:#52657b}#status{min-height:1.5em}@media(max-width:480px){section{padding:15px}button{width:100%;margin:5px 0}}</style></head><body><header><a href="index.html">就活コンパス</a> / <a href="28sotsu-guide-directory.html">28卒ガイド</a></header><main><h1>28卒 最終面接準備チェックシート</h1><p>志望理由・企業理解・入社後の貢献を、自分の言葉で説明するための準備用シートです。企業情報は公式採用ページや正式案内で確認してください。</p><section><h2>回答の根拠を整理</h2><label for="company">企業名・面接日</label><input id="company" type="text"><label for="reason">なぜこの企業を志望するのか（自分の経験と接続）</label><textarea id="reason" rows="4"></textarea><label for="difference">競合他社と比較して確認した違い・出典</label><textarea id="difference" rows="4"></textarea><label for="contribution">入社後に取り組みたいこと・その根拠</label><textarea id="contribution" rows="4"></textarea><label for="challenge">自分の弱み・改善の行動</label><textarea id="challenge" rows="4"></textarea><label for="question">最終面接で確認したい逆質問</label><textarea id="question" rows="4"></textarea><label for="unknown">まだ確認できていない点・確認方法</label><textarea id="unknown" rows="4"></textarea></section><section><h2>提出・参加前の6項目</h2><label class="check"><input type="checkbox" class="ck" id="c0"> 志望理由が自分の経験と結びついている</label><label class="check"><input type="checkbox" class="ck" id="c1"> 競合比較は公式資料など出典を確認した</label><label class="check"><input type="checkbox" class="ck" id="c2"> 成果の数字を誇張していない</label><label class="check"><input type="checkbox" class="ck" id="c3"> 入社後の貢献が仕事内容とつながっている</label><label class="check"><input type="checkbox" class="ck" id="c4"> 逆質問は採用サイトで分かる内容だけになっていない</label><label class="check"><input type="checkbox" class="ck" id="c5"> 面接日時・接続先・持ち物を正式案内で確認した</label><p id="progress" aria-live="polite">確認済み 0 / 6</p></section><section><h2>記録と書き出し</h2><p class="muted">入力内容はこの端末のブラウザにのみ保存します。共有端末では保存しないでください。保存済みデータはこのページから削除できます。</p><button id="save" type="button">端末に保存</button><button id="export" type="button">TXTを書き出す</button><button id="clear" type="button">入力・端末保存を削除</button><p id="status" role="status"></p></section><p><a href="28sotsu-guide-directory.html">28卒ガイドへ戻る</a></p></main><script>(function(){'use strict';const key='sc_final_interview_28_v1',ids=["company", "reason", "difference", "contribution", "challenge", "question", "unknown"],labels=["企業名・面接日", "なぜこの企業を志望するのか（自分の経験と接続）", "競合他社と比較して確認した違い・出典", "入社後に取り組みたいこと・その根拠", "自分の弱み・改善の行動", "最終面接で確認したい逆質問", "まだ確認できていない点・確認方法"],checks=["志望理由が自分の経験と結びついている", "競合比較は公式資料など出典を確認した", "成果の数字を誇張していない", "入社後の貢献が仕事内容とつながっている", "逆質問は採用サイトで分かる内容だけになっていない", "面接日時・接続先・持ち物を正式案内で確認した"];const el=id=>document.getElementById(id);function data(){return {values:ids.map(id=>el(id).value),checks:checks.map((_,i)=>el('c'+i).checked)}}function progress(){el('progress').textContent='確認済み '+document.querySelectorAll('.ck:checked').length+' / 6'}document.querySelectorAll('.ck').forEach(x=>x.addEventListener('change',progress));try{const raw=localStorage.getItem(key);if(raw){const d=JSON.parse(raw);if(Array.isArray(d.values))ids.forEach((id,i)=>{el(id).value=String(d.values[i]||'').slice(0,20000)});if(Array.isArray(d.checks))checks.forEach((_,i)=>el('c'+i).checked===false&&(el('c'+i).checked=d.checks[i]===true))}}catch(e){el('status').textContent='保存データを読み込めませんでした。'}progress();el('save').addEventListener('click',()=>{try{localStorage.setItem(key,JSON.stringify(data()));el('status').textContent='この端末に保存しました。'}catch(e){el('status').textContent='保存できませんでした。TXT保存をご利用ください。'}});el('export').addEventListener('click',()=>{const d=data();const lines=['28卒 最終面接準備チェックシート','',...ids.map((id,i)=>labels[i]+'\n'+d.values[i]+'\n'),'確認項目',...checks.map((c,i)=>(d.checks[i]?'[済] ':'[未] ')+c)];const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='28sotsu-final-interview-prep.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);el('status').textContent='TXTを作成しました。'});el('clear').addEventListener('click',()=>{if(!confirm('入力と、このページの端末保存を削除しますか？'))return;ids.forEach(id=>el(id).value='');checks.forEach((_,i)=>el('c'+i).checked=false);try{localStorage.removeItem(key)}catch(e){}progress();el('status').textContent='入力と端末保存を削除しました。'});})();</script></body></html>

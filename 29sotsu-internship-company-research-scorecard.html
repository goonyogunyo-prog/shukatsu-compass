<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29卒 インターン企業研究・比較スコアカード｜就活コンパス</title><meta name="description" content="29卒向け。インターン応募先の仕事内容・学び・働き方・応募条件を事実と印象を分けて比較する無料ワーク。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/shukatsu-compass/29sotsu-internship-company-research-scorecard.html"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#14253b;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#102a4c;color:white;padding:20px max(18px,calc((100vw - 850px)/2))}main{max-width:850px;margin:25px auto;padding:0 16px 45px}section{background:white;padding:22px;border-radius:16px;margin:16px 0;box-shadow:0 3px 14px #152f4b0d}h1{font-size:clamp(1.5rem,5vw,2.1rem)}h2{font-size:1.15rem}label{display:block;font-weight:650;margin:12px 0 5px}input,textarea,select{width:100%;font:inherit;border:1px solid #b5c5d5;border-radius:8px;padding:11px;background:white}textarea{min-height:72px;resize:vertical}button{font:inherit;border:0;border-radius:9px;background:#174d91;color:white;padding:11px 16px;cursor:pointer;margin:5px 6px 5px 0}button.secondary{background:#e8eff7;color:#12365c}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f3a333}small,.muted{color:#53657b}a{color:#b9dcff}main a{color:#155391}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:580px}td,th{padding:10px;border-bottom:1px solid #d8e0e8;text-align:left;vertical-align:top}th{background:#e9f0f8}output{display:block;white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5fa;padding:14px;border-radius:10px;min-height:55px}@media(max-width:600px){.row{grid-template-columns:1fr}section{padding:16px}}</style></head><body><header><a href="./index.html">就活コンパス トップ</a> / 29卒</header><main><h1>29卒 インターン企業研究・比較スコアカード</h1><p>企業の公式情報と自分の印象を分けて記録し、応募先を比較するワークです。点数で内定可能性や企業の優劣を判定するものではありません。</p><section><h2>企業情報を入力</h2><label for="company">企業名</label><input id="company" maxlength="90" placeholder="例：株式会社〇〇"><label for="job">仕事内容（公式情報で確認した事実）</label><textarea id="job" maxlength="800"></textarea><label for="learning">インターンで学べること（募集要項で確認した内容）</label><textarea id="learning" maxlength="800"></textarea><label for="conditions">応募条件・締切・出典URL</label><textarea id="conditions" maxlength="800"></textarea><label for="impression">興味を持った理由・自分の印象</label><textarea id="impression" maxlength="800"></textarea><label for="next">未確認事項・次の行動</label><textarea id="next" maxlength="800"></textarea><div class="row"><div><label for="interest">興味（自分の主観）</label><select id="interest"><option value="未評価">未評価</option><option value="1">1 / 5</option><option value="2">2 / 5</option><option value="3">3 / 5</option><option value="4">4 / 5</option><option value="5">5 / 5</option></select></div><div><label for="fit">経験との接点（自分の主観）</label><select id="fit"><option value="未評価">未評価</option><option value="1">1 / 5</option><option value="2">2 / 5</option><option value="3">3 / 5</option><option value="4">4 / 5</option><option value="5">5 / 5</option></select></div></div><button id="add">比較表に追加</button><button id="clear" class="secondary">入力欄をクリア</button><p id="status" role="status" aria-live="polite"></p></section><section><h2>比較表 <span id="count">0件</span></h2><p class="muted">登録内容はこのブラウザ内に保存します。共有端末では使用後に削除してください。</p><div class="tablewrap"><table><thead><tr><th>企業名</th><th>仕事内容・学び</th><th>興味 / 接点</th><th>未確認事項</th><th>操作</th></tr></thead><tbody id="rows"><tr><td colspan="5">まだ登録されていません。</td></tr></tbody></table></div><button id="txt" class="secondary">TXT書き出し</button><button id="csv" class="secondary">CSV書き出し</button><button id="wipe" class="secondary">全件削除</button><h2>確認すべきこと</h2><output id="summary">企業を登録すると比較の観点を表示します。</output></section><p><a href="./29sotsu-start-guide-2026.html">29卒スタートガイドに戻る</a></p></main><script>(()=>{'use strict';const key='sc29_company_research_scorecard_v1',ids=['company','job','learning','conditions','impression','next','interest','fit'];const $=id=>document.getElementById(id);let items=[];try{let a=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(a))items=a.filter(x=>x&&typeof x==='object').slice(0,100)}catch(e){$('status').textContent='保存データを読み込めませんでした。'}function save(){try{localStorage.setItem(key,JSON.stringify(items));return true}catch(e){$('status').textContent='端末保存に失敗しました。TXT/CSVで控えを保存してください。';return false}}function td(tr,s){let el=document.createElement('td');el.textContent=s;tr.appendChild(el);return el}function render(){let body=$('rows');body.replaceChildren();$('count').textContent=items.length+'件';if(!items.length){let tr=document.createElement('tr'),cell=td(tr,'まだ登録されていません。');cell.colSpan=5;body.append(tr)}items.forEach((x,i)=>{let tr=document.createElement('tr');td(tr,x.company);td(tr,'仕事内容：'+x.job+' / 学び：'+x.learning);td(tr,x.interest+' / '+x.fit);td(tr,x.next);let cell=document.createElement('td'),b=document.createElement('button');b.className='secondary';b.textContent='削除';b.setAttribute('aria-label',x.company+'を削除');b.onclick=()=>{items.splice(i,1);save();render()};cell.append(b);tr.append(cell);body.append(tr)});$('summary').textContent=items.length?'比較時は①公式募集要項の事実 ②自分の興味 ③まだ確認していないことを分けて判断しましょう。応募締切・条件は必ず公式サイトで再確認してください。':'企業を登録すると比較の観点を表示します。'}function download(filename,content,type){let blob=new Blob(['\ufeff',content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('add').onclick=()=>{let x=Object.fromEntries(ids.map(k=>[k,$(k).value.trim()]));if(!x.company){$('status').textContent='企業名を入力してください。';$('company').focus();return}if(items.length>=100){$('status').textContent='登録上限は100件です。';return}items.push(x);save();render();$('status').textContent='比較表に追加しました。'};$('clear').onclick=()=>{ids.forEach(k=>$(k).value=k==='interest'||k==='fit'?'未評価':'');$('status').textContent='入力欄をクリアしました。'};const headers=['company','job','learning','conditions','impression','next','interest','fit'];$('txt').onclick=()=>download('29sotsu-company-research.txt',items.map((x,i)=>'【'+(i+1)+'】\n'+headers.map(k=>k+': '+(x[k]||'')).join('\n')).join('\n\n'),'text/plain;charset=utf-8');$('csv').onclick=()=>{let q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';download('29sotsu-company-research.csv',[headers.map(q).join(','),...items.map(x=>headers.map(k=>q(x[k])).join(','))].join('\r\n'),'text/csv;charset=utf-8')};$('wipe').onclick=()=>{if(!items.length)return;if(confirm('登録した企業情報をすべて削除しますか？')){items=[];save();render();$('status').textContent='全件削除しました。'}};render()})();</script></body></html>
